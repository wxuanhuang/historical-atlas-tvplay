name: Build TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # 也可以在网页上手动点「Run workflow」

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # 说明：ubuntu-latest 运行器已预装 Android SDK（ANDROID_HOME 已设好），
      # 不需要 android-actions/setup-android —— 那一步常因下载 cmdline-tools 超时而失败。
      # 这里只做两件事：打印 SDK 路径（便于排错）、接受 license 并补装 platform 34（已存在则秒过）。
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timeline-atlas-tv-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
