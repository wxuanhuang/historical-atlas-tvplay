/* ---------- 顶部「选择时代」下拉的数据与排序（直接读 DATA.eras，CSV 增删改即时联动） ----------
   排序规则：
     · 中国历史 —— 按起始年（同起始年再比结束年）
     · 外国历史 —— 先按文明链分组（chains.js 的链顺序：埃及 → 两河·西亚 → 伊斯兰·奥斯曼 →
       希腊·罗马·拜占庭 → 欧洲 → 南亚 → 东亚·日本 → 美洲 → 其他），链内再按「文明系列」聚合：
       名称里「·」之前的部分算同一系列（奥斯曼·崛起/极盛/衰落、古埃及·古王国/中王国/新王国/后期、
       中世纪·早期/盛期/晚期），系列内按起始年，系列之间也按各自最早的起始年。
       —— 于是同时期的不同文明挨在一起，同一文明的前后期不会被别家插开。 */
const ERA_PANEL_SKIP = { prehist: 1 };      // 史前：时间轴上不画，菜单里也不列
function eraPanelAll(){
  const all = (typeof DATA !== 'undefined' && DATA.eras) ? DATA.eras : [];
  const hid = (typeof HIDDEN_ERA_IDS !== 'undefined' && HIDDEN_ERA_IDS) ? HIDDEN_ERA_IDS : ERA_PANEL_SKIP;
  return all.filter(function(e){
    return e && e.id && !hid[e.id] && !ERA_PANEL_SKIP[e.id] &&
           typeof e.start === 'number' && typeof e.end === 'number' && !isNaN(e.start);
  });
}
// 「文明系列」键：名字里「·」前的部分（「古希腊·古典」→「古希腊」）；没有「·」就自成一系列。
// 少数「名字里没带系列前缀」的时代手工归到所属系列（否则会被同期文明插开），新增数据按需在此追加。
const ERA_SERIES_ALIAS = { '希腊化时代': '古希腊' };
function eraSeriesKey(e){
  const n = String((e && e.name) || (e && e.id) || '');
  if(ERA_SERIES_ALIAS[n]) return ERA_SERIES_ALIAS[n];
  const i = n.indexOf('·');
  return i > 0 ? n.slice(0, i) : n;
}
function eraPanelOrder(){
  const list = eraPanelAll();
  const byStart = function(a, b){
    return (a.start - b.start) || (a.end - b.end) ||
           String(a.name || '').localeCompare(String(b.name || ''), 'zh');
  };
  const china = list.filter(function(e){ return e.region !== 'foreign'; }).sort(byStart);
  const foreign = list.filter(function(e){ return e.region === 'foreign'; });

  const idOf = (window.AtlasChains && AtlasChains.idOf) ? AtlasChains.idOf : function(){ return 'other'; };
  const chainList = (window.AtlasChains && AtlasChains.list)
    ? AtlasChains.list().slice()
    : [{ id: 'other', name: '其他·跨区域' }];

  const buckets = {};
  foreign.forEach(function(e){
    const cid = idOf(e) || 'other';
    (buckets[cid] = buckets[cid] || []).push(e);
  });

  // 注册表里的链按定义顺序；数据里出现的「未注册链」接在后面兜底
  Object.keys(buckets).forEach(function(cid){
    if(!chainList.some(function(c){ return c.id === cid; })) chainList.push({ id: cid, name: cid });
  });

  const groups = [];
  chainList.forEach(function(ch){
    const arr = buckets[ch.id];
    if(!arr || !arr.length) return;
    const series = {}, keys = [];
    arr.forEach(function(e){
      const sk = eraSeriesKey(e);
      if(!series[sk]){ series[sk] = { key: sk, items: [], start: e.start, end: e.end }; keys.push(sk); }
      const s = series[sk];
      s.items.push(e);
      if(e.start < s.start) s.start = e.start;
      if(e.end > s.end) s.end = e.end;
    });
    // 系列之间按「系列的时间中点」排 —— 比按起点更贴近"时代关系近的靠近"：
    // 长跨度的系列（中世纪 500–1450、奥斯曼 1299–1922）不会把同期文明整段甩到末尾。
    const sarr = keys.map(function(k2){ return series[k2]; })
      .sort(function(a, b){
        return ((a.start + a.end) - (b.start + b.end)) || (a.start - b.start) ||
               String(a.key).localeCompare(String(b.key), 'zh');
      });
    sarr.forEach(function(s){ s.items.sort(byStart); });
    groups.push({ id: ch.id, name: ch.name || ch.id, series: sarr,
                  count: arr.length, start: Math.min.apply(null, arr.map(function(e){ return e.start; })) });
  });
  return { china: china, foreign: groups };
}

/* 2026-10-19：跳转到外国时代 / 定位外国事件前，先「筛选定位到它的文明链」
   —— 主轴上只留这条链（其它链暂时收起），目标色块/事件自然凸显，然后再推镜头过去。
   已经是这条链时不再重复设置，避免把用户的多选状态清掉。
   恢复方式：点外国轴左端的文明链圆点，浮层里有「全部」按钮。 */
function primeForeignChain(eraRef, done, kind){
  const finish = function(){ if(done) done(); };
  if(!eraRef || eraRef.region !== 'foreign' || !window.AtlasChains) return finish();
  const cid = AtlasChains.idOf(eraRef);
  const cur = (AtlasChains.getFilter ? AtlasChains.getFilter() : []);
  const already = (cur.length === 1 && cur[0] === cid);
  if(!already){
    try{ AtlasChains.setFilter([cid]); }catch(e){}
    const nm = (AtlasChains.nameOf ? AtlasChains.nameOf(cid) : cid);
    if(window.AtlasEditor && window.AtlasEditor.toast){
      window.AtlasEditor.toast('先定位到「' + nm + '」文明链，再' + (kind === 'event' ? '定位事件' : '聚焦时代'), 'info', 2400);
    }
  }
  // 已是该链时几乎不等；刚切换时停一下，让人看清"主轴只剩这条链"
  setTimeout(finish, already ? 60 : 340);
}

let __jumpToken = 0;   // 连续跳转时只让最后一次生效（防止筛链等待期间排队的旧跳转后到）

// 跳转：固定缩放至 450%，以该时代中心居中
// eraRef：可选。外国时代会先被筛选定位到它所在的文明链（否则跳过去也看不到这个块）
// onDone：可选。镜头停稳后回调（后续开抽屉等时序以它为准，不再硬编码毫秒）
function jumpTo(t, eraRef, onDone){
  const tk = ++__jumpToken;
  __tlFocus = null;   // 切换到别的时代 / 下拉跳转 → 解除「事件联动高亮」
  // 2026-10-19：跳到外国轴时代 → 地图基准改世界全景；跳中国轴 → 中国全景
  if(t && t.region) mapBase = (t.region === 'foreign') ? 'world' : 'china';
  // 2026-10-19：下拉 / 搜索跳转后，色块要停在「被点击」的选中态（金色描边 + 其余变暗），
  // 并让合轴同步高亮该区间；renderT1 每次重绘都会按 selectedEraId 恢复，动画过程中也不会丢
  if(t && t.id){
    selectedEraId = t.id;
    const sel = (typeof ERAS_SORTED !== 'undefined' && ERAS_SORTED.find) ? ERAS_SORTED.find(e=>e.id===t.id) : null;
    highlightAxisSection(sel || t);
  } else {
    selectedEraId = null;
    clearAxisHighlight();
  }
  // 2026-10-19：外国时代 → 先筛选定位到它的文明链，再聚焦色块（中国时代不受影响，立即执行）
  primeForeignChain(eraRef, function(){ if(tk !== __jumpToken) return; jumpToNow(t, onDone); });
}

// 真正推镜头的那一步（从 jumpTo 拆出：便于实现"先筛链、后聚焦"）
function jumpToNow(t, onDone){
  const cx = (t.start + t.end) / 2;
  const k = 4.5;  // 固定 450%
  const x = xScale(cx);
  const tx = CFG.W/2 - x*k;

  // 获取当前变换作为插值起点
  const cur = d3.zoomTransform(svg.node());
  const startX = cur.x, startK = cur.k;
  const endX = tx, endK = k;

  const iX = d3.interpolateNumber(startX, endX);
  const iK = d3.interpolateNumber(startK, endK);

  svg.transition().duration(700).ease(d3.easeCubicInOut)
    .tween('era-jump', function(){
      return function(tt){
        const cx2 = iX(tt);
        const ck = iK(tt);
        const trans = d3.zoomIdentity.translate(cx2, 0).scale(ck);
        zoomLayer.attr('transform', `translate(${cx2}, 0) scale(${ck}, 1)`);
        renderGrid(trans);
        renderT1(trans);
        renderT2(trans);
        renderT3(trans);
        updateZoomDisplay(ck);
        updateZoomHint(ck);
      };
    })
    .on('end', function(){
      internalZoom = true;
      svg.call(zoom.transform, d3.zoomIdentity.translate(endX, 0).scale(endK));
      internalZoom = false;
      if(onDone) onDone();
    });
}

/* ---------- 2026-10-18：时代脉络事件轴 → 主轴联动 ----------
   点击脉络图上的事件节点时：
     ① 先把主轴平滑放大到 1500%，并把该事件居中、高亮（看清相邻事件，帮助记忆时间坐标）；
     ② 动画结束（略停一下让高亮被看见）后，再联动地图标点 + 打开事件抽屉；
     ③ 关闭抽屉后主轴**保持**联动后的缩放/位置/高亮，不复位。
   全程用 d3.easeCubicInOut 插值，和 jumpTo 同一套渲染路径，不闪不跳。 */
const TL_FOCUS_K = 15;        // 联动缩放：1500%
const TL_FOCUS_DUR = 820;     // 主轴联动动画时长
let __tlFocusTimer = null;    // 联动后续动作的延时句柄（重复点击时取消）

function applyTimelineTransform(tx, k){
  const trans = d3.zoomIdentity.translate(tx, 0).scale(k);
  zoomLayer.attr('transform', `translate(${tx}, 0) scale(${k}, 1)`);
  renderGrid(trans);
  renderT1(trans);
  renderT2(trans);
  renderT3(trans);
  updateZoomDisplay(k);
  updateZoomHint(k);
}

// 把第 year 年移到屏幕正中所需的平移量
function tlCenterX(year, k){
  return CFG.W / 2 - xScale(year) * k;
}

/* focusTimelineEvent(ev, done)
   ev: { year, era, region, name, parent? } —— 目标事件（子事件请传父事件 key）
   done: 动画结束后的回调（地图聚焦 + 打开抽屉） */
function focusTimelineEvent(ev, done){
  if(!ev || typeof ev.year !== 'number'){ if(done) done(); return; }
  const k = TL_FOCUS_K;
  const tx = tlCenterX(ev.year, k);
  __tlFocus = {
    key: evKey(ev),
    parentKey: ev.parentKey || null,
    year: ev.year,
    region: ev.region || 'china',
    name: ev.name || ''
  };
  const cur = d3.zoomTransform(svg.node());
  const iX = d3.interpolateNumber(cur.x, tx);
  const iK = d3.interpolateNumber(cur.k || 1, k);
  svg.interrupt('tl-focus');                 // 覆盖上一次未完成的联动动画
  if(__tlFocusTimer){ clearTimeout(__tlFocusTimer); __tlFocusTimer = null; }
  svg.transition('tl-focus').duration(TL_FOCUS_DUR).ease(d3.easeCubicInOut)
    .tween('tl-focus', function(){
      return function(tt){ applyTimelineTransform(iX(tt), iK(tt)); };
    })
    .on('end', function(){
      internalZoom = true;
      svg.call(zoom.transform, d3.zoomIdentity.translate(tx, 0).scale(k));
      internalZoom = false;
      currentTransform = d3.zoomIdentity.translate(tx, 0).scale(k);
      applyTimelineTransform(tx, k);          // 末帧对齐，确保高亮节点已按 1500% 重绘
      if(done){
        // 停 320ms，让学习者看清"事件被居中的那一帧"，再联动地图与抽屉
        __tlFocusTimer = setTimeout(function(){ __tlFocusTimer = null; done(); }, 320);
      }
    });
}

/* 2026-10-19：「跳转并放大显示某个事件」的统一入口
   —— 脉络图节点、顶部搜索、地图搜索结果都走这里：
   ① 若已有抽屉打开，先收起、露出主轴（地图保持不动）；
   ② 主轴平滑放大到 1500%、把该事件居中并高亮；
   ③ 320ms 后再联动地图标点 + 打开事件抽屉。
   evInfo: { year, era, region, name, parentKey? } */
function linkTimelineToEvent(evInfo, openFn){
  if(drawerOpen){
    drawerOpen = false;
    window.__drawerEraId = null;
    if(window.__atlasUpdateTerritory){ try{ window.__atlasUpdateTerritory(); }catch(e){} }
    drawer.classList.remove('open');
    setTimelineHidden(false);
    if(window.__atlasUpdateTimeMarkers){ try{ window.__atlasUpdateTimeMarkers(); }catch(e){} }
  }
  // 2026-10-19：外国事件 → 先把它的「文明链」筛出来（主轴只剩这条链），再放大定位事件图标
  const eraRef = (function(){
    const list = (typeof ERAS_SORTED !== 'undefined' && ERAS_SORTED) ? ERAS_SORTED : [];
    for(let i=0;i<list.length;i++){ if(list[i].id === evInfo.era) return list[i]; }
    if((evInfo.region || 'china') !== 'foreign') return null;   // 中国事件不参与分链
    if(window.AtlasChains && AtlasChains.findEra){
      const h = AtlasChains.findEra(evInfo);
      if(h) return h;
    }
    // 兜底：era 写成名称/旧 id 没对上时，按年份落位——只在「唯一命中」时才信，避免误配
    if(typeof evInfo.year === 'number'){
      const cand = list.filter(e => e.region === 'foreign' && e.start <= evInfo.year && evInfo.year <= e.end);
      if(cand.length === 1) return cand[0];
    }
    return null;
  })();
  primeForeignChain(eraRef, function(){
    focusTimelineEvent(evInfo, function(){
      __flowOpening = true;
      try{ if(openFn) openFn(); } finally { __flowOpening = false; }
    });
  }, 'event');
}

/* 下拉菜单里把某个时代标成选中（搜索命中时代时用，让入口与结果一致） */
function markEraPicked(era){
  if(!era || !era.id) return;
  selectedEraId = era.id;
  currentEra = era;
  document.querySelectorAll('.era-item.selected').forEach(n=>n.classList.remove('selected'));
  const items = document.querySelectorAll('.era-item');
  for(let i = 0; i < items.length; i++){
    if(items[i].dataset && items[i].dataset.id === era.id){ items[i].classList.add('selected'); break; }
  }
  eraTrigger.innerHTML = era.name + ' ▾';
}

// 构建下拉菜单条目（每次打开都按最新数据重排，CSV 导入/改年份后立刻生效）
function buildEraPanel(){
  const chinaCol = document.getElementById('era-items-china');
  const foreignCol = document.getElementById('era-items-foreign');
  if(!chinaCol || !foreignCol) return;
  chinaCol.innerHTML = ''; foreignCol.innerHTML = '';
  const order = eraPanelOrder();

  const makeItem = (e, col) => {
    const el = document.createElement('div');
    el.className = 'era-item';
    el.textContent = e.name;
    el.dataset.id = e.id;
    el.title = formatYear(e.start) + ' — ' + formatYear(e.end);
    if(currentEra && currentEra.id === e.id) el.classList.add('selected');
    el.addEventListener('mouseenter', ()=> playSound(880, 0.04, 'sine'));
    el.addEventListener('click', ()=>{
      playSound(1320, 0.12, 'triangle');
      document.querySelectorAll('.era-item.selected').forEach(n=>n.classList.remove('selected'));
      el.classList.add('selected');
      currentEra = e;                                  // 存真实时代对象（带 id / region / 起止年）
      eraTrigger.innerHTML = e.name + ' ▾';
      jumpTo(e, (window.AtlasChains && AtlasChains.findEra) ? AtlasChains.findEra(e) : null);
      eraPanel.classList.add('hidden');
    });
    col.appendChild(el);
  };

  // 中国历史：按时间
  order.china.forEach(e => makeItem(e, chinaCol));
  // 外国历史：按文明链分组，组内「文明系列」聚拢
  order.foreign.forEach(g => {
    const h = document.createElement('div');
    h.className = 'era-group';
    h.textContent = g.name;
    foreignCol.appendChild(h);
    g.series.forEach(s => s.items.forEach(e => makeItem(e, foreignCol)));
  });
}

const searchInput = document.getElementById('search-input');
function doSearch(){
  if(window.AtlasLoader && AtlasLoader.loadedCount()<10){ AtlasLoader.loadAll().then(doSearch); return; }
  const q = searchInput.value.trim();
  if(!q) return;
  let hit = DATA.events.find(e=>e.name.includes(q));
  let isEra = false;
  if(!hit){ hit = DATA.eras.find(e=>e.name.includes(q)); isEra = !!hit; }
  if(!hit) hit = DATA.events.find(e=>e.figures && e.figures.some(f=>f.includes(q)));
  // 2026-10-19：也支持搜「子事件」——命中后按子事件打开（高亮其父事件节点，与脉络图一致）
  if(!hit){
    for(const p of DATA.events){
      const c = (p.children || []).find(x => x.name.includes(q));
      if(c){
        hit = Object.assign({}, c, {
          era: p.era, region: c.region || p.region,
          detail: c.detail || c.blurb || p.detail
        });
        hit.__parent = p;
        break;
      }
    }
  }
  if(!hit){ searchInput.placeholder = '未找到：'+q; searchInput.value=''; return; }

  if(isEra){
    /* 2026-10-19：搜到「时代」→ 先筛文明链（外国），再跳转让色块居中 + 保持被选中的高亮态 */
    jumpTo(hit, (window.AtlasChains && AtlasChains.findEra) ? AtlasChains.findEra(hit) : null, function(){
      setTimeout(()=>{ openDrawer(hit, 'era'); }, 80);   // 镜头停稳再开抽屉
    });
    markEraPicked(hit);                      // 下拉入口同步显示为选中
  } else {
    /* 搜到「事件」→ 与抽屉里点「时代脉络」事件节点完全一致：
       先筛文明链（外国）→ 主轴放大到 1500% 让该事件居中高亮 → 停一下 → 联动地图标点 + 打开事件抽屉 */
    linkTimelineToEvent({
      year: hit.year,
      era: hit.era,
      region: hit.region || 'china',
      name: hit.name,
      // 搜到的是子事件 → 高亮其父事件节点（子事件本身在 1500% 尚未进入 L3 显示区间）
      parentKey: hit.__parent ? evKey(hit.__parent) : null
    }, function(){
      openDrawer(hit, 'event');
    });
  }
}
document.getElementById('search-btn').onclick = doSearch;
searchInput.addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });

/* ---------- 窗口变化时重建静态布局（背景/边框/轴线/地图） ---------- */
function relayoutStatic(){
  // 背景三层
  const bgRects = bg.selectAll('rect');
  bgRects.attr('width', CFG.W);
  bgRects.nodes()[0].setAttribute('height', CFG.AXIS.mapTop);
  bgRects.nodes()[1].setAttribute('y', CFG.AXIS.mapTop);
  bgRects.nodes()[1].setAttribute('height', CFG.AXIS.mapBot - CFG.AXIS.mapTop);
  bgRects.nodes()[2].setAttribute('y', CFG.AXIS.mapBot);
  bgRects.nodes()[2].setAttribute('height', CFG.H - CFG.AXIS.mapBot);
  bgRects.nodes()[3].setAttribute('height', CFG.H);
  // 边框
  border.select('rect').attr('width', CFG.W-8).attr('height', CFG.H-8);
  // 裁剪区
  mapClip.select('rect').attr('width', CFG.W);
  setMapClip(!!drawerOpen);   // 抽屉开着（地图聚焦中）就保持全屏裁剪
  // 轴线
  const ys = [CFG.AXIS.chinaY, CFG.AXIS.mainY, CFG.AXIS.foreignY];
  const lines = axisLines.selectAll('line').data(ys);
  lines.attr('y1', d=>d).attr('y2', d=>d).attr('x2', CFG.W-40);
  const dots = axisLines.selectAll('circle').data(ys);
  dots.attr('cy', d=>d);
  dots.nodes()[0] && dots.nodes()[0].setAttribute('cx', 40);
  dots.nodes()[1] && dots.nodes()[1].setAttribute('cx', 40);
  dots.nodes()[2] && dots.nodes()[2].setAttribute('cx', 40);
  dots.nodes()[3] && dots.nodes()[3].setAttribute('cx', CFG.W-40);
  dots.nodes()[4] && dots.nodes()[4].setAttribute('cx', CFG.W-40);
  dots.nodes()[5] && dots.nodes()[5].setAttribute('cx', CFG.W-40);
  // 轴标签
  const lbls = axisLabels.selectAll('.axis-label').data(ys);
  lbls.attr('y', d=>d);
  // 三轴入口图标跟随窗口高度（中国=★ / 合轴=◆）
  axisLabels.selectAll('.axis-entry-ico-wrap').each(function(){
    const ax = this.getAttribute('data-axis');
    this.setAttribute('transform', 'translate(40,' + (ax === 'china' ? CFG.AXIS.chinaY : CFG.AXIS.mainY) + ')');
  });
  // 重新拟合地图投影并重绘所有地理路径（球面、经纬网、国家、州界）
  projection.fitExtent([[0, CFG.AXIS.mapTop], [CFG.W, CFG.AXIS.mapBot]], {type:'Sphere'});
  buildGeoPaths();                       // 投影改变 → 重建预投影缓存
  mapLayer.selectAll('path').attr('d', pathGen);
  // 重定位国家标签
  if(worldFeatures){
    mapLayer.select('g.country-labels').selectAll('text.clabel')
      .each(function(d){ placeCountryLabel(d, this); });
    updateCountryLabels();
  }
  // 重定位地图标题到最下方南大洋海洋位置
  const titleY = CFG.AXIS.mapTop + (CFG.AXIS.mapBot - CFG.AXIS.mapTop) * 0.88;
  mapLayer.selectAll('text.map-title').attr('x', CFG.W/2).attr('y', titleY);
}

/* ============================================================
   2026-10-26 · 中国世界遗产（仅新增，不改动既有机能）
   点「中国」轴标签 → 浮层列出 61 项；点某项在地图标注：
   · 主遗产 = 五角星
   · 多点位遗产（跨省/跨度大）= 各代表性分景点标菱形
   · 单点位遗产 = 只标星，悬停星标下拉列出分景点
   星/菱形点击 → 抽屉详情（含知识扩展）+ 地图聚焦
   ============================================================ */
const HD = (window.__ATLAS_HERITAGE || { list: [] }).list || [];
const heritageLayer = svg.append('g').attr('class','heritageLayer').attr('clip-path','url(#mapClip)');
const gHeritage = heritageLayer.append('g').attr('class','h-points');
let heritageSel = null, hpCat = 'all';

function hXY(item, spot){
  const lat = (spot && spot.lat != null) ? spot.lat : item.lat;
  const lng = (spot && spot.lng != null) ? spot.lng : item.lng;
  if(lat == null || lng == null) return null;
  return projectMap(lng, lat);
}
function hEvent(item, spot){
  const title = spot ? spot.name : item.name;
  const head = spot ? `<div style="font-size:15px;color:#f3d896;margin-bottom:6px;">${spot.name}</div>
      <div>${spot.desc || ''}</div>
      <div style="border-top:1px dashed #5a3a1c;margin:10px 0 8px;"></div>` : '';
  const ext = `<div style="margin-top:10px;font-size:12px;color:#bfae86;line-height:1.75;">
      <b style="color:#f3d896;">世界遗产 · ${item.cat}</b><br>
      涉及省市：${item.prov || '—'}<br>
      本项共 ${item.spots.length} 处景点：${item.spots.map(x => x.name).join('、')}</div>`;
  return { name: title, blurb: item.name + ' · ' + item.cat,
    detail: head + `<div>${item.detail || ''}</div>` + ext,
    lat: (spot && spot.lat != null) ? spot.lat : item.lat,
    lng: (spot && spot.lng != null) ? spot.lng : item.lng,
    figures: [], keywords: [item.name, title], place: item.prov, region: 'china',
    noYear: true };   // 遗产条目没有单一事件年份 → 抽屉不显示年份行（正文里已有时序说明）
}
function hpDim(on){
  const p = document.getElementById('hp'); if(!p) return;
  if(on) p.classList.add('dim'); else p.classList.remove('dim');
}
function hOpen(item, spot){
  const d = hEvent(item, spot);
  openDrawer(d, 'event');
  hpDim(true);                     // 面板虚化到 1/4：视野让给地图 + 右侧抽屉
  if(d.lat == null || d.lng == null) return;
  let lat = d.lat, lng = d.lng, span = null;
  // 多点位遗产（点列表项时）：取所有已标注分景点的包络中心，并按实际跨度取景
  if(!spot && item.multi){
    const ps = item.spots.filter(x => x.lat != null);
    if(ps.length > 1){
      const la = ps.map(x => x.lat), lo = ps.map(x => x.lng);
      const la0 = Math.min.apply(null, la), la1 = Math.max.apply(null, la);
      const lo0 = Math.min.apply(null, lo), lo1 = Math.max.apply(null, lo);
      lat = (la0 + la1) / 2; lng = (lo0 + lo1) / 2;
      const dy = (la1 - la0) * 111.32;
      const dx = (lo1 - lo0) * 111.32 * Math.cos(lat * Math.PI / 180);
      span = Math.max(800, Math.min(4000, Math.sqrt(dx * dx + dy * dy) * 1.35));
    }
  }
  // 抽屉占右侧 1/3 → 聚焦中心回到「左侧 2/3 窗口」的中心（原来的 1/3 处）
  focusMap(lat, lng, 5, d.name, 1800, span, FOCUS_CENTER_X);
}
/* ============================================================
   2026-10-27 · 标点文字避让
   相邻景点（北京中轴线、大运河各点、长城关隘等）地理位置很近，
   文字若一律挂在图标右侧就会互相压住。这里给每个标签 12 个候选方位
   （右/左/上/下 + 四个斜角 + 四个远档），按「主遗产优先」依次挑选：
     ① 上次用的方位若还空着就继续用（粘性，避免地图动画中方位来回跳）；
     ② 否则选第一个不撞的方位（撞 = 与其它文字或其它图标重叠）；
     ③ 全撞时取重叠面积最小的那个，位置挤到远档则补一条细引线。
   坐标就是屏幕像素 —— g.h-pt 外层 scale(k)、内层 scale(1/k) 互相抵消。 */
const H_LBL_FS = 10;
const H_LBL_H  = 11.5;
const H_LBL_CANDS = [
  { dx:   9, dy:   4, a: 'start'  },   // 右
  { dx:  -9, dy:   4, a: 'end'    },   // 左
  { dx:   0, dy:  -8, a: 'middle' },   // 上
  { dx:   0, dy:  14, a: 'middle' },   // 下
  { dx:   8, dy:  -6, a: 'start'  },   // 右上
  { dx:  -8, dy:  -6, a: 'end'    },   // 左上
  { dx:   8, dy:  13, a: 'start'  },   // 右下
  { dx:  -8, dy:  13, a: 'end'    },   // 左下
  { dx:  24, dy:   4, a: 'start'  },   // 远右
  { dx: -24, dy:   4, a: 'end'    },   // 远左
  { dx:   0, dy: -17, a: 'middle' },   // 远上
  { dx:   0, dy:  24, a: 'middle' },   // 远下
  { dx:  23, dy: -15, a: 'start'  },   // 远右上
  { dx: -23, dy: -15, a: 'end'    },   // 远左上
  { dx:  23, dy:  21, a: 'start'  },   // 远右下
  { dx: -23, dy:  21, a: 'end'    },   // 远左下
  { dx:  42, dy:   4, a: 'start'  },   // 更远（带引线）
  { dx: -42, dy:   4, a: 'end'    },
  { dx:   0, dy: -32, a: 'middle' },
  { dx:   0, dy:  39, a: 'middle' }
];
const H_LEAD_FROM = 16;                 // 从第几档开始画引线
let __hPick = {};                       // key → 上次选中的方位序号
function hLabelW(s){
  let w = 0;
  const t = String(s == null ? '' : s);
  for (let i = 0; i < t.length; i++) {
    const c = t.charCodeAt(i);
    if (c > 0x2E80) w += H_LBL_FS;                             // 汉字 / 全角
    else if (/[iIl1.,:;'|!]/.test(t[i])) w += H_LBL_FS * 0.34;
    else if (/[A-Z]/.test(t[i])) w += H_LBL_FS * 0.68;
    else w += H_LBL_FS * 0.56;
  }
  return w;
}
function hLabelRect(sx, sy, c, w){
  const x0 = c.a === 'start' ? sx + c.dx : (c.a === 'end' ? sx + c.dx - w : sx + c.dx - w / 2);
  const y0 = sy + c.dy - H_LBL_FS * 0.85;
  return { x0: x0, y0: y0, x1: x0 + w, y1: y0 + H_LBL_H };
}
function hOverlapArea(a, b, pad){
  const p = (pad == null ? 0.8 : pad);
  const dx = Math.min(a.x1 + p, b.x1 + p) - Math.max(a.x0 - p, b.x0 - p);
  const dy = Math.min(a.y1 + p, b.y1 + p) - Math.max(a.y0 - p, b.y0 - p);
  return (dx > 0 && dy > 0) ? dx * dy : 0;
}
/* 标签超出窗口的长度：点在地图边缘时，优先把字排在窗口内侧 */
function hOutLen(r){
  return Math.max(0, 2 - r.x0) + Math.max(0, r.x1 - (CFG.W - 2))
       + Math.max(0, 2 - r.y0) + Math.max(0, r.y1 - (CFG.H - 2));
}
function layoutHLabels(pts){
  if (!pts || !pts.length) return;
  // 主遗产先挑位；其余按数据顺序（分景点按清单顺序，靠前的更靠前）
  const order = pts.slice().sort(function(a, b){
    return (b.d.kind === 'main' ? 1 : 0) - (a.d.kind === 'main' ? 1 : 0);
  });
  const icons = pts.map(function(p){
    return { x0: p.sx - 6.6, y0: p.sy - 6.6, x1: p.sx + 6.6, y1: p.sy + 6.6 };
  });
  const placed = [];
  order.forEach(function(p){
    const key = (p.d.item && p.d.item.id ? p.d.item.id : '') + '|' + (p.d.spot ? p.d.spot.name : '#main');
    const txt = p.d.kind === 'main' ? p.d.item.name : p.d.spot.name;
    const w = hLabelW(txt);
    let pick = -1, bestArea = Infinity, bestScore = Infinity, bestIdx = 0;
    const prev = __hPick[key];
    if (prev != null) {                              // ① 粘性：沿用上次方位
      const r = hLabelRect(p.sx, p.sy, H_LBL_CANDS[prev], w);
      let ok = hOutLen(r) === 0;                     // 跑到窗口外也不算好位置
      for (let i = 0; i < icons.length && ok; i++) { if (hOverlapArea(r, icons[i]) > 0) { ok = false; } }
      if (ok) for (let i = 0; i < placed.length; i++) { if (hOverlapArea(r, placed[i]) > 0) { ok = false; break; } }
      if (ok) { pick = prev; bestArea = 0; }
    }
    if (pick < 0) {                                  // ② 找第一个空位，否则记最小重叠
      for (let i = 0; i < H_LBL_CANDS.length; i++) {
        const r = hLabelRect(p.sx, p.sy, H_LBL_CANDS[i], w);
        let ov = 0;                                   // 纯重叠（决定要不要藏字）
        for (let j = 0; j < icons.length; j++) ov += hOverlapArea(r, icons[j]);
        for (let j = 0; j < placed.length; j++) ov += hOverlapArea(r, placed[j]);
        const out = hOutLen(r);
        const score = ov + out * H_LBL_H * 3;          // 出界只影响排序，不算重叠
        if (score < bestScore - 1e-6) { bestScore = score; bestArea = ov; bestIdx = i; }
        if (ov === 0 && out === 0) { pick = i; bestArea = 0; break; }
      }
      if (pick < 0) pick = bestIdx;
      // 迟滞：新位置没有明显更优就保持原方位，免得地图动画过程中字来回跳
      // （新位置完全干净时一律采用，不迟滞）
      if (prev != null && pick !== prev && bestScore > 0) {
        const pr = hLabelRect(p.sx, p.sy, H_LBL_CANDS[prev], w);
        let pv = 0;
        for (let j = 0; j < icons.length; j++) pv += hOverlapArea(pr, icons[j]);
        for (let j = 0; j < placed.length; j++) pv += hOverlapArea(pr, placed[j]);
        const pScore = pv + hOutLen(pr) * H_LBL_H * 3;
        if (bestScore > pScore * 0.7) { pick = prev; bestArea = pv; }
      }
    }
    // ③ 实在挤不下（非主遗产）：先藏字，地图放大撑开空间后会自己回来
    const hideIt = (p.d.kind !== 'main') && bestArea > (w * H_LBL_H) * 0.55;
    if (hideIt) {
      p.t.style('display', 'none');
      const l0 = p.g.select('line.h-lead'); if (!l0.empty()) l0.style('display', 'none');
      __hPick[key] = pick;
      return;                                        // 不占位
    }
    p.t.style('display', null);
    const c = H_LBL_CANDS[pick];
    if (prev !== pick) {
      p.t.attr('x', c.dx).attr('y', c.dy)
         .attr('text-anchor', c.a === 'middle' ? 'middle' : (c.a === 'end' ? 'end' : 'start'));
    }
    // ④ 最远档：补一条细引线，说明这行字属于哪个图标
    const lead = p.g.select('line.h-lead');
    if (!lead.empty()) {
      if (prev !== pick) {
        if (pick >= H_LEAD_FROM) {
          const ex = c.a === 'middle' ? 0 : (c.dx > 0 ? c.dx - 5 : c.dx + 5);
          const ey = c.dy < 0 ? c.dy + 5 : (c.dy > 10 ? c.dy - 5 : c.dy);
          lead.style('display', null).attr('x1', 0).attr('y1', 0).attr('x2', ex).attr('y2', ey);
        } else {
          lead.style('display', 'none');
        }
      }
    }
    placed.push(hLabelRect(p.sx, p.sy, c, w));
  });
}
function hTransform(){
  const mt = (typeof mapTransform !== 'undefined' && mapTransform) ? mapTransform : { tx: 0, ty: 0, k: 1 };
  const kk = mt.k || 1;
  gHeritage.attr('transform', `translate(${mt.tx},${mt.ty}) scale(${mt.k})`);
  const pts = [];
  gHeritage.selectAll('g.h-pt').each(function (d) {
    const p = hXY(d.item, d.spot); if (!p) return;
    d3.select(this).attr('transform', `translate(${p[0]},${p[1]}) scale(${1 / kk})`);
    pts.push({
      d: d, g: d3.select(this), t: d3.select(this).select('text.h-lbl'),
      sx: p[0] * kk + mt.tx, sy: p[1] * kk + mt.ty
    });
  });
  layoutHLabels(pts);
}
function renderHeritage(){
  gHeritage.selectAll('*').remove();
  __hPick = {};                     // 换遗产 → 标签方位重新挑
  if (!heritageSel) return;
  const it = heritageSel;
  const pts = [{ kind: 'main', item: it, spot: null }];
  if (it.multi) it.spots.filter(s => s.lat != null).forEach(s => pts.push({ kind: 'sub', item: it, spot: s }));
  const sel = gHeritage.selectAll('g.h-pt').data(pts).enter().append('g')
    .attr('class', 'h-pt').attr('data-kind', d => d.kind).style('cursor', 'pointer');
  sel.append('line').attr('class', 'h-lead').style('display', 'none');   // 远档标签的引线
  sel.append('path')
    .attr('d', d => d.kind === 'main' ? iconPathOf('star', 7.6, 'star') : iconPathOf('diamond', 4.8, 'diamond'))
    .attr('class', d => d.kind === 'main' ? 'h-star' : 'h-diamond');
  sel.append('text').attr('class', 'h-lbl')
    .attr('x', 10).attr('y', 4).attr('font-size', 10)
    .attr('fill', d => d.kind === 'main' ? '#3a2a12' : '#0e4b5c')
    .attr('stroke', '#fffaf0').attr('stroke-width', 2.2)
    .text(d => d.kind === 'main' ? d.item.name : d.spot.name);
  sel.on('click', function (ev, d) {
      ev.stopPropagation();
      if (TOUCH_UI.first(ev, 'hp:' + (d.spot ? d.spot.name : d.item.name), this)) return;   // 触屏第一下：先看分景点
      hideHTip(); hOpen(d.item, d.spot);
    })
     .on('mouseenter', function (ev, d) { if (d.kind === 'main' && !d.item.multi) showHTip(ev, d.item); })
     .on('mouseleave', function () { hideHTip(300); });

}
function showHTip(ev, item){
  const tip = document.getElementById('hp-tip'); if (!tip) return;
  keepHTip();
  tip.innerHTML = `<div class="t-h">${item.name} · 共 ${item.spots.length} 处分景点（点击查看）</div>` +
    item.spots.map((s, i) => `<div class="t-i" data-i="${i}">${s.name}</div>`).join('');
  tip.style.display = 'block';
  // 鼠标移进列表 → 保持显示；移出 → 稍后收起
  tip.onmouseenter = keepHTip;
  tip.onmouseleave = function(){ hideHTip(200); };
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 10, ev.clientX + 14) + 'px';
  tip.style.top = Math.min(window.innerHeight - h - 10, ev.clientY - 12) + 'px';
  tip.querySelectorAll('.t-i').forEach(el => {
    el.addEventListener('click', () => { hideHTip(); hOpen(item, item.spots[+el.dataset.i]); });
  });
}
/* 2026-10-27：下拉列表要能被点中 —— 鼠标从星标移到列表会触发 mouseleave，
   所以改为「延迟隐藏」，移进列表就取消。之前是立刻隐藏，导致分景点永远点不到。 */
let __htipTimer = null;
function hideHTip(delay){
  const t = document.getElementById('hp-tip');
  clearTimeout(__htipTimer);
  __htipTimer = setTimeout(function(){ if (t) t.style.display = 'none'; }, Math.max(0, delay || 0));
}
function keepHTip(){ clearTimeout(__htipTimer); }

/* 2026-11-04：遗产面板按「首次建设 / 开发年代」从早到晚排序
   年代表在 data/heritage-year.js（负数为公元前），原始遗产数据不动。
   自然遗产没有"建设"，用最早的人类开发或建立保护区的年份。 */
function hpYearOf(x){ const T = window.__ATLAS_HERITAGE_YEAR || {}; const y = T[x.id]; return (typeof y === 'number') ? y : null; }
function hpYearText(y){
  if (y == null) return '';
  if (y < -10000) return '约 ' + Math.round(-y / 10000) + ' 万年前';   // 史前遗址（周口店等）
  return y < 0 ? ('前 ' + Math.abs(y) + ' 年') : (y + ' 年');
}
function hpRenderList(){
  const box = document.getElementById('hp-list'); if (!box) return;
  const arr = HD.filter(x => {
    if (hpCat === 'all') return true;
    if (hpCat === 'cul')  return /文化/.test(x.cat) && !/双/.test(x.cat) && !/^自然/.test(x.cat);
    if (hpCat === 'nat')  return /自然/.test(x.cat) && !/文化/.test(x.cat);
    if (hpCat === 'mix')  return /双/.test(x.cat);
    return x.cat === hpCat;
  });
  arr.sort((a, b) => {                       // 年代升序；无年代的排末尾，同年代按原录入顺序
    const ya = hpYearOf(a), yb = hpYearOf(b);
    if (ya == null && yb == null) return HD.indexOf(a) - HD.indexOf(b);
    if (ya == null) return 1;
    if (yb == null) return -1;
    return ya - yb || (HD.indexOf(a) - HD.indexOf(b));
  });
  box.innerHTML = arr.map((x, idx) => {
    const i = idx + 1;
    const isNat = /自然/.test(x.cat) && !/文化/.test(x.cat);
    const isMix = /双/.test(x.cat);
    const cls = isMix ? 'mix' : (isNat ? 'nat' : 'cul');
    const badge = isMix ? '双' : (isNat ? '自' : '文');
    const yr = hpYearText(hpYearOf(x));
    return `<div class="hp-item ${heritageSel && heritageSel.id === x.id ? 'on' : ''}" data-id="${x.id}">
      <span class="hp-no">${i}</span>
      <div><div class="hp-nm">${x.name}<span class="hp-cat ${cls}">${badge}</span></div>
      <div class="hp-sub">${yr ? yr + ' · ' : ''}${(x.prov || '').slice(0, 24)}${x.multi ? ' · 多点位' : ''}</div></div></div>`;
  }).join('');
  box.querySelectorAll('.hp-item').forEach(el => {
    el.addEventListener('click', () => {
      const it = HD.find(x => x.id === el.dataset.id); if (!it) return;
      heritageSel = it; hpRenderList(); renderHeritage();
      hpDim(false);                 // 面板恢复清晰（此时看地图，重心在右侧 2/3）
      if (it.lat != null) focusMap(it.lat, it.lng, 5, it.name, 1800, null, FOCUS_CENTER_X_HP);
    });
  });
}
function openHeritagePanel(){ const p = document.getElementById('hp'); if (!p) return; p.classList.add('on'); hpRenderList(); }
function closeHeritagePanel(){
  const p = document.getElementById('hp');
  if (p) { p.classList.remove('on'); p.classList.remove('dim'); }
  hideHTip();
  // 2026-10-27：面板关了，地图上的星标 / 菱形也一起撤掉，不常驻
  heritageSel = null; renderHeritage();
}

/* 交互绑定：用原生 addEventListener（不被其它脚本的 d3 .on 覆盖），

function bindHeritageDom(){

   图片模式做成「画布」：滚轮以鼠标位置为锚点缩放、按住拖动平移、双击在「适应窗口 / 100%」间切换。 */
let __pvMode = 'pdf';
const PVC = { tx: 0, ty: 0, k: 1, fit: 1 };
function pvPane(){ return document.getElementById('pv-pane'); }
function pvImg(){ return document.getElementById('pv-img'); }
function pvApply(){
  const img = pvImg(); if (!img) return;
  img.style.transform = 'translate(' + PVC.tx.toFixed(2) + 'px,' + PVC.ty.toFixed(2) + 'px) scale(' + PVC.k.toFixed(4) + ')';
  const pct = document.getElementById('pv-pct');
  if (pct) pct.textContent = Math.round(PVC.k * 100) + '%';

/* 把图限制在画布内：小于画布就居中，大于画布时至少留 60px 在视野里 */
function pvClamp(){
  const pane = pvPane(), img = pvImg(); if (!pane || !img) return;
  const iw = img.naturalWidth || 5209, ih = img.naturalHeight || 3250;
  const vw = pane.clientWidth, vh = pane.clientHeight;
  if (!vw || !vh) return;
  const w = iw * PVC.k, h = ih * PVC.k, pad = 60;
  PVC.tx = (w <= vw) ? (vw - w) / 2 : Math.min(pad, Math.max(vw - w - pad, PVC.tx));
  PVC.ty = (h <= vh) ? (vh - h) / 2 : Math.min(pad, Math.max(vh - h - pad, PVC.ty));
}
/* 适应窗口（整页看图） */
function pvFit(){
  const pane = pvPane(), img = pvImg(); if (!pane || !img) return;
  const iw = img.naturalWidth || 5209, ih = img.naturalHeight || 3250;
  // 刚切到画布模式的第一帧容器可能还没排版，用窗口尺寸兜底，免得算出 0
  const vw = pane.clientWidth || Math.max(1, window.innerWidth || 1024);
  const vh = pane.clientHeight || Math.max(1, (window.innerHeight || 768) - 60);
  if (!vw || !vh) return;
  const k = Math.min(vw / iw, vh / ih) * 0.98;
  PVC.k = k; PVC.fit = k;
  PVC.tx = (vw - iw * k) / 2;
  PVC.ty = (vh - ih * k) / 2;
  pvApply();
}
/* 以画布内某点为中心缩放 */
function pvZoomAt(mx, my, factor){
  const pane = pvPane(), img = pvImg(); if (!pane || !img) return;
  const k1 = PVC.k || 0.05;
  const kMin = Math.max(0.02, (PVC.fit || 0.05) * 0.5);
  const kMax = 2.2;                                   // 相对原图像素，再大就糊了
  const k2 = Math.max(kMin, Math.min(kMax, k1 * factor));
  if (Math.abs(k2 - k1) < 1e-6) return;
  PVC.tx = mx - (mx - PVC.tx) * (k2 / k1);
  PVC.ty = my - (my - PVC.ty) * (k2 / k1);
  PVC.k = k2;
  pvClamp();
  pvApply();
}
function pvZoomCenter(factor){
  const pane = pvPane(); if (!pane) return;
  pvZoomAt(pane.clientWidth / 2, pane.clientHeight / 2, factor);
}
function pvSetZoom(k){
  const pane = pvPane(); if (!pane) return;
  const cur = PVC.k || 1;
  pvZoomAt(pane.clientWidth / 2, pane.clientHeight / 2, k / cur);
}
function pvBindCanvas(){
  const pane = pvPane(); if (!pane || pane.__bound) return;
  pane.__bound = 1;
  pane.addEventListener('wheel', function(ev){
    if (!pane.classList.contains('on')) return;
    ev.preventDefault();
    const r = pane.getBoundingClientRect();
    pvZoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * 0.0018));
  }, { passive: false });
  let drag = null;
  pane.addEventListener('mousedown', function(ev){
    if (ev.button !== 0) return;
    ev.preventDefault(); ev.stopPropagation();
    drag = { x: ev.clientX, y: ev.clientY, tx: PVC.tx, ty: PVC.ty };
    pane.classList.add('dragging');
  });
  // 监听 window：鼠标拖到画布外（工具栏、窗口边缘）时也能继续跟手
  window.addEventListener('mousemove', function(ev){
    if (!drag) return;
    PVC.tx = drag.tx + (ev.clientX - drag.x);
    PVC.ty = drag.ty + (ev.clientY - drag.y);
    pvClamp(); pvApply();
  });
  window.addEventListener('mouseup', function(){
    if (!drag) return;
    drag = null; pane.classList.remove('dragging');
  });
  pane.addEventListener('dblclick', function(ev){
    const r = pane.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    if (PVC.k < Math.max(0.9, PVC.fit * 1.6)) {
      // → 100%（以双击点为中心）
      pvZoomAt(mx, my, 1 / (PVC.k || 1));
    } else {
      pvFit();
    }
  });
  // 双指缩放（触控板捏合也走 wheel，这里只是触屏兜底）
  let pinch = null;
  pane.addEventListener('touchstart', function(ev){
    if (ev.touches.length === 2) {
      const a = ev.touches[0], b = ev.touches[1];
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), k: PVC.k };
    }
  }, { passive: true });
  pane.addEventListener('touchmove', function(ev){
    if (!pinch || ev.touches.length !== 2) return;
    ev.preventDefault();
    const a = ev.touches[0], b = ev.touches[1];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const r = pane.getBoundingClientRect();
    pvZoomAt((a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top, (pinch.k * d / pinch.d) / (PVC.k || 1));
  }, { passive: false });
  pane.addEventListener('touchend', function(){ pinch = null; });
  const img = pvImg();
  if (img && !img.complete) {
    img.addEventListener('load', function(){ if (__pvMode === 'img') pvFit(); });
  }
}

/* ============================================================
   2026-11-04 · 电视 / 遥控器导航
   ← →   上一个 / 下一个事件（按年份先后）
   ↑ ↓   在同一根轴上跳（中国轴 ⇄ 外国轴）
   Enter 打开事件详情
   Esc   关闭详情 / 取消焦点
   详情抽屉打开时：↑ ↓ 滚动正文，Esc 关闭。
   焦点由已有的「联动高亮」机制承担（renderFocusMark 画圆环 + 年份，
   事件本身放大并加金色光环），并自动把该年拉到屏幕中央（1500%）。
   ============================================================ */
(function(){
  let tvIdx = -1, tvList = [], tvOn = false, tvTipTimer = null;

  function collect(){
    const src = (typeof eventsForView === 'function') ? eventsForView()
              : ((window.DATA && window.DATA.events) || []);
    return src.filter(e => e && typeof e.year === 'number' && e.name && e.tier !== 3)
      .sort((a, b) => a.year - b.year || ((a.seq || 0) - (b.seq || 0)) || String(a.name).localeCompare(String(b.name)));
  }
  const drawerOpen = () => { const d = document.getElementById('drawer'); return !!(d && d.classList.contains('open')); };
  const pdfOpen    = () => { const p = document.getElementById('pdf-viewer'); return !!(p && p.classList.contains('on')); };
  const hpOpen     = () => { const h = document.getElementById('hp'); return !!(h && h.classList.contains('on')); };
  /* 老电视浏览器可能没有 KeyboardEvent.key → 用 keyCode 兜底 */
  const KEYMAP = { 37:'ArrowLeft', 38:'ArrowUp', 39:'ArrowRight', 40:'ArrowDown', 13:'Enter', 27:'Escape' };
  const keyName = e => e.key || KEYMAP[e.keyCode] || '';

  function showTip(hold){
    let el = document.getElementById('tv-tip');
    if (!el){
      el = document.createElement('div');
      el.id = 'tv-tip';
      el.textContent = '← → 切换事件　↑ ↓ 换轴　Enter 打开　Esc 返回';
      document.body.appendChild(el);
    }
    el.classList.add('on');
    if (tvTipTimer) clearTimeout(tvTipTimer);
    tvTipTimer = setTimeout(() => { el.classList.remove('on'); tvTipTimer = null; }, hold || 2600);
  }
  function focusAt(i){
    if (!tvList.length) tvList = collect();
    if (!tvList.length) return;
    i = Math.max(0, Math.min(tvList.length - 1, i));
    tvIdx = i; tvOn = true;
    const ev = tvList[i];
    if (typeof focusTimelineEvent === 'function') focusTimelineEvent(ev);
    showTip();
  }
  function jumpRegion(dir){
    if (!tvList.length || tvIdx < 0){ tvList = collect(); focusAt(0); return; }
    const want = (tvList[tvIdx].region === 'foreign') ? 'china' : 'foreign';
    for (let i = tvIdx + dir; i >= 0 && i < tvList.length; i += dir){
      if (tvList[i].region === want){ focusAt(i); return; }
    }
    focusAt(tvIdx + dir);      // 该方向没有另一根轴的事件 → 退化为普通前后
  }

  document.addEventListener('keydown', function(e){
    const k = keyName(e);

    if (k === 'Escape'){
      if (pdfOpen()){ const b = document.getElementById('pv-close'); if (b){ b.click(); e.preventDefault(); } return; }
      if (drawerOpen()){ const b = document.querySelector('#drawer .close'); if (b){ b.click(); e.preventDefault(); } return; }
      if (tvOn && typeof __tlFocus !== 'undefined' && __tlFocus){
        __tlFocus = null; tvOn = false;
        const t = d3.zoomTransform(svg.node());
        applyTimelineTransform(t.x, t.k);
        e.preventDefault();
      }
      return;
    }

    if (k === 'Enter'){
      if (drawerOpen() || pdfOpen()) return;
      const ev = (tvIdx >= 0 && tvList[tvIdx]) ? tvList[tvIdx] : null;
      if (ev){ openDrawer(ev, 'event'); e.preventDefault(); }
      return;
    }

    if (k !== 'ArrowLeft' && k !== 'ArrowRight' && k !== 'ArrowUp' && k !== 'ArrowDown') return;
    if (pdfOpen()) return;

    if (drawerOpen()){                       // 抽屉里：翻正文
      const d = document.getElementById('drawer');
      e.preventDefault();
      if (k === 'ArrowDown') d.scrollBy({ top: 160, behavior: 'smooth' });
      else if (k === 'ArrowUp') d.scrollBy({ top: -160, behavior: 'smooth' });
      return;
    }
    if (hpOpen()){                           // 遗产面板打开：上下翻列表，不抢焦点
      const box = document.getElementById('hp-list');
      e.preventDefault();
      if (box){
        if (k === 'ArrowDown') box.scrollBy({ top: 120, behavior: 'smooth' });
        else if (k === 'ArrowUp') box.scrollBy({ top: -120, behavior: 'smooth' });
      }
      return;
    }

    e.preventDefault();
    if (!tvList.length || tvIdx < 0){ tvList = collect(); focusAt(0); return; }
    if (k === 'ArrowRight')      focusAt(tvIdx + 1);
    else if (k === 'ArrowLeft')  focusAt(tvIdx - 1);
    else if (k === 'ArrowDown')  jumpRegion(1);
    else if (k === 'ArrowUp')    jumpRegion(-1);
  });

  /* 鼠标/手指一碰就交出焦点（避免两套高亮并存） */
  window.addEventListener('pointerdown', function(){ if (tvOn) tvOn = false; }, true);

  /* 无指针设备（电视遥控器 / 纯触摸大屏）：首屏主动提示一次怎么操作 */
  try{
    if (window.matchMedia && window.matchMedia('(hover: none)').matches){
      setTimeout(function(){ showTip(6000); }, 1400);
    }
  }catch(e){}

  window.__tvNav = { collect, focusAt, jumpRegion, get idx(){ return tvIdx; }, get list(){ return tvList; } };

/* 2026-11-06：外层容器（Android WebView 壳 / 电视 App）的返回键钩子。
   有浮层就先关一层并返回 true；什么都没有返回 false，壳据此退出应用。
   网页版里没人调用它，留着无害。 */
window.__tvBack = function(){
  var pv = document.getElementById('pdf-viewer');
  if (pv && pv.classList.contains('on')){ var b = document.getElementById('pv-close'); if (b){ b.click(); return true; } }
  var dr = document.getElementById('drawer');

  var hp = document.getElementById('hp');
  if (hp && hp.classList.contains('on')){ var hc = document.getElementById('hp-close'); if (hc){ hc.click(); return true; } }
  var mf = document.getElementById('map-find');
  if (mf && mf.style.display !== 'none' && mf.classList.contains('on')){ mf.classList.remove('on'); return true; }
  if (typeof __tlFocus !== 'undefined' && __tlFocus){
    __tlFocus = null;
    try { var t = d3.zoomTransform(svg.node()); applyTimelineTransform(t.x, t.k); } catch(e){}
    return true;
  }
  return false;
};
