<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中外历史图谱 · Timeline Atlas</title>
<!-- 2026-11-04：全面离线化。字体改为「不阻塞渲染」加载：断网时秒开，只是回退到系统宋体/楷体 -->
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!-- d3 / topojson：项目内本地副本（离线可用）。文件缺失时由主脚本开头的守卫给出明确提示。 -->
<script src="data/d3.v7.min.js"></script>
<script src="data/topojson-client.min.js"></script>
<!-- 2026-11-04：地图数据双方案 —— 联网优先（CDN 精度/标注最好），断网自动回退本地。
     110m 体积小（105KB）常驻内存保证离线首屏；50m（739KB）改为按需注入，不拖慢联网启动。 -->
<script src="data/world-atlas-110m.js"></script>
<style>
  :root{
    --paper-light:#efe0c0; --paper-dark:#d8c190;
    --ink:#3a2817; --ink-soft:#6b4a2a; --gold:#a87b3a; --crimson:#8c2a1f;
    --sea:#3a5a7a; --sea-deep:#2a4258;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#1a1208;}
  body{font-family:'Noto Serif SC',serif;color:var(--ink);display:flex;flex-direction:column;}

  #toolbar{height:50px;flex:0 0 50px;background:linear-gradient(180deg,#5a3a1c,#2a1c0e);border-bottom:2px solid #a87b3a;display:flex;align-items:center;gap:12px;padding:0 18px;color:#efe0c0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.5);}
  #toolbar .title{font-family:'Ma Shan Zheng',serif;font-size:22px;color:#f3d896;letter-spacing:2px;text-shadow:0 1px 0 #000;}
  #toolbar .sub{font-family:'IM Fell English',serif;font-style:italic;font-size:12px;color:#c9a874;opacity:.8;}
  #toolbar .spacer{flex:1;}
  #toolbar button,#toolbar select,#toolbar input{font-family:'Noto Serif SC',serif;font-size:12px;color:var(--ink);background:var(--paper-light);border:1px solid #a87b3a;padding:5px 10px;border-radius:3px;cursor:pointer;}
  #toolbar button:hover{background:#f6eaca;}
  #toolbar input{width:140px;}

  /* 时代选择下拉面板 */
  #era-dropdown{position:relative;}
  #era-panel{
    position:absolute; top:100%; right:0; margin-top:4px; z-index:50;
    display:flex; gap:2px;
    background:rgba(28,18,8,.96); border:1px solid #a87b3a; border-radius:4px;
    padding:8px; box-shadow:0 4px 20px rgba(0,0,0,.7);
  }
  #era-panel.hidden{display:none;}
  .era-col{min-width:155px;display:flex;flex-direction:column;}
  .era-col-items{max-height:60vh;overflow-y:auto;padding-right:2px;}
  .era-col-items::-webkit-scrollbar{width:4px;}
  .era-col-items::-webkit-scrollbar-thumb{background:#a87b3a;border-radius:2px;}
  .era-col-title{font-family:'Ma Shan Zheng',serif; font-size:14px; color:#f3d896; text-align:center; padding:4px 0 6px; border-bottom:1px solid #a87b3a; margin-bottom:4px; letter-spacing:2px;}
  .era-item{padding:5px 12px; font-size:12px; font-family:'Noto Serif SC',serif; color:#c9a874; cursor:pointer; border-radius:3px; transition:background .12s, color .12s; white-space:nowrap;}
  .era-item:hover{background:rgba(168,123,58,.4); color:#fff8e8;}
  .era-item.selected{background:rgba(168,123,58,.55); color:#fff8e8; font-weight:bold;}
  /* 2026-10-19：外国列按文明链分组的小标题 */
  .era-group{font-size:11px; font-family:'Noto Serif SC',serif; color:#a87b3a; letter-spacing:1px;
    margin:8px 0 2px; padding:4px 2px 0; border-top:1px solid rgba(168,123,58,.28); white-space:nowrap;}
  .era-group:first-child{margin-top:0; padding-top:0; border-top:none;}
  #zoom-display{font-family:'IM Fell English',serif;color:#c9a874;font-size:12px;min-width:64px;text-align:right;}
  #balance-toggle{font-family:'Noto Serif SC',serif;}
  #balance-toggle.on{background:rgba(168,123,58,.45);color:#ffe9b0;border-color:#e8b45a;box-shadow:0 0 8px rgba(232,180,90,.35);}
  #terr-toggle{font-family:'Noto Serif SC',serif;}
  #terr-toggle.on{background:rgba(168,123,58,.45);color:#ffe9b0;border-color:#e8b45a;box-shadow:0 0 8px rgba(232,180,90,.35);}
  #sound-toggle{background:rgba(28,18,8,.5);border:1px solid #a87b3a;color:#c9a874;font-size:16px;cursor:pointer;border-radius:3px;padding:2px 8px;transition:all .2s;}
  #sound-toggle.sound-off{opacity:0.5;color:#6b4a2a;}

  #stage{flex:1;position:relative;overflow:hidden;background:#1a1208;}
  svg#map{display:block;width:100%;height:100%;position:relative;z-index:2;}
  #mapcv{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;}

  svg#map .mapLayer{ will-change: transform; }
  svg#map.dragging .mapLayer path{ shape-rendering: optimizeSpeed; }
  svg#map.dragging .mapLayer .states,
  svg#map.dragging .mapLayer .country-labels,
  svg#map.dragging .highlightLayer,
  svg#map.mapBusy .mapLayer .states,
  svg#map.mapBusy .mapLayer .country-labels,
  svg#map.mapBusy .highlightLayer{ display:none; }
  svg#map .mapLayer .country{ shape-rendering: geometricPrecision; }
  .axis-label{font-family:'Ma Shan Zheng',serif;font-size:16px;fill:#6b4a2a;letter-spacing:3px;opacity:.85;text-anchor:middle;}
  .axis-label.hp-entry:hover{fill:#a8532a;opacity:1;}
  .axis-label.pdf-entry:hover{fill:#a8532a;opacity:1;}
  /* 文明链入口：外国轴最左端的圆点，做成闪烁的「地理标点」 */
  .cl-entry-dot,.co-entry-dot{transform-box:fill-box;transform-origin:center;animation:clPulse 1.3s ease-in-out infinite;}
  @keyframes clPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(1.8);}}

  #tooltip{position:absolute;pointer-events:none;z-index:25;background:rgba(28,18,8,.5);color:#f3d896;border:1px solid #a87b3a;border-radius:4px;padding:4px 8px;max-width:300px;font-size:12px;line-height:1.55;box-shadow:0 2px 8px rgba(0,0,0,.3);opacity:0;transition:opacity .12s;backdrop-filter:blur(2px);}
  #tooltip b{color:#ffd98a;display:block;margin-bottom:2px;font-size:14px;}
  #tooltip .yr{font-family:'IM Fell English',serif;color:#c9a874;font-style:italic;}
  #tooltip .mn{color:#9fb8d4;font-size:11px;margin-top:4px;border-top:1px dashed #5a3a1c;padding-top:4px;}
  #tooltip .hint{color:#e8a050;font-size:11px;margin-top:4px;}

  #drawer{position:absolute;top:0;right:0;bottom:0;width:380px;background:linear-gradient(180deg,#2a1c0e,#1a1208);border-left:2px solid #a87b3a;box-shadow:-4px 0 18px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:35;overflow-y:auto;padding:18px 20px;color:#efe0c0;}
  #drawer.open{transform:translateX(0);}
  #drawer .close{position:absolute;top:10px;right:14px;font-size:22px;color:#c9a874;cursor:pointer;background:none;border:none;}
  #drawer h2{font-family:'Ma Shan Zheng',serif;font-size:24px;color:#f3d896;margin-bottom:6px;padding-right:30px;line-height:1.3;}
  #drawer .meta{font-family:'IM Fell English',serif;font-style:italic;color:#c9a874;font-size:13px;margin-bottom:12px;}
  #drawer .body{font-size:14px;line-height:1.7;color:#e8d8b0;}
  #drawer .figures{margin-top:12px;padding-top:10px;border-top:1px dashed #5a3a1c;}
  #drawer .figures b{color:#f3d896;}
  /* 2026-10-19：事件关键词（外国轴补写时新增的字段，以标签形式展示） */
  #drawer .keywords{margin-top:10px;color:#b9a074;font-size:12px;line-height:1.8;}
  #drawer .keywords b{color:#f3d896;}
  #drawer .keywords span{display:inline-block;margin:2px 6px 2px 0;padding:1px 8px;border:1px solid rgba(168,123,58,.55);border-radius:10px;color:#c9a874;}
  #drawer .video-links{margin-top:14px;display:flex;gap:10px;}
  #drawer .video-links a{display:inline-block;padding:6px 14px;border-radius:3px;text-decoration:none;font-size:12px;font-family:'Noto Serif SC',serif;}
  #drawer .v-bili{background:#fb7299;color:#fff !important;}
  #drawer .v-yt{background:#ff0000;color:#fff !important;}
  #drawer .v-bili:hover,#drawer .v-yt:hover{opacity:.85;}
  #drawer .children-list{margin-top:12px;padding-top:10px;border-top:1px dashed #5a3a1c;}
  #drawer .children-list b{color:#f3d896;}
  #drawer .child-item{padding:5px 8px;margin:3px 0;background:rgba(168,123,58,.15);border-radius:3px;cursor:pointer;font-size:13px;}
  #drawer .child-item:hover{background:rgba(168,123,58,.35);}
  /* —— 时代发展与脉络图（L1 抽屉）—— */
  .era-flow-wrap{margin:10px 0 12px;padding:8px 8px 6px;background:rgba(168,123,58,.10);border:1px solid #5a3a1c;border-radius:4px;}
  .ef-head{font-size:12px;color:#f3d896;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
  .ef-auto{font-size:10px;color:#c9a874;}
  .ef-cnt{font-size:10px;color:#c9a874;white-space:nowrap;}
  svg.era-flow{display:block;overflow:visible;}
  .ef-seg-t{font-size:10px;fill:#fff8e6;pointer-events:none;}
  .ef-axis{stroke:#8c5a2a;stroke-width:1;stroke-opacity:.55;}
  .ef-node{cursor:pointer;}
  .ef-node:hover{r:8;stroke-width:2.6;}
  .ef-tick{font-size:10px;fill:#c9a874;}
  .ef-hint{font-size:10px;color:#8a7a5a;text-align:right;margin-top:2px;}
  .ef-ev{font-size:8.5px;font-family:'Noto Serif SC',serif;pointer-events:none;}
  .ef-stages{margin-top:5px;display:flex;flex-wrap:wrap;gap:2px 8px;font-size:9.5px;line-height:1.55;color:#c9a874;}
  .ef-stage{white-space:nowrap;}
  .ef-stage i{font-style:normal;color:#8a7a5a;margin-left:3px;font-size:9px;}
  /* —— P2：地图图例（时空标点）—— */
  #map-legend{position:absolute;right:14px;padding:7px 10px;border:1px solid #5a3a1c;border-radius:4px;
    background:rgba(24,14,6,.74);color:#e8d8b0;font-size:11px;line-height:1.7;z-index:20;
    font-family:'Noto Serif SC',serif;max-width:212px;pointer-events:none;}
  #map-legend.hidden{display:none;}
  #map-legend b{color:#f3d896;}
  #map-legend .ml-row{display:flex;align-items:center;gap:6px;}
  #map-legend .ml-sub{color:#c9a874;font-size:10px;}
  #map-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e8b84b;flex:0 0 auto;}
  #map-legend .ml-toggle{pointer-events:auto;cursor:pointer;color:#e8a050;}
  /* —— P2：点击地图「此地历史」—— */
  #map-find{position:absolute;z-index:34;width:252px;max-height:310px;overflow-y:auto;padding:9px 11px;
    border:2px solid #a87b3a;border-radius:5px;background:linear-gradient(180deg,#2a1c0e,#1a1208);
    color:#efe0c0;font-size:12px;box-shadow:0 6px 22px rgba(0,0,0,.55);font-family:'Noto Serif SC',serif;}
  #map-find.hidden{display:none;}
  #map-find h4{font-family:'Ma Shan Zheng',serif;font-size:15px;color:#f3d896;margin:0 0 3px;}
  #map-find .mf-sub{font-size:10px;color:#c9a874;margin-bottom:6px;}
  #map-find .mf-item{padding:5px 7px;margin:3px 0;border-radius:3px;background:rgba(168,123,58,.14);cursor:pointer;}
  #map-find .mf-item:hover{background:rgba(168,123,58,.34);}
  #map-find .mf-yr{color:#c9a874;font-size:11px;margin-right:5px;}
  #map-find .mf-km{color:#8a7a5a;font-size:10px;float:right;}
  #map-find .mf-close{position:absolute;right:9px;top:6px;cursor:pointer;color:#c9a874;font-size:15px;}
  svg#map circle.tm-dot{cursor:pointer;}

  svg#map{cursor:grab;}
  svg#map.dragging{cursor:grabbing;}
  /* 事件节点与时代块使用手型 */
  .era rect, .ev-dot, .ev-main-dot, .sub-dot{cursor:pointer !important;}
  /* 时代块高亮态：金色描边 + 全不透明 + 发光 */
  .era.highlighted rect{
    stroke: #ffd700 !important;
    stroke-width: 2.5 !important;
    opacity: 1 !important;
    filter: drop-shadow(0 0 6px rgba(255,215,0,0.7));
  }
  .era.highlighted text{ opacity: 1 !important; }
  /* 未高亮色块仅轻微降低对比度，不做隐藏/模糊 */
  .era.dimmed rect{ opacity: 0.6 !important; }
  .era.dimmed text{ opacity: 0.65 !important; }
  /* 合轴高亮期间，原年份刻度标注半透明 */
  .vlabel.dim{ opacity: 0.2 !important; }
  /* 抽屉打开时隐藏时间轴 */
  /* 抽屉打开（地图全屏聚焦）时，整套时间轴背景与轴标一起淡出，别在地图上留纸色条 */
  /* 2026-10-18：显隐改为淡入淡出，配合「脉络事件 → 主轴联动」的先后节奏 */
  .zoomLayer, .evLayer, .overLabel, .bg, .axisLines, .axisLabels, .border{ transition: opacity .38s ease; }
  .zoomLayer.hidden, .evLayer.hidden, .overLabel.hidden, .bg.hidden, .axisLines.hidden, .axisLabels.hidden, .border.hidden{ opacity: 0 !important; pointer-events: none !important; }
  /* 事件图标 / 标注文字：用网页边框色 #8c5a2a，加浮雕（上浮）感，与地图上的文字区分开 */
  /* （2026-10-18：标注文字的颜色/描边统一挪到下方“清晰化”规则里，此处只留图标） */
  .ev-dot, .sub-dot{
    fill: #8c5a2a !important;
    filter: drop-shadow(0 -0.5px 0 rgba(255,246,225,.4)) drop-shadow(0 1px 1px rgba(0,0,0,.55));
  }
  /* 事件悬停：整条（图标 + 文字 + 引线）高亮并适度放大。悬停到文字上也生效 */
  .ev, .sub{ cursor: pointer; }                                /* 整条统一光标，避免图标/文字之间跳变 */
  /* 2026-10-19：悬停放大改由 JS 以「轴上的图标」为原点做 scale(1.1)（见 renderT2 / renderT3）。
     旧写法 `.ev.hot .zoomg{transform:scale(1.1)}` 的缩放原点是元素 user space 的 (0,0)，
     对屏幕坐标系的 L2 层而言就是 SVG 顶端 → y 被乘以 1.1：
     中国轴 y≈50 只偏 5px（几乎看不出来），外国轴 y≈851 直接下移 ≈85px，星标甩到轴外。 */
  .ev .zoomg, .sub .zoomg{ transform-box: view-box; }
  .ev.hot .ev-label, .sub.hot .sub-label{ opacity: 1 !important; }
  .ev.hot .ev-dot, .sub.hot .sub-dot{ opacity: 1 !important; stroke-width: 1.6 !important; }
  .ev.hot .ev-stem, .sub.hot .sub-stem{ opacity: 0.95 !important; stroke-width: 1.8 !important; }
  /* 2026-10-25：悬停 L2 总括事件 → 同步点亮它的 L3 分述（子事件） */
  /* 2026-10-25：高亮改为"深色字 + 米白描边 + 浅底药丸"，避免整体提亮导致文字看不清 */
  .sub.linked .sub-label{ opacity: 1 !important; fill: #5a2b00 !important; font-weight: 700 !important;
                          stroke: #fffaf0 !important; stroke-width: 2.6 !important; }
  .sub.linked .sub-label-bg{ opacity: .92 !important; }
  .sub.linked .sub-dot{ opacity: 1 !important; fill: #ffcf4d !important; stroke: #7a3b00 !important; stroke-width: 1.5 !important; }
  .sub.linked .sub-stem{ opacity: 1 !important; stroke: #c07a00 !important; stroke-width: 1.8 !important; }
  .ev.linked-parent .ev-label{ fill: #5a2b00 !important; font-weight: 700 !important;
                               stroke: #fffaf0 !important; stroke-width: 2.6 !important; }
  .ev.linked-parent .ev-dot{ stroke: #ffb300 !important; stroke-width: 2.2 !important; }
  /* 2026-10-19：合轴整体降为「背景层」（.mainScale 插在事件层之下），
     标注文字不再为躲开合轴而挤在合轴下方；悬停/点击某条事件时，
     它在合轴上的小圆点发光 + 闪烁，把「标注 ↔ 合轴」连成一条线。 */
  .mainScale{ transition: opacity .38s ease; }
  .mainScale.hidden{ opacity: 0 !important; pointer-events: none !important; }
  .ev-main-dot, .sub-main-dot{
    shape-rendering: geometricPrecision; transition: opacity .18s ease;
    transform-box: fill-box; transform-origin: 50% 50%;   /* 放大绕自身中心，不会被拉离轴 */
  }
  .ev.hot .ev-main-dot, .ev.ev-focus .ev-main-dot,
  .sub.hot .sub-main-dot, .sub.sub-focus .sub-main-dot{ animation: mainDotGlow 1.15s ease-in-out infinite; }
  @keyframes mainDotGlow{
    0%, 100%{ transform: scale(1);   opacity: .55; filter: drop-shadow(0 0 2px rgba(255,243,196,.55)); }
    45%     { transform: scale(2.0); opacity: 1;   filter: drop-shadow(0 0 6px rgba(255,214,130,1)) drop-shadow(0 0 13px rgba(255,150,20,.9)); }
  }
  /* 事件文字与节点：使用几何精度渲染，避免缩放/重采样时发虚模糊 */
  /* 2026-10-18：标注文字由「弱化」改为「清晰」——
     旧方案 #8c5a2a + 67% 透明：在纸带上对比仅 2.1~2.5:1、在海洋上 1.2:1（几乎看不见）。
     新方案：墨棕 #2a1c0e 正文（纸带上 8~10:1）+ 米白 #f7ecd2 描边光晕
     （与纸带几乎同色 → 纸带上等于无边框；在海洋/深色陆地上显形，把字托起来，
     相当于制图学的 halo，替代黑框）。文字与光晕本体对比 14:1。 */
  .ev-label, .sub-label{
    fill: #2a1c0e !important;
    stroke: #f7ecd2;
    stroke-width: 1.8;
    paint-order: stroke;
  }
  .ev-label, .sub-label{ text-rendering: geometricPrecision; }
  .ev-dot, .sub-dot, .ev-main-dot{ shape-rendering: geometricPrecision; }

  /* 2026-10-18：时代脉络事件轴 → 主轴联动后的高亮（放大 + 金色描边 + 呼吸光环） */
  .ev.ev-focus .ev-label{
    fill: #2a1c0e !important; opacity: 1 !important; font-weight: 700;
    stroke: #f0c675; stroke-width: 2.4; filter: drop-shadow(0 0 5px rgba(255,214,130,.9));
  }
  .ev.ev-focus .ev-dot{
    opacity: 1 !important; stroke-width: 1.8 !important;
    filter: drop-shadow(0 0 5px rgba(255,214,130,.95)) drop-shadow(0 1px 1px rgba(0,0,0,.6));
  }
  /* 合轴上的小圆点交给 mainDotGlow 动画（闪光不能被 !important 压住） */
  .ev.ev-focus .ev-main-dot{ stroke-width: 1.8 !important; }
  .ev.ev-focus .ev-stem{ opacity: .8 !important; stroke-width: 1.4 !important; }
  .ev-ring{ fill: none; stroke: #ffd98a; stroke-width: 1.5; pointer-events: none; opacity: 0; }
  .ev.ev-focus .ev-ring{ animation: evRingPulse 2s ease-in-out infinite; }
  @keyframes evRingPulse{ 0%,100%{ opacity: .4; stroke-width: 1.2; } 50%{ opacity: 1; stroke-width: 2.2; } }
  /* 联动定位标记：贯穿三轴的竖向虚线 + 轴上圆环 + 年份 */
  .focusMark{ pointer-events: none; transition: opacity .3s ease; }
  .focusMark .fm-line{ stroke: #ffd98a; stroke-width: 1; stroke-dasharray: 3 6; opacity: .35; }
  .focusMark .fm-ring{ fill: none; stroke: #ffd98a; stroke-width: 1.6; }
  .focusMark .fm-dot{ fill: #ffd98a; }
  .focusMark .fm-year{
    fill: #ffe2a6; font-family: 'Noto Serif SC', serif; font-size: 10px; text-anchor: middle;
    paint-order: stroke; stroke: #1a1208; stroke-width: 2.6;
  }

  #loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0e2230;color:#7ab0c0;z-index:40;font-family:'IM Fell English',serif;font-style:italic;font-size:18px;}
  #loader.hide{display:none;}

  #zoom-hint{position:absolute;top:60px;right:14px;z-index:20;background:rgba(10,22,30,.65);border:1px solid #3a6a7a;border-radius:3px;padding:6px 12px;color:#8ab0c0;font-size:11px;font-family:'Noto Serif SC',serif;max-width:200px;line-height:1.5;backdrop-filter:blur(2px);}
  #zoom-hint b{color:#f3d896;}



  /* ===== 2026-10-26：中国世界遗产面板（点「中国」轴标签展开） ===== */
  #hp{position:fixed;left:14px;top:92px;width:308px;max-height:calc(100vh - 150px);z-index:70;
      background:rgba(26,18,11,.965);border:1px solid #6b4a24;border-radius:7px;

<script>
/* 2026-11-04：依赖库守卫 —— data/d3.v7.min.js 或 topojson 缺失、且 CDN 也取不到时，
   不再静默只剩页眉，而是在页面正中写清楚缺什么、该放到哪。 */
(function(){
  var miss = [];
  if (typeof d3 === 'undefined') miss.push('data/d3.v7.min.js');
  if (typeof topojson === 'undefined') miss.push('data/topojson-client.min.js');
  if (!miss.length) return;
  miss = miss.join('、');
  var loader = document.getElementById('loader'); if (loader) loader.style.display = 'none';
  var box = document.createElement('div');
  box.id = 'lib-error';
  box.style.cssText = 'position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:99999;max-width:560px;padding:22px 26px;border:1px solid #a87b3a;border-radius:8px;background:rgba(24,16,8,.97);color:#f0e0bc;font:14px/1.75 "Noto Serif SC",serif;box-shadow:0 10px 40px rgba(0,0,0,.55)';
  box.innerHTML = '<div style="font-size:17px;color:#f3d896;margin-bottom:10px">图形库没有加载成功</div>'
    + '<div>缺少：<b style="color:#e8a87c">' + miss + '</b></div>'
    + '<div style="margin-top:12px;color:#c9b894">请确认这两个文件在 <code>data/</code> 目录里：</div>'
    + '<div style="margin-top:6px;font-family:monospace;color:#d8c39a">data/d3.v7.min.js<br>data/topojson-client.min.js</div>'
    + '<div style="margin-top:12px;color:#a89a7a;font-size:12.5px">当前是 <code>' + (location.protocol === 'file:' ? 'file:// 本地打开' : location.protocol) + '</code>。'
    + '页面先找上面两个文件，找不到才去 CDN；两者都失败才会出现本提示。把文件补进 data/ 后刷新即可。</div>';
  document.body.appendChild(box);
  throw new Error('[Atlas] 缺少图形库：' + miss);
})();
/* ============================================================
   时空巧记中外历史 — v3
   改进：精确世界地图(GeoJSON) / 时间轴固定不可拖拽 / 仅X向精度缩放
   ============================================================ */

/* ---------- 配置 ---------- */
const CFG = {
  W: 1600, H: 900,
  YEAR_MIN: -3800, YEAR_MAX: 2026,
  AXIS: { chinaY: 50, mapTop: 86, mapBot: 738, mainY: 788, foreignY: 851 },
  SCALE_EXTENT: [1, 40],   // 最小缩放=1（时间轴铺满窗口），不可再缩小
  // 各层级固定字号（不随缩放变化，仅显隐）
  FONT: { L1: 14, L2: 11, L3: 10 },
  // 各层级固定节点半径
  NODE: { L2: 4, L2star: 7.5, L2main: 3, L3: 5.5 },
  COLOR: {
    L2: { dot:'#1a4a7a', text:'#0a2238' },
    L3: { dot:'#5a2a7a', text:'#2a1438' },
  },
  // 层级可见 k 范围（k=倍数，10 即 1000%）
  //   L1 时代概览：文字在 <1000% 显示，达到 1000% 即隐藏（色块保留）
  //   L2 重大事件 ★：≥1000% 显示图标与文字
  //   L3 子事件 ○：≥2000% 显示（届时 L2 继续显示，不隐藏）
  TIER: {
    L1_show: [1, 10],
    L1_fade: [4, 7],
    // L2 / L3 的显示下限改由数据里的「L2显示缩放 / L3显示缩放」列控制（可按朝代单独调），
    // 此处只留兜底默认值与上限。k 为缩放倍数，10 即 1000%。
    L2_show: [1, 40],
    L3_show: [1, 40],
    L2_zoom: 1000,     // 默认：1000% 起显示 L2 重要事件
    L3_zoom: 1800,     // 默认：1800% 起显示 L3 次要事件（此时 L2 隐去，避免两层叠加）
  },
  LAYOUT: {
    chinaLanes: 3,      // 中国事件标签：向下堆叠的最大轨道数（控制在 2~3 行，少占地图）
    // 2026-10-19：引线回到垂直（不做横向让位），改为**压缩纵向占用**：
    // 外国轴 5 行、行高 15、首行偏移 4 → 最高一行 ≈ y779，只比合轴高 8px，基本不进地图。
    foreignLanes: 5,    // 外国事件标签：向上堆叠的最大轨道数（排不下的降级为只留图标）
    laneH: 15,          // 每条轨道的高度（px）—— 比原来的 17 更紧
    laneGap: 8,         // 同一轨道内，两个标签之间至少留的横向空隙
    minIcon: 15,        // 图标之间至少留的横向间距
    labelOff: 4,        // 第一条轨道距时间轴的偏移
  },
  GRID_STEPS: [1000,500,300,200,100,50,20,10,5,1],
};

// 根据窗口尺寸动态计算画布与轴位置（消除黑边，时间轴铺满宽度）
function recalcLayout(){
  const stage = document.getElementById('stage');
  CFG.W = stage.clientWidth || window.innerWidth;
  CFG.H = stage.clientHeight || (window.innerHeight - 50);
  // 轴位置：中国轴下移，留出与外国轴对称的上下空间，避免标签被遮挡
  CFG.AXIS.chinaY   = Math.round(CFG.H * 0.055);
  CFG.AXIS.mapTop   = Math.round(CFG.H * 0.095);
  CFG.AXIS.mapBot   = Math.round(CFG.H * 0.820);
  CFG.AXIS.mainY    = Math.round(CFG.H * 0.875);
  CFG.AXIS.foreignY = Math.round(CFG.H * 0.945);
  // 时间轴铺满窗口宽度（留 20px 边距）
  xScale.range([20, CFG.W - 20]);
  svg.attr('viewBox', `0 0 ${CFG.W} ${CFG.H}`).attr('preserveAspectRatio', 'none');
}

/* ---------- L1 朝代/文明配色（4 种高对比度颜色交替着色） ---------- */
const ERA_PALETTE = ['#8c2a1f', '#1a5a6a', '#5a2a7a', '#2a4a8c']; // 深红、深青、深紫、深蓝
let _eraColorMap = null;
function getEraColor(eraId){
  if(!_eraColorMap){
    _eraColorMap = {};
    // 按**时间先后**排序后交替配色（中国轴 / 外国轴各自独立排一遍），
    // 这样同一轴上相邻的时代颜色必定不同，不会出现"挨着两个同色"。
    ['china','foreign'].forEach(region => {
      const list = DATA.eras
        .filter(e => ((e.region === 'foreign') ? 'foreign' : 'china') === region)
        .sort((a, b) => a.start - b.start);
      list.forEach((e, i) => { _eraColorMap[e.id] = ERA_PALETTE[i % ERA_PALETTE.length]; });
    });
  }
  return _eraColorMap[eraId] || '#666';
}
// 加深颜色用于文字（提高与浅色背景的对比度）
function darken(hex, f){
  f = f || 0.5;
  const r = Math.floor(parseInt(hex.slice(1,3), 16) * f);
  const g = Math.floor(parseInt(hex.slice(3,5), 16) * f);
  const b = Math.floor(parseInt(hex.slice(5,7), 16) * f);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}
// 五角星路径生成器（以原点为中心）
function starPath(r){
  const oR = r, iR = r * 0.42;
  let p = '';
  for(let i=0; i<10; i++){
    const a = (Math.PI/5)*i - Math.PI/2;
    const rr = i%2===0 ? oR : iR;
    p += (i===0?'M':'L') + (Math.cos(a)*rr).toFixed(2) + ',' + (Math.sin(a)*rr).toFixed(2);
  }
  return p + 'Z';
}

/* ---------- 事件节点图标：内置形状 或 自定义图片 URL ----------
   CSV「图标」列可填内置形状名：
     star(默认) / diamond / triangle / square / circle / cross / wye / pin
   也可以直接填图片地址（http(s)://、data: 或相对路径），会用图片渲染。 */
const ICON_SHAPES = ['star', 'asterisk', 'diamond', 'triangle', 'square', 'circle', 'cross', 'wye', 'pin'];
function isImgIcon(icon){
  const s = String(icon == null ? '' : icon).trim();
  return /^(https?:|data:|\/|\.\/|\.\.\/)/i.test(s);
}
// 星号 *：6 条细辐条（用于 L3 次要事件）
function asteriskPath(r){
  const w = r * 0.2;
  let d = '';
  for(let i = 0; i < 3; i++){
    const a = (Math.PI / 3) * i, ca = Math.cos(a), sa = Math.sin(a);
    const px = -sa * w, py = ca * w;
    d += 'M' + (-ca*r + px).toFixed(2) + ',' + (-sa*r + py).toFixed(2) +
         ' L' + (ca*r + px).toFixed(2) + ',' + (sa*r + py).toFixed(2) +
         ' L' + (ca*r - px).toFixed(2) + ',' + (sa*r - py).toFixed(2) +
         ' L' + (-ca*r - px).toFixed(2) + ',' + (-sa*r - py).toFixed(2) + ' Z ';
  }
  return d;
}
function shapePath(name, r){
  if(name === 'star') return starPath(r);
  if(name === 'asterisk') return asteriskPath(r);
  if(name === 'pin'){    // 水滴定位针
    const R = r.toFixed(2), R2 = (r * 0.95).toFixed(2), R3 = (r * 0.85).toFixed(2), R4 = (r * 1.2).toFixed(2);
    return 'M0,' + R2 + ' C-' + R2 + ',-' + R + ' -' + R3 + ',-' + (r * 0.8).toFixed(2) + ' 0,-' + R4 +
           ' C' + R3 + ',-' + (r * 0.8).toFixed(2) + ' ' + R2 + ',-' + R + ' 0,' + R2 + ' Z';
  }
  const T = { diamond: d3.symbolDiamond, triangle: d3.symbolTriangle, square: d3.symbolSquare,
              circle: d3.symbolCircle, cross: d3.symbolCross, wye: d3.symbolWye }[name];
  return d3.symbol().type(T || d3.symbolStar).size(Math.PI * r * r * 1.35)();
}
// def：该层级的默认形状（L2 传 'star'，L3 传 'asterisk'）
function iconPathOf(icon, r, def){
  const key = String(icon == null ? '' : icon).trim().toLowerCase();
  const use = (key && ICON_SHAPES.indexOf(key) >= 0) ? key : (def || 'star');
  return shapePath(use, r);
}

function lookupLocation(lat, lng){
  let best = null, bestDist = 5; // 5度以内
  for(const loc of LOCATION_LOOKUP){
    const d = Math.sqrt((loc.lat-lat)**2 + (loc.lng-lng)**2);
    if(d < bestDist){ bestDist = d; best = loc; }
  }
  return best;
}

/* ---------- 时间↔像素比例尺 ---------- */
/* ---------- 时间轴横轴映射：线性 ↔ 密度均衡（可切换） ----------
   线性：位置 = (年份−起点) ÷ 总年数 —— 100 年永远一样宽（等比例，但一边挤一边空）
   均衡：把「事件累积分布」和线性各取一部分混合，哪段时间事件多就给更多宽度
   α=0 纯线性（原样）；α=1 完全按事件密度排布；0<α<1 为折中。 */
const XSCALE = {
  d: [CFG.YEAR_MIN, CFG.YEAR_MAX],
  r: [40, CFG.W - 40],
  alpha: 0,
  cdfYears: null,
  _build(){
    if(this.cdfYears) return;
    const ys = [];
    const src = (typeof DATA !== 'undefined' && DATA.events && DATA.events.length) ? DATA.events : [];
    const push = y => { y = Number(y); if(isFinite(y) && y >= this.d[0] && y <= this.d[1]) ys.push(y); };
    src.forEach(e => { push(e.year); (e.children || []).forEach(c => push(c.year)); });
    ys.sort((a,b) => a - b);
    this.cdfYears = ys.length ? ys : [this.d[0]];
  },
  _cdf(t){                       // 年份 → 0~1 的累积占比
    const ys = this.cdfYears, n = ys.length;
    let lo = 0, hi = n;
    while(lo < hi){ const m = (lo + hi) >> 1; if(ys[m] <= t) lo = m + 1; else hi = m; }
    return lo / n;
  },
  _warp(t){                      // 年份 → 0~1
    const lin = (t - this.d[0]) / (this.d[1] - this.d[0]);
    if(this.alpha <= 0) return lin;
    return (1 - this.alpha) * lin + this.alpha * this._cdf(t);
  },
  _warpInv(p){                   // 0~1 → 年份（二分求逆，单调安全）
    if(this.alpha <= 0) return this.d[0] + p * (this.d[1] - this.d[0]);
    let lo = this.d[0], hi = this.d[1];
    for(let i = 0; i < 42; i++){
      const mid = (lo + hi) / 2;
      if(this._warp(mid) < p) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  },
  map(t){ this._build(); return this.r[0] + this._warp(t) * (this.r[1] - this.r[0]); },
  invert(x){ this._build(); return this._warpInv((x - this.r[0]) / (this.r[1] - this.r[0])); },
  range(v){ if(!arguments.length) return this.r; this.r = [v[0], v[1]]; return this; },
  domain(v){ if(!arguments.length) return this.d; this.d = [v[0], v[1]]; return this; },
  setAlpha(a){ this.alpha = Math.max(0, Math.min(1, a)); return this; }
};
const xScale = t => XSCALE.map(t);
xScale.invert = x => XSCALE.invert(x);
xScale.range  = v => XSCALE.range(v);
xScale.domain = v => XSCALE.domain(v);

let mapExpanded = false;   // 地图全屏聚焦中：Canvas 的海洋底色与裁剪范围随之放开到整屏
function sizeCanvas(){
  const r = mapcv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  mapcv.width  = Math.max(1, Math.round(r.width  * dpr));
  mapcv.height = Math.max(1, Math.round(r.height * dpr));
  _cvSX = mapcv.width / CFG.W;
  _cvSY = mapcv.height / CFG.H;
}
/* 预投影成 Path2D 缓存：每帧不再重新投影，缩放动画不再卡顿 */
let _pathGraticule = null, _path110 = null, _path50 = null, _pathStates = null;
const _cpathGen = d3.geoPath(projection);
function _toPath2D(d){ return d ? new Path2D(d) : null; }
// 投影/数据变化时重建缓存（数据加载、窗口尺寸变化、省界加载后调用）
function buildGeoPaths(){
  _pathGraticule = _toPath2D(_cpathGen(d3.geoGraticule10()));
  const mk = feats => (feats ? feats.map(f => _toPath2D(_cpathGen(f))) : null);
  _path110 = mk(worldFeatures110);
  _path50  = mk(worldFeatures50);
  _pathStates = mk(worldStates);
}
function renderMapCanvas(){
  if(!worldFeatures) return;
  const tx = mapTransform.tx, ty = mapTransform.ty, k = mapTransform.k;
  mctx.setTransform(1,0,0,1,0,0);
  mctx.clearRect(0,0,mapcv.width,mapcv.height);
  mctx.setTransform(_cvSX,0,0,_cvSY,0,0);
  // 聚焦（地图全屏）时，海洋底色与裁剪范围都放开到整个画面
  const mt = mapExpanded ? 0 : CFG.AXIS.mapTop;
  const mb = mapExpanded ? CFG.H : CFG.AXIS.mapBot;
  mctx.fillStyle = '#31506a';
  mctx.fillRect(0, mt, CFG.W, mb-mt);
  mctx.save();
  mctx.beginPath(); mctx.rect(0, mt, CFG.W, mb-mt); mctx.clip();
  mctx.translate(tx,ty); mctx.scale(k,k);
  if(_pathGraticule){
    mctx.strokeStyle='rgba(90,150,170,0.28)'; mctx.lineWidth=0.5/k; mctx.stroke(_pathGraticule);
  }
  const feats = worldFeatures;
  const cache = (feats === worldFeatures50) ? _path50 : _path110;
  for(let i=0;i<feats.length;i++){
    const path = cache && cache[i];
    if(!path) continue;
    mctx.fillStyle = countryColor(feats[i].id, i);
    mctx.fill(path);
    mctx.strokeStyle = 'rgba(90,58,28,0.85)'; mctx.lineWidth = (k>4?0.6:0.4)/k; mctx.stroke(path);
  }
  if(mapDetailIs50 && _pathStates){
    mctx.strokeStyle='rgba(140,106,42,0.55)'; mctx.lineWidth=0.4/k;
    for(let i=0;i<_pathStates.length;i++){ const p = _pathStates[i]; if(p) mctx.stroke(p); }
  }
  mctx.restore();
  // Canvas 与 SVG 标签同步：位置/缩放跟随，字号受限
  updateCountryLabels();
}
let _mapRaf = null;
let _animRaf = null;
function scheduleMapRender(){ if(_mapRaf===null) _mapRaf = requestAnimationFrame(()=>{ _mapRaf=null; renderMapCanvas(); }); }
/* 2026-10-19：镜头动画的「预计停稳时刻」
   悬停时代块的政治中心标点要等地图动画结束再落点，否则标点会先出现、再被镜头带着滑走。 */
let __mapAnimEndAt = 0;
function mapAnimRemain(){ return __mapAnimEndAt ? Math.max(0, __mapAnimEndAt - performance.now()) : 0; }

function animateMapTo(tx,ty,k,dur){
  if(_animRaf) cancelAnimationFrame(_animRaf);   // 取消上一次未完成的动画，避免叠加
  __mapAnimEndAt = performance.now() + Math.max(0, dur || 0);   // 记录镜头何时停稳
  const t0 = performance.now(), fx = mapTransform.tx, fy = mapTransform.ty, fk = mapTransform.k;
  (function step(now){
    let p = Math.min(1,(now-t0)/dur);
    p = p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;  // easeInOutCubic
    mapTransform.tx = fx+(tx-fx)*p; mapTransform.ty = fy+(ty-fy)*p; mapTransform.k = fk+(k-fk)*p;
    renderMapCanvas();
    if(p<1) _animRaf = requestAnimationFrame(step);
    else {
      _animRaf = null; __mapAnimEndAt = 0;
      // 镜头停稳 → 补画等待中的悬停标点（保证「先动镜头、后落标点」）
      if(typeof __mapSettled === 'function'){ try{ __mapSettled(); }catch(e){} }
    }
  })(t0);
}

// 古地图风格调色板（12色；下标相邻的色相刻意错开，邻国才不会被分到相近颜色）
const COUNTRY_PALETTE = [
  [45, 40, 62],   // 0 金棕
  [205, 34, 56],  // 1 蓝灰
  [20, 44, 56],   // 2 赭橙
  [155, 28, 46],  // 3 松绿
  [330, 30, 58],  // 4 玫红
  [90, 30, 50],   // 5 青绿
  [240, 28, 58],  // 6 蓝紫
  [60, 38, 58],   // 7 黄
  [0, 36, 60],    // 8 砖红
  [180, 30, 48],  // 9 青
  [270, 26, 58],  // 10 紫
  [115, 28, 46],  // 11 森林绿

let _countryColorMap = {}; // id -> [h,s,l]

// 采样国家边界点的投影坐标（用于网格近邻判定）
function sampleBoundaryPoints(feature, maxPts){
  const pts = [];
  const geom = feature && feature.geometry;
  if(!geom) return pts;
  const polys = geom.type === 'Polygon' ? [geom.coordinates] :
                (geom.type === 'MultiPolygon' ? geom.coordinates : []);
  let total = 0;
  polys.forEach(poly => poly.forEach(ring => { total += ring.length; }));
  if(!total) return pts;
  const step = Math.max(1, Math.floor(total / (maxPts || 420)));
  let idx = 0;
  polys.forEach(poly => poly.forEach(ring => {
    for(let i = 0; i < ring.length; i++){
      if((idx++ % step) !== 0) continue;
      const p = projection(ring[i]);
      if(p && isFinite(p[0]) && isFinite(p[1])) pts.push(p);
    }
  }));
  return pts;
}

// 图着色（Welsh-Powell）：确保相邻国家颜色不同
// 相邻 = 陆路接壤（topojson） + 投影网格近邻（隔海 / 岛屿相望也算）
function computeCountryColors(features, topology){
  const n = features.length;
  const adj = Array.from({length:n}, () => new Set());
  try{
    const nb = topojson.neighbors(topology.objects.countries.geometries);
    for(let i=0;i<n;i++) nb[i].forEach(j => { adj[i].add(j); adj[j].add(i); });
  }catch(e){}
  try{
    // 网格法：把各国边界点撒进 ~22px 的单元格，同格 / 相邻 3×3 格视为“临近”
    // （约覆盖 600km 内的海峡、岛屿间距）
    const CELL = 22;
    const grid = new Map();
    const gkey = (cx, cy) => cx + ',' + cy;
    for(let i=0;i<n;i++){
      const pts = sampleBoundaryPoints(features[i], 420);
      const seen = new Set();
      for(let t=0;t<pts.length;t++){
        const key = gkey(Math.floor(pts[t][0]/CELL), Math.floor(pts[t][1]/CELL));
        if(seen.has(key)) continue;
        seen.add(key);
        let arr = grid.get(key); if(!arr){ arr = []; grid.set(key, arr); }
        arr.push(i);
      }
    }
    for(const [key, arr] of grid){
      if(arr.length < 2) continue;
      const cx = +key.split(',')[0], cy = +key.split(',')[1];
      for(let dx=-1; dx<=1; dx++) for(let dy=-1; dy<=1; dy++){
        const arr2 = grid.get(gkey(cx+dx, cy+dy));
        if(!arr2) continue;
        for(let a=0;a<arr.length;a++) for(let b=0;b<arr2.length;b++){
          const i = arr[a], j = arr2[b];
          if(i !== j){ adj[i].add(j); adj[j].add(i); }
        }
      }
    }
  }catch(e){ console.warn('海邻判定失败', e); }

  // 手工补充的“隔海相望”邻接对（按 ISO 数字 id；确保你指出的组合一定不同色）
  const idIndex = new Map();
  for(let i=0;i<n;i++) idIndex.set(parseInt(String(features[i].id).trim(), 10), i);
  const link = (a, b) => {
    const i = idIndex.get(a), j = idIndex.get(b);
    if(i !== undefined && j !== undefined && i !== j){ adj[i].add(j); adj[j].add(i); }
  };
  [
    [392,410],[392,643],[410,643],                                  // 日本 · 韩国 · 俄罗斯
    [360,608],[608,36],[360,36],                                    // 印尼 · 菲律宾 · 澳大利亚
    [360,144],[144,356],[360,356],                                  // 印尼 · 斯里兰卡 · 印度
    [380,788],[788,724],[724,504],[380,724],[380,504],[788,504],    // 意大利 · 突尼斯 · 西班牙 · 摩洛哥
    [276,752],                                                      // 德国 · 瑞典
    [208,578],[208,528],[208,826],[208,250],                        // 丹麦 · 挪威 · 荷兰 · 英国 · 法国
    [578,528],[578,826],[578,250],[528,826],[528,250],[826,250],
  ].forEach(([a,b]) => link(a,b));

  // 贪心着色：优先处理邻国最多的国家；颜色选「被邻国用得最少」的那一档
  const L = COUNTRY_PALETTE.length;
  const deg = adj.map(s => s.size);
  const order = Array.from({length:n}, (_,i)=>i).sort((a,b)=>deg[b]-deg[a]);
  const colorIdx = new Array(n).fill(-1);
  const cnt = new Array(L);
  for(const i of order){
    cnt.fill(0);
    adj[i].forEach(j => { const cj = colorIdx[j]; if(cj >= 0) cnt[cj]++; });
    let best = 0;
    for(let t=1;t<L;t++) if(cnt[t] < cnt[best]) best = t;
    colorIdx[i] = best;
  }
  // 用户指定「同色」：台湾岛与中国同色、哈萨克与印度同色（优先级高于贪心结果）
  const SAME_COLOR_AS = { 158: 156, 398: 356 };   // 目标国家 id → 参照国家 id
  for(const k in SAME_COLOR_AS){
    const i = idIndex.get(+k), j = idIndex.get(SAME_COLOR_AS[k]);
    if(i !== undefined && j !== undefined) colorIdx[i] = colorIdx[j];
  }

  return {colorIdx, neighbors: adj};
}

// 国家着色：优先使用预计算的邻国不同色结果
function countryColor(id, idx){
  if(_countryColorMap[id] !== undefined){
    const c = _countryColorMap[id];
    return `hsl(${c[0]},${c[1]}%,${c[2]}%)`;
  }
  const c = COUNTRY_PALETTE[(idx || 0) % COUNTRY_PALETTE.length];
  return `hsl(${c[0]},${c[1]}%,${c[2]}%)`;
}

// 经纬度 → 地图坐标（用同一投影，保证与地图一致）
function projectMap(lng, lat){ return projection([lng, lat]) || [0,0]; }

// 绘制国家层（可复用于 110m/50m 切换）
function drawCountries(features){
  const g = mapLayer.select('g.countries').empty() ? mapLayer.append('g').attr('class','countries') : mapLayer.select('g.countries');
  const sel = g.selectAll('path.country').data(features, d => d.id);
  sel.exit().remove();
  const enter = sel.enter().append('path').attr('class','country');
  enter.merge(sel)
    .attr('d', pathGen)
    .attr('fill', (d,i) => countryColor(d.id, i))
    .attr('stroke', '#8c6a2a').attr('stroke-width', 0.5)
    .attr('opacity', 0.82);
}

// 绘制省/州边界（仅放大时显示）
function drawStates(features){
  let g = mapLayer.select('g.states');
  if(g.empty()){ g = mapLayer.append('g').attr('class','states').attr('opacity', 0); }
  const sel = g.selectAll('path.state').data(features, d => d.id || d.properties && d.properties.name || Math.random());
  sel.exit().remove();
  sel.enter().append('path').attr('class','state')
    .merge(sel)
    .attr('d', pathGen)
    .attr('fill','none')
    .attr('stroke','#8c6a2a').attr('stroke-width',0.3).attr('opacity',0.4)
    .attr('stroke-dasharray','1 2');
}

/* ---------- 名称修正表（优先级最高）----------
   数据表 COUNTRY_NAMES 里个别 id↔名称 对错了行，例如：
   · 南非的 id(710) 被配成了 'Zimbabwe'  → 南非位置显示“津巴布韦”
   · 'South Africa' 被配到了东非某国 id  → 标签落到维多利亚湖上
   这里按 id 强制纠正，覆盖数据表中的错配。 */
const COUNTRY_NAME_OVERRIDE = {
  710:'South Africa',   // 南非（原被错配为 Zimbabwe）
  716:'Zimbabwe',
  800:'Uganda',         // 以下为可能承载错误 'South Africa' 的东非/中非国家
  404:'Kenya', 834:'Tanzania', 646:'Rwanda', 108:'Burundi',
  728:'South Sudan', 729:'Sudan', 180:'Dem. Rep. Congo',
};

// 当前启用的国别标注语言：'zh' 中文（默认） | 'en' 英文（备用，改此值即启用）
window.COUNTRY_NAME_LANG = 'zh';

// 名称查找顺序：语言字典（中/英）→ 修正表 → 原数据表 → 兜底表
function getCountryName(id){
  const n = parseInt(String(id).trim(), 10);
  if(isNaN(n)) return null;
  // ① 语言字典优先（键为 3 位补零字符串，见 data/country-names-zh.js / -en.js）
  const dict = (window.COUNTRY_NAME_LANG === 'en') ? window.COUNTRY_NAMES_EN : window.COUNTRY_NAMES_ZH;
  if(dict){
    const pad = String(n).padStart(3, '0');
    if(dict[pad] !== undefined) return dict[pad];
    if(dict[String(n)] !== undefined) return dict[String(n)];
  }
  // ② 名称修正表（次优先）
  if(COUNTRY_NAME_OVERRIDE[n] !== undefined) return COUNTRY_NAME_OVERRIDE[n];
  // ③ 原数据表（兼容旧键格式）
  if(typeof COUNTRY_NAMES !== 'undefined' && COUNTRY_NAMES){
    if(COUNTRY_NAMES[id] !== undefined) return COUNTRY_NAMES[id];
    if(COUNTRY_NAMES[n] !== undefined) return COUNTRY_NAMES[n];
    if(COUNTRY_NAMES[String(n)] !== undefined) return COUNTRY_NAMES[String(n)];
    if(COUNTRY_NAMES[String(n).padStart(3, '0')] !== undefined) return COUNTRY_NAMES[String(n).padStart(3, '0')];
  }
  // ④ 缺失国家兜底表
  if(COUNTRY_NAME_FALLBACK[n] !== undefined) return COUNTRY_NAME_FALLBACK[n];
  return null;
}

  191: [16.6, 45.8],  // 克罗地亚：锚定波斯尼亚左上方（月牙形+达尔马提亚海岸会把质心拉偏）
};
function labelAnchorOf(id){
  return LABEL_ANCHOR[parseInt(String(id).trim(), 10)] || null;
}
// 计算并应用某个国家标签的位置与文字
function placeCountryLabel(d, node){
  let x, y;
  const anc = labelAnchorOf(d.id);
  if(anc){
    const p = projectMap(anc[0], anc[1]);
    x = p[0]; y = p[1];
  } else {
    const [px, py] = projection(d3.geoCentroid(d));
    x = px; y = py;
  }
  const off = labelOffsetOf(d.id);
  if(off){ x += off.dx; y += off.dy; }
  d3.select(node)
    .attr('x', x).attr('y', y)
    .attr('font-size', d._baseFontSize)
    .attr('letter-spacing', d._letterSpacing)
    .text(getCountryName(d.id) || '');
}

// 根据国家面积（球面度）计算字号：大国大字、小国小字，所有国家均标注
function countryFontSize(d){
  const area = d3.geoArea(d); // 球面度，全球约 4π≈12.57
  if(area > 0.5)   return 15;   // 俄罗斯、加拿大、中国、美国、巴西等
  if(area > 0.2)   return 13;   // 澳大利亚、印度、阿根廷等
  if(area > 0.08)  return 11;   // 中等国家
  if(area > 0.02)  return 9;    // 小国
  if(area > 0.005) return 7;    // 更小国家
  return 5;                     // 极小国家也标注（最小字号）
}
// 根据国家面积计算字间距：大国字间距大，小国字间距小或不加间距
function countryLetterSpacing(d){
  const area = d3.geoArea(d);
  if(area > 0.5)   return 3;    // 大国：字间距 3px
  if(area > 0.2)   return 2;    // 较大国家
  if(area > 0.08)  return 1;    // 中等国家
  return 0;                     // 小国及极小国不加间距
}

// 各国标签初始字号上限（以面积最大国的初始字号为上限）
let maxCountryFontSize = 15;

// 根据国家面积比例初始化标签字号上限
function initCountryFontSizes(features){
  maxCountryFontSize = 5;
  features.forEach(d => {
    d._baseFontSize = countryFontSize(d);
    d._letterSpacing = countryLetterSpacing(d);
    maxCountryFontSize = Math.max(maxCountryFontSize, d._baseFontSize);
  });
}

// 更新国家标签的平移/缩放及字号
// 规则：标签组跟随地图平移/缩放；初始最大字号的国恒定不放大，
//       更小的国随放大缓慢增大到「初始最大字号」封顶；欧洲国家放大速度减半。
function updateCountryLabels(){
  const g = mapLayer.select('g.country-labels');
  if(g.empty()) return;
  const {tx, ty, k} = mapTransform;
  // 标签组整体随地图平移/缩放，保证位置始终贴合国土
  g.attr('transform', `translate(${tx},${ty}) scale(${k})`);
  const maxS = maxCountryFontSize;
  // 缩放增益 gain：k=1 时为 0，随放大渐近趋近 1
  const gain = 1 - 1 / k;
  // 欧洲：把缩放进度减半（等效放大速度慢一倍）
  const kEU = 1 + (k - 1) / 2;
  const gainEU = kEU > 1 ? 1 - 1 / kEU : 0;
  g.selectAll('text.clabel').each(function(d){
    const base = d._baseFontSize || countryFontSize(d);
    const gk = isEUCountry(d.id) ? gainEU : gain;
    // base === maxS 的国家：target 恒为 maxS（不随放大变化）
    // base <  maxS 的国家：target 由 base 缓增至 maxS
    const target = base + (maxS - base) * gk;
    const el = d3.select(this);
    // 组已应用 scale(k)，此处除以 k 抵消，使最终显示字号恰为 target
    el.attr('font-size', target / k);
    el.attr('letter-spacing', (d._letterSpacing || 0) / k);
  });
}

// 绘制国家名称标签（概览地图上标注国别，字号和字间距随面积调整）

// 切换地图精度：放大时用 50m + 州界，缩回时用 110m
let mapDetailIs50 = false;
let _statesState = 0;   // 省界加载状态 0=未加载 1=加载中 2=完成
async function ensureStates(){
  if(_statesState !== 0) return;
  _statesState = 1;
  try{
    const stateUrls = [
      'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json',
      'https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json',
      'https://cdn.jsdelivr.net/gh/georgique/world-geojson@develop/countries/india.geo.json',
      'https://cdn.jsdelivr.net/gh/georgique/world-geojson@develop/countries/brazil.geo.json',
      'https://cdn.jsdelivr.net/gh/georgique/world-geojson@develop/countries/australia.geo.json',
      'https://cdn.jsdelivr.net/gh/georgique/world-geojson@develop/countries/russia.geo.json'
    ];
    // 2026-11-04：离线时不要干等 —— 每个请求 4 秒超时，失败静默（只是没有省界，不影响主地图）
    const __sig = () => (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(4000) : undefined;
    const rs = await Promise.all(stateUrls.map(u => fetch(u, { signal: __sig() }).then(r => r.ok ? r.json() : null).catch(()=>null)));
    let ws = [];
    if(rs[0] && rs[0].features) ws = ws.concat(rs[0].features.filter(f => f.properties && f.properties.adcode !== 100000));
    if(rs[1] && rs[1].objects && rs[1].objects.states){ try{ ws = ws.concat(topojson.feature(rs[1], rs[1].objects.states).features); }catch(e){} }
    for(let i=2; i<rs.length; i++){ if(rs[i] && rs[i].features) ws = ws.concat(rs[i].features); }
    worldStates = ws.length ? ws : null;
  }catch(e){ worldStates = null; }
  _statesState = 2;
  buildGeoPaths();                       // 省界就绪后重建缓存
  if(mapDetailIs50){ renderMapCanvas(); }
}
function swapMapDetail(use50m){
  if(use50m === mapDetailIs50) return;   // 幂等：精度未变则跳过重绘
  mapDetailIs50 = !!use50m;
  if(use50m && worldFeatures50){
    worldFeatures = worldFeatures50;
    if(!worldStates) ensureStates();     // 省界懒加载：首次放大时才拉取
  } else if(worldFeatures110){
    worldFeatures = worldFeatures110;
  }
  renderMapCanvas();
}

/* 2026-11-04：地图数据双方案
   · 联网：照旧走 CDN（world-atlas 110m / 50m），精度、标注与国家名称都最好，速度也快
   · 断网：回退到本地内嵌数据（110m 常驻；50m 按需注入 data/world-atlas-50m.js）
   判据：navigator.onLine === false 直接走本地；否则先试 CDN，3 秒拿不到就回退本地。 */
const MAP_CDN = {
  '110': 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
  '50' : 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json'
};
const MAP_LOCAL = { '110': 'data/world-atlas-110m.js', '50': 'data/world-atlas-50m.js' };
function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    const existed = document.querySelector('script[data-map-src="' + src + '"]');
    if (existed){ if (existed.dataset.loaded === '1') return resolve(); existed.addEventListener('load', () => resolve()); existed.addEventListener('error', reject); return; }
    const s = document.createElement('script');
    s.src = src; s.dataset.mapSrc = src;
    s.onload = () => { s.dataset.loaded = '1'; resolve(); };
    s.onerror = () => reject(new Error('本地地图数据缺失：' + src));
    document.head.appendChild(s);
  });
}
async function fetchTopo(level){
  const key = level === '110' ? '__WORLD_110' : '__WORLD_50';
  if (navigator.onLine !== false){                 // 有网（或无法判断）→ 先试 CDN
    try {
      const sig = (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(3000) : undefined;
      const r = await fetch(MAP_CDN[level], { signal: sig });
      if (r.ok) return await r.json();
    } catch (e) { console.warn('地图 CDN 不可用，改用本地数据（' + level + 'm）'); }
  }
  if (window[key]) return window[key];             // 110m 已在内存
  await loadScriptOnce(MAP_LOCAL[level]);          // 50m 按需注入
  return window[key];
}

async function drawMap(){
  try {
    // 110m（概览）+ 50m（放大细节），各自「CDN 优先 / 本地兜底」
    const [topo110, topo50] = await Promise.all([fetchTopo('110'), fetchTopo('50')]);
    if(!topo110 || !topo50) throw new Error('地图数据不可用');
    worldFeatures110 = topojson.feature(topo110, topo110.objects.countries).features;
    worldFeatures50  = topojson.feature(topo50,  topo50.objects.countries).features;

    // 邻国拓扑着色：确保接壤国家颜色不同、对比明显
    const colorRes = computeCountryColors(worldFeatures110, topo110);
    _countryColorMap = {};
    worldFeatures110.forEach((f, i) => {
      _countryColorMap[f.id] = COUNTRY_PALETTE[colorRes.colorIdx[i]];
    });
    // 50m 高精度数据复用同色（按 id 回退）
    worldFeatures50.forEach((f, i) => {
      if(_countryColorMap[f.id] === undefined){
        _countryColorMap[f.id] = COUNTRY_PALETTE[i % COUNTRY_PALETTE.length];
      }
    });

    // 省/州边界改为「地图放大后懒加载」（见 ensureStates）
    worldStates = null;
    worldFeatures = worldFeatures110;
    // 预投影缓存 + 地图由 Canvas 渲染
    buildGeoPaths();
    sizeCanvas();
    renderMapCanvas();
    drawCountryLabels(worldFeatures110);
    updateCountryLabels();
    // 地图标题：放在最下方大面积蓝色海洋（南大洋）中部，半透明显示
    const titleY = CFG.AXIS.mapTop + (CFG.AXIS.mapBot - CFG.AXIS.mapTop) * 0.88;
    mapLayer.append('text').attr('class','map-title').attr('x',CFG.W/2).attr('y',titleY).attr('text-anchor','middle')
      .attr('font-family',"'Ma Shan Zheng',serif").attr('font-size',22).attr('fill','#7ab0c0').attr('opacity',0.30)
      .attr('style','pointer-events:none;text-shadow:0 0 6px rgba(10,20,30,0.5);letter-spacing:4px;')
      .text('世 界  时 空  地 图');
    // 2026-10-19：初始状态直接聚焦「中国全景」（不再从世界全景起步）
    applyBaseView(false);
    document.getElementById('loader').classList.add('hide');
  } catch(e){
    console.warn('地图加载失败，使用降级方案', e);
    mapLayer.append('text').attr('x',CFG.W/2).attr('y',(CFG.AXIS.mapTop+CFG.AXIS.mapBot)/2).attr('text-anchor','middle')
      .attr('fill','#c9a874').attr('font-size',14).text('地图加载失败，请检查网络');
    document.getElementById('loader').classList.add('hide');
  }
}

/* ---------- 时间网格 ---------- */
// 根据缩放倍率 k 选择网格步长（精度随缩放递进）
function stepForZoom(k){
  if(k < 1.5)  return 1000;  // 初期：每1000年
  if(k < 2)    return 500;   // 150%：过渡到每500年
  if(k < 5)    return 300;   // 200%：过渡到每300年
  if(k < 10)   return 200;   // 500%：过渡到每200年
  if(k < 20)   return 100;   // 继续：每100年
  if(k < 30)   return 50;    // 每50年
  return 10;                 // 每10年
}
function formatYear(y){ if(y<0) return '公元前'+(-y); if(y===0) return '公元元年'; return '公元'+y; }

/* ---------- 事件名称清洗 ----------
   事件名称里常带“（前356年）”这类时间注记。时间轴标注上不再显示括号，
   该注记改由「鼠标悬停弹窗」与「抽屉详情」呈现（年份本身已在两处单列）。 */
const _nameSplitCache = new Map();
function splitEventName(raw){
  const key = (raw === null || raw === undefined) ? '' : String(raw);
  if(_nameSplitCache.has(key)) return _nameSplitCache.get(key);
  const notes = [];
  const label = key
    // 仅剥离“含数字/年份信息”的括号，如（前356年）（公元前3世纪）（2024）；
    // 不含时间信息的括号（如（意大利））原样保留
    .replace(/[（(]([^（）()]*)[）)]/g, function(m, inner){
      if(/[0-9０-９]|[年月世纪]|公元/.test(inner)){ notes.push(inner.trim()); return ''; }
      return m;
    })
    .replace(/[\s\u3000]{2,}/g, ' ')
    .replace(/\s+$/, '')
    .trim();
  const res = { label: label, note: notes.join('；') };
  _nameSplitCache.set(key, res);
  return res;
}
/* 悬停弹窗 / 抽屉详情里的时间行：
   若名称原注已含年份信息，优先采用原注本身（保留“约”“年代”“起”等限定，避免信息丢失）；
   原注只是纯数字时补上纪年方式；原注另有额外信息（世纪、跨年区间等）时再附在括号中。 */
function eventYearLine(d){
  const s = splitEventName(d && d.name);
  const y = Number(d && d.year) || 0;
  const std = formatYear(y);
  if(!s.note) return std;
  const nd = s.note.replace(/[^0-9０-９]/g, '');
  const yd = String(Math.abs(y)).replace(/[^0-9]/g, '');
  if(nd && yd && nd === yd){
    // 与原年份数值一致：纯数字原注补纪年方式，其余原样使用（保留“约”“年代”等）
    return /^[0-9０-９]+$/.test(s.note) ? std : s.note;
  }
  if(nd && yd && nd.indexOf(yd) >= 0){
    // 原注本身已含该年份（跨年区间、并列年份等），直接用原注，避免年份出现两次
    return s.note;
  }
  return std + '（' + s.note + '）';
}
function visibleDomain(t){ const inv = sx => xScale.invert((sx - t.x)/t.k); return [inv(0), inv(CFG.W)]; }

function renderGrid(t){

    .merge(vlinesMap)

      .attr('y1', mapTop).attr('y2', mapBot);

  // 垂直参考线 — 合轴段（地图下缘到合轴中线，作时间尺度参考，粗细不随缩放变化）

    .merge(vlinesAxis)
      .attr('x1',d=>xScale(d)).attr('x2',d=>xScale(d))

  const labelData = ticks.map(y => ({y, x: xScale(y)}));

  // 合轴刻度线（以短线段表示尺度，粗细不随缩放变化）
  const ticksMain = gridLayer.selectAll('.mtick').data(ticks, d=>d);
  ticksMain.exit().remove();
  ticksMain.enter().append('line').attr('class','mtick')
      .attr('stroke','#a87b3a').attr('stroke-width',1.2).attr('vector-effect','non-scaling-stroke')

  // 年份文字：放进不缩放的文字层，用屏幕坐标定位 → 既不变形也不模糊
  const tx0 = (t.x || 0), kk = t.k;
  const labels = mainScaleLayer.selectAll('.vlabel').data(labelData, d=>d.y);   // 2026-10-19：改到合轴背景层
  labels.exit().remove();
  labels.enter().append('text').attr('class','vlabel')
      .attr('text-anchor','middle').attr('dominant-baseline','middle')
      .attr('font-family',"'IM Fell English',serif")
      .attr('fill','#fff8e8')
      .attr('stroke','#2a1c0e').attr('stroke-width',2.2).attr('paint-order','stroke')
    .merge(labels)
      .attr('font-size', 10)
      .attr('transform', d=>`translate(${tx0 + d.x * kk},${mainY - 9})`)
      .text(d=> step>=100 ? (d.y<0? -d.y+' BC' : d.y+' AD') : (d.y<0? -d.y : d.y+''));
  // 重绘合轴高亮区域段（跟随缩放/平移更新位置）
  if(highlightAxisEra){ highlightAxisSection(highlightAxisEra); }
}

function fontAt(k, base){
  return Math.max(CFG.FONT.min, Math.min(CFG.FONT.max, base / k));
}

/* ---------- L1: 时代色块（4色交替，字号固定不随缩放变化） ---------- */
// 按起始年份排序：后开始的时代叠加在先开始的时代之上。
// 当新时代出现时，若前面的时代尚未结束，新时代自动置于上层；若有多个未结束时代，新时代置于最上层。
// 顺次衔接的时代（无重叠）不受影响。
const ERAS_SORTED = DATA.eras.slice().sort((a,b) => a.start - b.start);
/* 外国轴「文明链」筛选：window.__eraChainFilter 为空 = 全部显示
   （中国轴是参照轴，始终不参与筛选） */
/* 时间轴上不绘制的时代（数据仍保留在 DATA.eras / CSV / 编辑台中） */
const HIDDEN_ERA_IDS = { prehist: 1 };
function erasForView(){
  const base = ERAS_SORTED.filter(e => !HIDDEN_ERA_IDS[e.id]);
  const f = window.__eraChainFilter;
  if(!f || !f.length) return base;
  const idOf = (window.AtlasChains && AtlasChains.idOf) ? AtlasChains.idOf : (e => e.chain);
  return base.filter(e => e.region !== 'foreign' || f.indexOf(idOf(e)) >= 0);
}
/* 文明链筛选同样作用于事件：
   选了某条链 → 只显示「属于该链」的外国事件（由事件的 era 反查它属于哪条链）。
   中国轴是参照轴，中国事件始终显示、不参与筛选；
   外国事件若没有 era（无法归属），筛选时一并隐藏。 */
function eventsForView(){
  const all = DATA.events;
  const f = window.__eraChainFilter;
  if(!f || !f.length) return all;
  const idOf = (window.AtlasChains && AtlasChains.idOf) ? AtlasChains.idOf : (e => e.chain);
  const eraById = {};
  ERAS_SORTED.forEach(e => { eraById[e.id] = e; });
  return all.filter(e => {
    if(e.region !== 'foreign') return true;   // 中国事件：永远显示
    const era = eraById[e.era];
    if(!era) return false;                    // 无法归属 → 随筛选隐藏
    return f.indexOf(idOf(era)) >= 0;
  });
}
// 持久选中的时代 ID（点击锁定，点击其他时代或空白处切换/取消）

function renderT1(t){
