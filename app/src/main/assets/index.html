  const merged = enter.merge(sel);

  merged.each(function(d){
    const g = d3.select(this);
    const axisY = d.region==='china' ? CFG.AXIS.chinaY : CFG.AXIS.foreignY;
    const x = xScale(d.start);
    const w = Math.max(3, xScale(d.end)-xScale(d.start));
    const eraColor = getEraColor(d.id);
    // 色块左端压到轴标签区 → 淡出（避免挡住轴标签、尤其"外国"的文明链入口点击）
    const __covered = ((t.x || 0) + x * k) < __lblEdge + 4;
    g.select('rect')
      .attr('x',x).attr('y',axisY-12).attr('width',w).attr('height',24).attr('rx',4)
      .attr('fill', eraColor)
      .attr('opacity', __covered ? 0 : blockOpacity).attr('stroke','#3a1a08').attr('stroke-width',0.8)
      .attr('vector-effect','non-scaling-stroke')
      .attr('shape-rendering','geometricPrecision')
      .style('cursor','pointer');
  });

  // 时代名：放进**不缩放的文字层** —— 横向不再被拉宽/压扁，全程清晰
  const lblData = erasForView().map(d => {
    const x = xScale(d.start), w = Math.max(3, xScale(d.end) - xScale(d.start));
    return { id: d.id, name: d.name, start: d.start, end: d.end,
             region: (d.region === 'foreign') ? 'foreign' : 'china',
             sx: (t.x || 0) + x * k + 4,          // 色块左端 +4px（屏幕像素，不乘 k）
             sw: w * k,
             axisY: d.region === 'china' ? CFG.AXIS.chinaY : CFG.AXIS.foreignY };
  }).sort((a, b) => a.start - b.start);

  // ① 显示空间：全览状态下「后一时代起始年 − 本时代起始年」换算成像素。
  //    后一时代取按起始年排序的下一个（**不分文明链**）；末位用自身色块宽度兜底。
  lblData.forEach((o, i) => {
    const next = lblData[i + 1];
    o.avail = next ? (xScale(next.start) - xScale(o.start)) * k : o.sw;
    o.base = o.sw > o.name.length * fontSize * 0.7;      // 参照版规则（中国轴用）
  });

  // ② 显示规则：
  //    · 中国轴 —— 沿用参照版规则（色块宽 > 名称长度 × 字号 × 0.7）
  //    · 外国轴 —— 显示空间 > 31px 的，标注文字全部显示
  //    · 另指定几个：无论空间多少，初始状态都完整显示（不参与裁切）
  const KEEP_FULL = ['以色列', '拜占庭', '塞尔柱'];
  lblData.forEach(o => {
    o.keepFull = (o.region === 'foreign') && KEEP_FULL.some(n => String(o.name).indexOf(n) >= 0);
    o.need = String(o.name).length * fontSize * 1.02 + 4;
    o.show = (o.region === 'foreign') ? (o.avail > 31 || o.keepFull) : o.base;
  });

  // ③ 遮挡：把文字裁在可见空间内 —— 文字层在最上面，色块盖不到它，
  //    所以主动裁掉超出部分，视觉上等同被后一时代色块遮住。
  const lblClipId = 'eraLblClip';
  let lcp = defs.select('#' + lblClipId);
  if(lcp.empty()) lcp = defs.append('clipPath').attr('id', lblClipId);
  const crects = lcp.selectAll('rect').data(lblData, o=>o.id);
  crects.exit().remove();
  crects.enter().append('rect').merge(crects)
    .attr('x', o => o.sx).attr('y', 0)
    .attr('width', o => o.keepFull ? Math.max(o.avail, o.need) : Math.max(0, o.avail))
    .attr('height', CFG.H);
  eraLblLayer.attr('clip-path', `url(#${lblClipId})`);

  const lbs = eraLblLayer.selectAll('.era-lbl').data(lblData, o=>o.id);
  lbs.exit().remove();
  lbs.enter().append('text').attr('class','era-lbl')
      .attr('text-anchor','start').attr('dominant-baseline','middle')
      .attr('font-family',"'Ma Shan Zheng',serif")
      .attr('fill','#fff8e8').attr('pointer-events','none')
    .merge(lbs)
      .attr('font-size', fontSize)
      .attr('transform', o => `translate(${o.sx},${o.axisY + 1})`)
      .attr('opacity', o => (textVisible && o.show) ? 0.98 : 0)
      .text(o => o.name);

  // 时代名称已随色块画在 t1Layer 内（见上），此处不再单独建层

  // 清除所有高亮/选中态（每次重绘时重置）
  merged.classed('highlighted', false).classed('dimmed', false);
  // 若有持久选中态，重绘后重新加回高亮（不上浮图层）
  if(selectedEraId){
    // 2026-10-19：选中块上浮到顶层 —— 时代块彼此重叠，不上浮会被相邻块盖住，
    // 下拉/搜索跳转后就看不出"被选中"
    merged.filter(d=>d && d.id===selectedEraId).classed('highlighted', true).raise();
    merged.filter(d=>d && d.id!==selectedEraId).classed('dimmed', true);
    // 重绘后恢复合轴高亮
    const sel = ERAS_SORTED.find(e=>e.id===selectedEraId);
    if(sel) highlightAxisSection(sel);
  }

  merged.on('mouseenter',function(ev,d){
    showTooltip(ev, `<b>${d.name}</b>`);
    sndHover();  // 划过音效
    // 2026-10-19：先登记悬停对象，再用「政治中心」数据打点（等地图镜头停稳后才显示标点）
    window.__hoverEraId = d.id;
    hoverHighlightEra(d);
    // 高亮当前块，其余块轻微降低对比度；并把当前块上浮到顶层
    // （时代色块彼此重叠，不上浮就会被后来的相邻块盖住）
    d3.select(this).classed('highlighted', true).raise();
    t1Layer.selectAll('.era').filter(function(){ return this !== ev.currentTarget; }).classed('dimmed', true);
    // 高亮合轴对应区域段
    highlightAxisSection(d);
    if(window.__atlasUpdateTerritory){ try{ window.__atlasUpdateTerritory(); }catch(e){} }
  }).on('mousemove',moveTooltip).on('mouseleave',function(){
    hideTooltip(); clearHighlight();
    window.__hoverEraId = null;
    if(window.__atlasUpdateTerritory){ try{ window.__atlasUpdateTerritory(); }catch(e){} }
    // 回到原来的图层顺序（按时代在数据里的先后）
    var __order = erasForView();
    t1Layer.selectAll('.era').sort(function(a,b){ return __order.indexOf(a) - __order.indexOf(b); });
    // 移除高亮与暗化（若有持久选中态，由 click 重新加回）
    t1Layer.selectAll('.era').classed('highlighted', false).classed('dimmed', false);
    if(selectedEraId){
      t1Layer.selectAll('.era').filter(d=>d && d.id===selectedEraId).classed('highlighted', true);
      t1Layer.selectAll('.era').filter(d=>d && d.id!==selectedEraId).classed('dimmed', true);
      // 持久选中态恢复合轴高亮
      const sel = ERAS_SORTED.find(e=>e.id===selectedEraId);
      if(sel) highlightAxisSection(sel);
    } else {
      clearAxisHighlight();
    }
  }).on('click', function(ev,d){
    ev.stopPropagation();
    // 2026-11-06 触屏：时代块没有"明细"可进，单击即选中；顺手把原来 hover 的时代名气泡补一次
    if (TOUCH_UI.coarse){
      showTooltip(ev, '<b>' + d.name + '</b>');
      clearTimeout(window.__eraTipTimer);
      window.__eraTipTimer = setTimeout(function(){ try{ hideTooltip(); }catch(e){} }, 2200);
    }
    sndClick();  // 点击音效
    // 2026-10-19：点哪个轴的时代块，就把「地图基准视图」定成哪边（关抽屉后回到这里）
    mapBase = (d.region === 'foreign') ? 'world' : 'china';
    // 持久选中：再次点击同一时代则取消
    if(selectedEraId === d.id){ selectedEraId = null; clearAxisHighlight(); }
    else {
      selectedEraId = d.id;
      d3.select(this).classed('highlighted', true);
      t1Layer.selectAll('.era').filter(function(){ return this !== ev.currentTarget; }).classed('dimmed', true).classed('highlighted', false);
      highlightAxisSection(d);
    }
    openDrawer(d, 'era');
  });
}

/* ---------- 层级自动显隐的缩放阈值（按朝代读「L2显示缩放 / L3显示缩放」列） ---------- */
function eraZoomMap(lv){
  const def = (lv === 2) ? CFG.TIER.L2_zoom : CFG.TIER.L3_zoom;
  // 全局阈值：取所有朝代里被设置过的**最大值** —— 于是「在表格里改任意一行的值」
  // 就能整体生效（不用逐行改）。没设过的沿用默认值。
  const m = { __def: def, __min: def, __max: def, __use: def };
  const dat = (typeof DATA !== 'undefined' && DATA.eras) ? DATA.eras : [];
  dat.forEach(e => {
    const raw = (lv === 2) ? e.l2Zoom : e.l3Zoom;
    let n = Number(raw);
    if(raw == null || raw === '' || !isFinite(n) || n <= 0) return;   // 没设置 → 用全局默认
    if(n <= 20) n = n * 100;                                          // 兼容只填「5」表示 500%
    m[e.id] = n;
    if(n > m.__max) m.__max = n;
  });
  m.__use = m.__max;               // 实际采用：全局最大值（一个值管全局）
  return m;
}
function zoomAt(map, eraId){ return map.__use; }

/* ---------- 标签布局：多轨错层 + 重要度优先 + 间距抽稀 ----------
   输入 items[i] = { sx, w, imp }   （屏幕 x 坐标 / 标签宽度 / 重要度 1-5）
   输出 out[i]  = { lane, showLabel, visible }
     lane      ：标签所在轨道（0 = 最靠近时间轴），-1 = 没排上标签
     showLabel ：是否显示文字标签
     visible   ：是否显示图标（确保不会互相压住）
   三条规则：
     ① 多轨错层：标签按重要度优先，落进第一条不重叠的轨道（最多 maxLanes 条）
     ② 重要度优先：排不上轨道的，重要度低的先让位 → 只留图标
     ③ 间距抽稀：连图标也排不下（空间不够）就整个不画，放大后自然回来 */
function layoutLabels(items, opt){
  const o = opt || {};
  const maxLanes = o.maxLanes || 6;
  const laneGap  = o.laneGap  || 8;    // 同轨道内标签间至少留的横向空隙
  const minIcon  = o.minIcon  || 14;   // 图标之间至少留的横向间距
  // 2026-10-19：**取消横向让位**（引线回到垂直，标签永远对齐自己的图标）。
  // 排版只在纵向找空轨：从最贴近轴的 0 轨开始，放不下才升一轨 —— 稀疏处 1 行、扎堆处按需多行。
  // 配合更小的 laneH / labelOff 与更少的轨道上限，把「侵占地图」压到最小。
  const out = items.map(() => ({ lane: -1, dx: 0, showLabel: false, visible: false }));

  const laneSeg = [];         // laneSeg[L] = [[x1,x2], ...]
  const laneClash = (L, x1, x2) => {
    const arr = laneSeg[L];
    if (!arr) return false;
    for (let n = 0; n < arr.length; n++){
      const p = arr[n];
      if (!(x1 >= p[1] + laneGap || x2 <= p[0] - laneGap)) return true;
    }
    return false;
  };

  items.map((it, i) => i)
    .sort((a, b) => items[a].sx - items[b].sx)
    .forEach(i => {
      const it = items[i];
      const x1 = it.sx, x2 = x1 + it.w;
      for (let L = 0; L < maxLanes; L++){
        if (laneClash(L, x1, x2)) continue;
        (laneSeg[L] || (laneSeg[L] = [])).push([x1, x2]);
        out[i].lane = L; out[i].showLabel = true; out[i].visible = true;
        return;                                  // 落到最近的空轨即可
      }
    });

  // ② 图标抽稀：拿到标签的照常显示；其余按重要度插空，太挤就不画
  const cell = Math.max(4, minIcon);
  const buckets = {};
  const put = sx => { const b = Math.floor(sx / cell); (buckets[b] || (buckets[b] = [])).push(sx); };
  const clash = sx => {
    const b = Math.floor(sx / cell);
    for (let bb = b - 1; bb <= b + 1; bb++){
      const arr = buckets[bb];
      if (!arr) continue;
      for (let n = 0; n < arr.length; n++) if (Math.abs(arr[n] - sx) < minIcon) return true;
    }
    return false;
  };
  items.forEach((it, i) => { if (out[i].showLabel) put(it.sx); });
  items.map((it, i) => i)
    .filter(i => !out[i].showLabel)
    .sort((a, b) => (items[b].imp || 0) - (items[a].imp || 0) || items[a].sx - items[b].sx)
    .forEach(i => {
      const sx = items[i].sx;
      if (clash(sx)) return;
      out[i].visible = true; put(sx);
    });

  return out;
}

/* ---------- L2: 重大事件（★五角星图标，字号固定，相邻事件文字分列中线上下） ---------- */
/* 2026-11-03：同一年内的先后顺序 —— 组内序号来自 data/sameyear-seq.js（事件名 → [seq, 组内条数]），
   渲染时按 16px 间距左右铺开，避免同年事件叠在同一个 x 上（原因永远在结果左侧）。
   查表走三级：页面名 → 去括号名 → 去标点名，改名/补写的条目也能对上。 */
const SEQ_GAP = 16;
const SEQ_SQ = n => String(n == null ? '' : n).replace(/[\s\u3000《》「」『』“”"'’‘·、,，。.．:：;；\-—_()（）]/g, '');
function seqOf(e){
  if (!e) return null;
  if (e.seq != null && e.seqN > 1) return [e.seq, e.seqN];   // 兼容补丁里直接带 seq 的情况
  const T = window.__SAMEYEAR_SEQ;
  if (!T || !T.map || !e.name) return null;
  let r = T.map[e.name];
  if (!r) r = T.map[String(e.name).replace(/[（(].*?[)）]/g, '').trim()];
  if (!r && T.bySq) r = T.bySq[SEQ_SQ(e.name)];
  return r || null;
}
function seqOffset(e){ const r = seqOf(e); return (r && r[1] > 1) ? (r[0] - (r[1] - 1) / 2) * SEQ_GAP : 0; }

/* L3 层（子事件 / 独立次要事件）的同年序号：先查「父名>>子名」，再查子事件名，最后回退 L2 表 */
function subSeqOf(d){
  const T = window.__SAMEYEAR_SEQ;
  if (!T || !d) return null;
  const nm = d.name || '';
  const pn = d.parentName || d.parent || '';
  const k1 = n => String(n || '').replace(/[（(].*?[)）]/g, '').trim();
  if (T.sub){
    if (pn){
      let r = T.sub[pn + '>>' + nm]; if (r) return r;
      r = T.sub[k1(pn) + '>>' + k1(nm)]; if (r) return r;
    }
    let r = T.sub[nm]; if (r) return r;
    if (T.subSq){ r = T.subSq[SEQ_SQ(nm)]; if (r) return r; r = T.subSq[SEQ_SQ(pn + '>>' + nm)]; if (r) return r; }
  }
  return T.map ? seqOf(d) : null;   // 独立次要事件也有同名 L2 记录时兜底
}
function subSeqOffset(d){ const r = subSeqOf(d); return (r && r[1] > 1) ? (r[0] - (r[1] - 1) / 2) * SEQ_GAP : 0; }
function renderT2(t){
  renderFocusMark(t);                     // 联动定位标记随变换刷新
  const k = t.k;
  const z100 = k * 100;                     // 当前缩放百分比
  const L2max = CFG.TIER.L2_show[1];
  const zmap = eraZoomMap(2);
  const z3 = eraZoomMap(3).__use;
  if(k > L2max || z100 < zmap.__use){ t2Layer.selectAll('*').remove(); return; }
  const labelsOff = (z100 >= z3);   // 进入 L3 区间后：L2 收起说明文字，但★图标全部保留
  const STAR_R = CFG.NODE.L2star;
  const MAIN_R = CFG.NODE.L2main;
  const fontSize = CFG.FONT.L2;

  // [性能优化] 视口裁剪：只渲染当前时间视口内的事件
  const __dom = visibleDomain(t);
  const __pad = (__dom[1]-__dom[0])*0.25 + 30;
  const __evs = eventsForView().filter(e => e.year >= __dom[0]-__pad && e.year <= __dom[1]+__pad)
                               .filter(e => e.tier !== 3)          // 独立 L3 次要事件归第三层
                               .filter(e => z100 >= zoomAt(zmap, e.era));

  // 统一排版：算出每个事件标签的位置（多轨错层 / 重要度优先 / 间距抽稀）
  const __lay = [];
  ['china','foreign'].forEach(region => {
    const idxs = [];
    __evs.forEach((e, i) => { if(e.region === region) idxs.push(i); });
    if(!idxs.length) return;
    const items = idxs.map(i => {
      const nm = splitEventName(__evs[i].name).label;
      return { sx: (t.x || 0) + xScale(__evs[i].year) * k + seqOffset(__evs[i]),
               w: nm.length * fontSize * 1.05 + 12,
               imp: __evs[i].importance || 3 };
    });
    const res = layoutLabels(items, {
      maxLanes: (region === 'china') ? CFG.LAYOUT.chinaLanes : CFG.LAYOUT.foreignLanes,
      laneGap: CFG.LAYOUT.laneGap,
      minIcon: CFG.LAYOUT.minIcon,
    });
    // L3 区间内：L2 收起文字，但保留抽稀结果（图标按最小间距分布，不会挤成一堆）
    idxs.forEach((i, n) => {
      __evs[i].__lay = labelsOff ? { lane: res[n].lane, showLabel: false, visible: res[n].visible } : res[n];
    });
  });

  const sel = t2Layer.selectAll('.ev').data(__evs, (d,i)=>d.name);
  sel.exit().remove();
  const enter = sel.enter().append('g').attr('class','ev');
  const ez = enter.append('g').attr('class','zoomg');  // 悬停放大用（缩放不影响外层定位）
  ez.append('line').attr('class','ev-stem');
  ez.append('line').attr('class','ev-hit-line');       // 引线的透明加粗热区（防悬停断档）
  ez.append('path').attr('class','ev-dot');            // 事件图标（默认★，可由「图标」列换成其他形状）
  ez.append('image').attr('class','ev-img');           // 自定义图片图标（「图标」列填 URL 时用）
  ez.append('circle').attr('class','ev-ring');         // 联动高亮光环（仅被时代脉络联动时显示）
  ez.append('rect').attr('class','ev-label-bg');       // 文字背景（已隐藏）
  ez.append('text').attr('class','ev-label');
  // 2026-10-19：合轴小圆点挂在**不缩放**的外层 —— 悬停放大时它会跟着 zoomg 一起被拉离合轴，
  // 放到外层后位置始终钉在合轴上，发光闪烁时才和「合轴」真正对得上。
  enter.append('circle').attr('class','ev-main-dot');
  // 命中热区放在**不缩放**的外层：悬停放大时它们原地不动，
  // 鼠标不会因元素位移而"掉出→取消→复位→再进入"地闪。
  enter.append('circle').attr('class','ev-hit');        // 图标热区（只覆盖图标）
  enter.append('rect').attr('class','ev-lbl-hit');      // 文字热区（覆盖文字区域）
  const merged = enter.merge(sel);

  merged.each(function(d, i){
    const g = d3.select(this);
    const axisY = d.region==='china' ? CFG.AXIS.chinaY : CFG.AXIS.foreignY;
    const mainY = CFG.AXIS.mainY;
    const x = xScale(d.year);
    // 事件图层不在 zoomLayer 内 → 自行把时间坐标换算成屏幕坐标，元素不做缩放
    const screenX = (t.x || 0) + x * k + seqOffset(d);
    g.attr('transform', `translate(${screenX},0)`);

    const eraC = getEraColor(d.era);
    const txtC = '#2a1c0e'; // 2026-10-18：墨棕正文（旧为乳白 #fff8e8，纸带上对比不足）
    // 2026-10-18：被「时代脉络事件轴」联动的事件 → 放大 + 金色光环高亮
    const __fk = evKey(d);
    const isFocus = !!__tlFocus && (__tlFocus.key === __fk || (!!__tlFocus.parentKey && __tlFocus.parentKey === __fk));
    const r = (d.importance>=5 ? STAR_R : STAR_R*0.75) * (isFocus ? 1.45 : 1);
    if(isFocus) g.classed('ev-focus', true); else g.classed('ev-focus', false);
    const nameText = splitEventName(d.name).label;   // 标注不含括号年份

    // 排版结果：轨道号 / 是否显示文字 / 是否显示图标
    const lay = d.__lay || { lane: 0, showLabel: true, visible: true };
    const dir = (d.region === 'china') ? 1 : -1;     // 中国轴标签向下堆，外国轴向上堆
    const labelY = axisY + dir * (r + CFG.LAYOUT.labelOff + Math.max(0, lay.lane) * CFG.LAYOUT.laneH);
    const showLabel = lay.showLabel || isFocus;
    const iconVis = lay.visible;

    // 引线：从轴上的图标连到标签（只对显示了标签的画），帮助一一对应
    g.select('.ev-stem')
      .attr('x1',0).attr('x2',0).attr('y1',axisY).attr('y2', showLabel ? labelY : axisY)
      .attr('stroke', eraC).attr('stroke-width',0.8).attr('opacity', showLabel ? 0.5 : 0);
    // 引线的透明热区：鼠标从图标滑到文字时不会掉出 hover
    g.select('.ev-hit-line')
      .attr('x1',0).attr('x2',0).attr('y1',axisY).attr('y2', showLabel ? labelY : axisY)
      .attr('stroke','transparent').attr('stroke-width',14)
      .attr('pointer-events', showLabel ? 'stroke' : 'none');

    // 事件图标：默认五角星；「图标」列可指定内置形状或图片 URL
    const iconOp = Math.min(1, 0.8 + (z100 - zoomAt(zmap, d.era))/100*2);
    const imgIcon = isImgIcon(d.icon);
    const iconBox = r * 3.2;
    g.select('.ev-img')
      .attr('href', imgIcon ? String(d.icon).trim() : null)
      .attr('x', -iconBox/2).attr('y', axisY - iconBox/2)
      .attr('width', imgIcon ? iconBox : 0).attr('height', imgIcon ? iconBox : 0)
      .attr('preserveAspectRatio','xMidYMid meet')
      .attr('opacity', (imgIcon && iconVis) ? iconOp : 0)
      .style('pointer-events','none');
    g.select('.ev-dot')
      .attr('d', imgIcon ? null : iconPathOf(d.icon, r, 'star'))
      .attr('transform', `translate(0,${axisY})`)
      .attr('fill', eraC).attr('stroke','#fff8e8').attr('stroke-width',1)
      .attr('opacity', (imgIcon || !iconVis) ? 0 : iconOp)
      .style('cursor','pointer');

    g.select('.ev-main-dot')
      .attr('cx',0).attr('cy',mainY).attr('r', MAIN_R)
      .attr('fill', eraC).attr('stroke','#fff8e8').attr('stroke-width',0.8)
      .attr('opacity', (imgIcon || !iconVis) ? 0 : iconOp * 0.75)
      .style('cursor','pointer');
    // 联动高亮光环（显隐与呼吸动画由 CSS .ev-focus 控制）
    g.select('.ev-ring')
      .attr('cx',0).attr('cy',axisY).attr('r', r + 6)
      .style('pointer-events','none');

    const labelX = r + 2;                   // 2026-10-19：回到垂直引线，标签紧贴自己的图标
    // 背景药丸：深色半透明，保证文字在任何背景上都清晰可读
    const txtW = nameText.length * fontSize * 1.05 + 8;
    // 黑框一律不显示（避免遮挡地图）；可读性靠文字自身的细描边
    g.select('.ev-label-bg').attr('opacity', 0).attr('pointer-events', 'none');
    g.select('.ev-label')
      .attr('x', labelX).attr('y', labelY)
      .attr('font-family',"'Noto Serif SC',serif").attr('font-size', fontSize)
      .attr('fill', txtC)
      // 2026-10-18：米白描边光晕（制图学 halo），替代黑框；纸带上与底色同色、几乎看不见
      .attr('stroke','#f7ecd2').attr('stroke-width',1.8).attr('paint-order','stroke')
      .attr('opacity', showLabel ? 0.92 : 0)          // 常态 92%：清晰又不糊住地图
      .attr('pointer-events','none')                  // 命中判定交给不缩放的文字热区
      .text(showLabel ? nameText : '');
    // 文字热区（不缩放）：覆盖文字所占矩形，负责悬停与点击
    g.select('.ev-lbl-hit')
      .attr('x', labelX - 3).attr('y', labelY - fontSize / 2 - 3)
      .attr('width', showLabel ? txtW : 0).attr('height', fontSize + 6)
      .attr('fill', 'transparent')
      .attr('pointer-events', showLabel ? 'auto' : 'none')
      .attr('style', showLabel ? 'cursor:pointer' : '');
    // 透明点击热区：**严格限定在图标本身**（半径 r+3 的小圆），不延伸到标签 ——
    // 事件密集时热区不会互相覆盖，也不会点错对象。
    g.select('.ev-hit')
      .attr('cx', 0).attr('cy', axisY).attr('r', r + 3)
      .attr('fill', 'transparent')
      .attr('pointer-events', iconVis ? 'auto' : 'none')
      .attr('style', 'cursor:pointer');

    // 2026-10-19：悬停放大以「轴上的图标」为原点（重绘时也要保持，否则动画中 hover 会被打回原位）
    g.select('.zoomg').attr('transform', this.classList.contains('hot')
      ? `translate(0,${axisY}) scale(1.1) translate(0,${-axisY})` : null);
  });

  merged.on('mouseenter',function(ev,d){
    d3.select(this).classed('hot', true);   // 高亮：图标 + 文字 + 引线
    setChildLink(d);                        // 2026-10-25：同时点亮它的 L3 分述
    // 2026-10-19：放大围绕轴上的图标（旧 CSS 以 SVG 顶部为原点 → 外国轴会被甩出 85px）
    const ay = (d.region === 'china') ? CFG.AXIS.chinaY : CFG.AXIS.foreignY;
    d3.select(this).select('.zoomg').attr('transform', `translate(0,${ay}) scale(1.1) translate(0,${-ay})`);
    const s = splitEventName(d.name);
    // 括号中的年份注记移到悬停弹窗中呈现
    let html = `<b>${s.label}</b><span class="yr">${eventYearLine(d)}</span>${d.blurb?`<div>${d.blurb}</div>`:''}`;
    if(d.figures) html += `<div class="mn">人物：${d.figures.join('、')}</div>`;
    if(d.children) html += `<div class="hint">滚动放大查看子事件 · 点击查看详情</div>`;
    else html += `<div class="hint">点击查看详情</div>`;
    showTooltip(ev, html);   // 悬停只出信息气泡；地图标点留到「点击查看详情」时再打
  }).on('mousemove',moveTooltip).on('mouseleave',function(){
    d3.select(this).classed('hot', false);
    d3.select(this).select('.zoomg').attr('transform', null);   // 复位（原点已在轴上，位置不会跳）
    setChildLink(null);                                        // 2026-10-25：撤销分述点亮
    hideTooltip(); clearHighlight();
  }).on('click', function(ev,d){
    if (TOUCH_UI.first(ev, 'ev:' + evKey(d), this)){ ev.stopPropagation(); return; }   // 触屏第一下：先出信息
    openDrawer(d, 'event');
  });
}

/* ---------- L3: 子事件（节点/字号固定不随缩放变形，颜色跟随所属朝代，可点击） ---------- */
/* ---------- 2026-10-25：L2 总括 ↔ L3 分述 联动 ----------
   悬停「总括事件」时，把它名下的分述（children）同时点亮；
   renderT3 每次重绘后调用 applyChildLink()，保证缩放过程中状态不丢。 */
let __linkParent = null;
function setChildLink(d){
  __linkParent = d ? splitEventName(d.name).label : null;
  try{
    t2Layer.selectAll('.ev').classed('linked-parent', function(){
      const dt = this.__data__;
      return !!__linkParent && dt && splitEventName(dt.name).label === __linkParent;
    });
  }catch(e){}
  // 2026-10-25：进入/退出「提级显示」都要重建 L3 层
  // ⚠️ 必须用时间轴的真实 zoom transform（currentTransform / d3.zoomTransform），
  //    不能用 mapTransform（那是地图的平移量），否则提级显示的子事件会整体错位。
  try{
    if(typeof renderT3 === 'function'){
      let t = null;
      try{ if(typeof currentTransform !== 'undefined' && currentTransform) t = currentTransform; }catch(e){}
      if(!t) t = d3.zoomTransform(svg.node());
      renderT3(t);
    }
  }catch(e){}
  applyChildLink();
}
function applyChildLink(){
  try{
    t3Layer.selectAll('.sub').classed('linked', function(s){
      return !!__linkParent && s && s.parentName && splitEventName(s.parentName).label === __linkParent;
    });
  }catch(e){}
}

function renderT3(t){
  const k = t.k;
  const z100 = k * 100;
  const L3max = CFG.TIER.L3_show[1];
  const zmap = eraZoomMap(3);
  // 2026-10-25：悬停 L2 总括时的「提级显示」
  //   1000%~1800%：L3 尚未到显示阈值 → 只渲染该总括名下的分述（临时提级）
  //   1800% 以上：L3 本就显示 → 不做提级，只靠 applyChildLink 高亮
  const __linkMode = !!__linkParent && (z100 < zmap.__use);
  if((k > L3max || z100 < zmap.__use) && !__linkMode){ t3Layer.selectAll('*').remove(); return; }
  const NODE_R = CFG.NODE.L3;
  const fontSize = CFG.FONT.L3;

  const subs = [];
  const __dom3 = visibleDomain(t);
  const __pad3 = (__dom3[1]-__dom3[0])*0.25 + 30;
  if(__linkMode){
    // 悬停提级：只取该总括事件名下的分述，不受当前缩放与视窗限制
    const pe = eventsForView().find(x => x.children && x.children.length && splitEventName(x.name).label === __linkParent);
    if(pe){
      (pe.children||[]).forEach(c=> subs.push({...c, era: c.era || pe.era, parent: splitEventName(pe.name).label,
        parentRegion: pe.region, parentEra: pe.era, parentYear: pe.year, parentName: pe.name, __linked: true}));
    }
    if(!subs.length){ t3Layer.selectAll('*').remove(); return; }
  } else {
  eventsForView().forEach(e=>{
    if(!(e.year>=__dom3[0]-__pad3 && e.year<=__dom3[1]+__pad3)) return;
    if(z100 < zoomAt(zmap, e.era)) return;
    // 独立的 L3 次要事件：它自己就是节点（没有父事件，不代表不重要）
    if(e.tier === 3) subs.push({...e, parent:'', parentRegion:e.region, parentEra:e.era, solo:true});
    (e.children||[]).forEach(c=> subs.push({...c, era: c.era || e.era, parent:splitEventName(e.name).label,
      parentRegion:e.region, parentEra:e.era, parentYear:e.year, parentName:e.name}));
  });

  // 2026-10-25：悬停联动模式 —— 只留该总括名下的分述，并强制显示图标与文字（提级到 L2 观感）
  }

  // 统一排版（与 L2 同一套算法：多轨错层 / 重要度优先 / 间距抽稀）
  ['china','foreign'].forEach(region => {
    const idxs = [];
    subs.forEach((s, i) => { if((s.parentRegion || s.region) === region) idxs.push(i); });
    if(!idxs.length) return;
    const items = idxs.map(i => {
      const nm = splitEventName(subs[i].name).label;
      return { sx: (t.x || 0) + xScale(subs[i].year) * k + subSeqOffset(subs[i]),
               w: nm.length * fontSize * 1.05 + 14,
               imp: subs[i].importance || 3 };
    });
    const res = layoutLabels(items, {
      maxLanes: (region === 'china') ? CFG.LAYOUT.chinaLanes : CFG.LAYOUT.foreignLanes,
      laneGap: CFG.LAYOUT.laneGap,
      minIcon: 12,
    });
    idxs.forEach((i, n) => { subs[i].__lay = res[n]; });   // 挂到数据对象上，避免索引错位
  });

  const sel = t3Layer.selectAll('.sub').data(subs, (d,i)=>i);
  sel.exit().remove();
  const enter = sel.enter().append('g').attr('class','sub');
  const sz = enter.append('g').attr('class','zoomg');  // 悬停放大用（缩放不影响外层定位）
  sz.append('line').attr('class','sub-stem');
  sz.append('line').attr('class','sub-hit-line');      // 引线的透明加粗热区（防悬停断档）
  sz.append('path').attr('class','sub-dot');           // 子事件图标（默认＊，可由「图标」列指定形状）
  sz.append('image').attr('class','sub-img');          // 自定义图片图标
  sz.append('rect').attr('class','sub-label-bg');      // 文字背景（已隐藏）
  sz.append('text').attr('class','sub-label');
  // 命中热区放在**不缩放**的外层（同 L2），避免悬停放大引起鼠标闪烁
  enter.append('circle').attr('class','sub-hit');       // 图标热区（只覆盖图标）
  enter.append('rect').attr('class','sub-lbl-hit');     // 文字热区（覆盖文字区域）
  // 2026-10-19：子事件在合轴上的「投射标点」（菱形 ◇），与 L2 的圆点形成两层对照。
  // ⚠️ 定位必须放在外层 g 上：CSS 的 transform(scale) 会**覆盖**元素自身的 transform 属性，
  //    如果直接给 path 写 translate(0, mainY-axisY)，一旦 hover 放大就会丢掉位移、掉回主轴图标处。
  const smw = enter.append('g').attr('class','sub-main-wrap');
  smw.append('path').attr('class','sub-main-dot');
  const merged = enter.merge(sel);

  merged.each(function(d){
    const g = d3.select(this);
    const axisY = d.parentRegion==='china' ? CFG.AXIS.chinaY : CFG.AXIS.foreignY;
    const x = xScale(d.year);
    const nameText = splitEventName(d.name).label;   // 标注不含括号年份
    // 排版结果：与 L2 同向 —— 中国轴在轴下方、外国轴在轴上方（避免溢出屏幕）
    const lay = d.__lay || { lane: 0, showLabel: true, visible: true };
    // 2026-10-25：悬停时被「提级」的分述 —— 文字与图标强制显示，尺寸接近 L2
    const isLinkedSub = !!d.__linked;
    const fSize = isLinkedSub ? Math.round(CFG.FONT.L2 * 0.95) : fontSize;
    const nodeR = isLinkedSub ? Math.max(NODE_R + 1, CFG.NODE.L2 * 0.85) : NODE_R;
    const off = (d.parentRegion === 'china' ? 1 : -1) * (nodeR + CFG.LAYOUT.labelOff + Math.max(0, lay.lane) * CFG.LAYOUT.laneH);

    const showLabel = isLinkedSub ? true : lay.showLabel;
    const iconVis = isLinkedSub ? true : lay.visible;
    // 屏幕坐标定位（事件图层不在 zoomLayer 内），节点/字号始终保持 1:1
    const screenX = (t.x || 0) + x * k + subSeqOffset(d);
    g.attr('transform', `translate(${screenX},${axisY})`);   // 原点落在时间轴上：图标在轴上，文字在轨道上
    const eraC = getEraColor(d.parentEra);
    const txtC = '#2a1c0e'; // 2026-10-18：墨棕正文（与 L2 事件标注统一）

    // 2026-10-19：与 L2 共用「联动 / 搜索定位」的高亮判定
    // （命中子事件本身 或 命中它的父事件 都算）
    const __fk = evKey(d);
    const __pk = d.parentName ? evKey({ era: d.parentEra, year: d.parentYear, name: d.parentName }) : '';
    const isFocus = !!__tlFocus && (__tlFocus.key === __fk || (!!__pk && (__tlFocus.key === __pk || __tlFocus.parentKey === __pk)));
    if(isFocus) g.classed('sub-focus', true); else g.classed('sub-focus', false);

    g.select('.sub-stem').attr('x1',0).attr('x2',0).attr('y1', 0).attr('y2', off)
      .attr('stroke', eraC).attr('stroke-width',0.5).attr('opacity', showLabel ? 0.45 : 0);
    g.select('.sub-hit-line').attr('x1',0).attr('x2',0).attr('y1', 0).attr('y2', off)
      .attr('stroke','transparent').attr('stroke-width',14)
      .attr('pointer-events', showLabel ? 'stroke' : 'none');
    // 子事件图标：默认＊；「图标」列可指定内置形状或图片 URL
    const subOp = Math.min(1, 0.8 + (z100 - zoomAt(zmap, d.parentEra))/100*2);
    const subImg = isImgIcon(d.icon);
    const subBox = NODE_R * 3.4;
    g.select('.sub-img')
      .attr('href', subImg ? String(d.icon).trim() : null)
      .attr('x', -subBox/2).attr('y', -subBox/2)
      .attr('width', subImg ? subBox : 0).attr('height', subImg ? subBox : 0)
      .attr('preserveAspectRatio','xMidYMid meet')
      .attr('opacity', (subImg && iconVis) ? subOp : 0)
      .style('pointer-events','none');
    g.select('.sub-dot')
      .attr('d', subImg ? null : iconPathOf(d.icon, nodeR, 'asterisk'))
      .attr('fill', eraC).attr('stroke','#fff8e8').attr('stroke-width',0.8)
      .attr('opacity', (subImg || !iconVis) ? 0 : subOp).style('cursor','pointer');
    // 文字背景药丸
    const subTxtW = nameText.length * fSize * 1.05 + 8;
    // 2026-10-25：联动高亮时给文字加一层浅底药丸，保证在任何地图底色上都看得清
    g.select('.sub-label-bg')
      .attr('x', 4).attr('y', off - fSize / 2 - 3)
      .attr('width', showLabel ? nameText.length * fSize * 1.05 + 8 : 0)
      .attr('height', fSize + 8).attr('rx', 4).attr('ry', 4)
      .attr('fill', '#fffaf0')
      .attr('opacity', isLinkedSub ? 0.92 : 0)
      .attr('pointer-events', 'none');
    g.select('.sub-label').attr('x',7).attr('y', off + 4)
      .attr('font-family',"'Noto Serif SC',serif").attr('font-size', fSize).attr('fill', txtC)
      .attr('stroke','#f7ecd2').attr('stroke-width',1.8).attr('paint-order','stroke')
      .attr('opacity', showLabel ? 0.92 : 0)
      .attr('pointer-events','none')
      .text(showLabel ? nameText : '');
    // 文字热区（不缩放）：覆盖文字矩形，负责悬停与点击
    g.select('.sub-lbl-hit')
      .attr('x', 3).attr('y', off - fSize / 2 - 1)
      .attr('width', showLabel ? subTxtW : 0).attr('height', fSize + 6)
      .attr('fill', 'transparent')
      .attr('pointer-events', showLabel ? 'auto' : 'none')
      .attr('style', showLabel ? 'cursor:pointer' : '');
    // 透明点击热区：**严格限定在图标本身**，不延伸到文字
    g.select('.sub-hit')
      .attr('cx', 0).attr('cy', 0).attr('r', nodeR + 3)
      .attr('fill', 'transparent')
      .attr('pointer-events', iconVis ? 'auto' : 'none')
      .attr('style', 'cursor:pointer');
    // 2026-10-19：合轴上的投射标点 —— 菱形 ◇（L2 是圆点，两层一眼可分）
    // 位移写在**外层 wrap** 上，path 自身只负责形状与闪烁（CSS scale 会覆盖 path 的 transform）
    g.select('.sub-main-wrap').attr('transform', `translate(0,${CFG.AXIS.mainY - axisY})`);
    g.select('.sub-main-dot')
      .attr('d', iconPathOf('diamond', CFG.NODE.L2main * 0.95, 'diamond'))
      .attr('fill', eraC).attr('stroke','#fff8e8').attr('stroke-width',0.7)
      .attr('opacity', iconVis ? subOp * 0.72 : 0)
      .style('pointer-events','none');
    // 2026-10-19：子事件层的外层 g 原点已在轴上（translate(screenX, axisY)），
    // 所以放大直接 scale(1.1) 就围绕图标，不会位移
    g.select('.zoomg').attr('transform', this.classList.contains('hot') ? 'scale(1.1)' : null);
  });

  merged.on('mouseenter',function(ev,d){
    d3.select(this).classed('hot', true);   // 高亮：图标 + 文字 + 引线
    d3.select(this).select('.zoomg').attr('transform', 'scale(1.1)');   // 围绕轴上图标放大
    const s = splitEventName(d.name);
    let html = `<b>${s.label}</b><span class="yr">${eventYearLine(d)}</span>${d.blurb?`<div>${d.blurb}</div>`:''}<div class="mn">所属：${d.parent}</div>`;
    if(d.figures) html += `<div class="mn">人物：${d.figures.join('、')}</div>`;
    showTooltip(ev, html);   // 悬停只出信息气泡；地图标点留到「点击查看详情」时再打
  }).on('mousemove',moveTooltip).on('mouseleave',function(){
    d3.select(this).classed('hot', false);
    d3.select(this).select('.zoomg').attr('transform', null);   // 复位
    hideTooltip(); clearHighlight();
  }).on('click', function(ev,d){
      if (TOUCH_UI.first(ev, 'sub:' + evKey(d), this)){ ev.stopPropagation(); return; }
      // 子事件没有 detail/video，但可以打开抽屉并聚焦地图
      openDrawer({...d, detail: d.detail || d.blurb, region: d.parentRegion}, 'event');
    });
  applyChildLink();   // 2026-10-25：重绘后恢复「L2 悬停点亮分述」的状态
}

/* ---------- 地图高亮（标点大小固定，不随地图缩放变化） ---------- */
let mapTransform = {tx:0, ty:0, k:1};   // 当前地图变换参数
let currentHighlight = null;             // {lat, lng, label}

function highlightMap(lat, lng, label, place){
  // 抽屉打开时不更新高亮（由 focusMap 管理）
  if(drawerOpen) return;
  currentHighlight = {lat, lng, label, place: place || ''};
  redrawHighlight();
}

/* 2026-10-19：悬停时代块的地图标点
   ① 数据改用「政治中心」（centers）—— 多政权并立 / 迁都 / 陪都一次全标出，
      标签为「政权*当时都城名」，同城多记录合并；
   ② 时机改为「地图镜头动画停稳后」再落点（否则标点先出现、再被镜头带着滑走）。 */
let __hoverHlTimer = null;
let __hoverHlWanted = false;    // 悬停标点「想要显示」：镜头停稳后由 settle 回调补画
function hoverHighlightEra(era){
  if(drawerOpen) return;
  const pts = eraCenterPoints(era);
  currentHighlight = { lat: era.lat, lng: era.lng, label: era.name, place: era.place || '', eraId: era.id };
  if(pts.length) currentHighlight.centers = pts;
  highlightLayer.selectAll('*').remove();       // 先清掉上一批，免得动画期间残留错位
  __hoverHlWanted = true;
  if(__hoverHlTimer){ clearTimeout(__hoverHlTimer); __hoverHlTimer = null; }
  waitMapThenDrawHighlight(era.id, 0);
}
function waitMapThenDrawHighlight(eraId, tries){
  const wait = mapAnimRemain();
  if(wait > 30 && tries < 60){                  // 镜头还在动 → 等它停稳
    __hoverHlTimer = setTimeout(function(){ waitMapThenDrawHighlight(eraId, tries + 1); }, wait + 30);
    return;
  }
  __hoverHlTimer = null;
  if(window.__hoverEraId !== eraId) return;     // 期间已移开 / 换了时代
  if(drawerOpen || !currentHighlight) return;
  redrawHighlight(true);                        // 淡入浮现
}
/* 镜头停稳回调（animateMapTo 结束时调用）：把等待中的悬停标点补画上去 */
function __mapSettled(){
  if(!__hoverHlWanted) return;
  if(drawerOpen || !currentHighlight || !window.__hoverEraId) return;
  if(mapAnimRemain() > 30) return;
  redrawHighlight(true);
}
function clearHighlight(){

// 根据当前 mapTransform 计算屏幕坐标并绘制固定大小的标点
function redrawHighlight(animateIn){
  highlightLayer.selectAll('*').remove();
  if(!currentHighlight) return;
  const {tx, ty, k} = mapTransform;
  // 支持单个地点，也支持「一个朝代的多个政治中心」同时标出
  // （多政权并立 / 迁都 / 陪都 —— 每点各带自己的存在时间跨度 span）
  const pts = (currentHighlight.centers && currentHighlight.centers.length)
    ? currentHighlight.centers
    : [{ lat: currentHighlight.lat, lng: currentHighlight.lng, label: currentHighlight.label }];
  const multi = pts.length > 1;
  /* 先算好每个点的屏幕坐标：标签用它们做避让，避免互相压住 */
  const scr = pts.map(function(pt){
    if(pt.lat == null || pt.lng == null || isNaN(+pt.lat) || isNaN(+pt.lng)) return null;
    const p = projectMap(+pt.lng, +pt.lat);
    return { x: p[0]*k + tx, y: p[1]*k + ty };
  });
  const placed = [];   // 已占用的标签矩形
  pts.forEach(function(pt, idx){
    const sp = scr[idx];
    if(!sp) return;
    const sx = sp.x;     // 屏幕坐标
    const sy = sp.y;
    const g = highlightLayer.append('g').attr('class','hl');
    if(animateIn){
      // 标点平滑浮现（由小放大 + 淡入），避免突兀弹出
      g.attr('transform', `translate(${sx},${sy}) scale(0.5)`).attr('opacity', 0)
        .transition().duration(320).ease(d3.easeCubicOut)
        .attr('transform', `translate(${sx},${sy}) scale(1)`).attr('opacity', 1);
    } else {
      g.attr('transform', `translate(${sx},${sy})`);
    }
    const ring = g.append('circle').attr('r',18).attr('fill','url(#glow)').attr('opacity',0.9).style('pointer-events','none');
    ring.append('animate').attr('attributeName','r').attr('values','14;34;14').attr('dur','1.8s').attr('repeatCount','indefinite');
    ring.append('animate').attr('attributeName','opacity').attr('values','0.9;0.2;0.9').attr('dur','1.8s').attr('repeatCount','indefinite');
    const isCenter = !!pt.center;
    const dot = g.append('circle')
      .attr('class', isCenter ? 'hl-dot' : null)
      .attr('r', multi ? 4 : 5).attr('fill','#ff4020').attr('stroke','#ffd450').attr('stroke-width',2)
      .style('pointer-events', isCenter ? 'all' : 'none')
      .style('cursor', isCenter ? 'pointer' : 'default');
    if(isCenter){
      // 点政治中心 → 打开「都城档案」抽屉
      dot.on('mouseenter', function(ev){
          const info = (window.__ATLAS_CAPITALS || {})[capCityKey(pt.name)] || {};
          if(typeof showTooltip === 'function') showTooltip(ev,
            '<b>' + pt.label + '</b>' +
            (info.province ? '今 ' + info.province : '') +
            ((pt.start != null && pt.end != null) ? '<div class="yr">' + formatYear(pt.start) + ' — ' + formatYear(pt.end) + '</div>' : '') +
            '<div class="hint">点击查看这座都城的档案</div>');
        })
        .on('mousemove', function(ev){ if(typeof moveTooltip === 'function') moveTooltip(ev); })
        .on('mouseleave', function(){ if(typeof hideTooltip === 'function') hideTooltip(); })
        .on('click', function(ev){ ev.stopPropagation(); openCapitalDrawer(pt); });
    }
    // 标签（政治中心 = 政权*都城名，紧贴标点；事件名沿用原样式）
    const label = pt.label;
    if(label){
      if(isCenter){
        /* 上 / 下 / 右 / 左 依次尝试，避开其它标点与已放标签 */
        const w = label.length * 12.2 + 4, h = 15;
        const cands = [
          { ax: 0, ay: -15, anchor: 'middle', x1: sx - w/2, y1: sy - 27, x2: sx + w/2, y2: sy - 12 },
          { ax: 0, ay: 24,  anchor: 'middle', x1: sx - w/2, y1: sy + 12, x2: sx + w/2, y2: sy + 27 },
          { ax: 17, ay: 5,  anchor: 'start',  x1: sx + 17,   y1: sy - 9,  x2: sx + 17 + w, y2: sy + 6 },
          { ax: -17, ay: 5, anchor: 'end',    x1: sx - 17 - w, y1: sy - 9, x2: sx - 17, y2: sy + 6 }
        ];
        let pick = cands[0], bestCost = Infinity;
        for(let ci = 0; ci < cands.length; ci++){
          const c = cands[ci];
          let cost = 0;
          for(let qi = 0; qi < scr.length; qi++){
            if(qi === idx || !scr[qi]) continue;
            const nx = Math.max(c.x1, Math.min(scr[qi].x, c.x2));
            const ny = Math.max(c.y1, Math.min(scr[qi].y, c.y2));
            if(Math.hypot(scr[qi].x - nx, scr[qi].y - ny) < 8) cost += 10;
          }
          for(let ri = 0; ri < placed.length; ri++){
            const r = placed[ri];
            if(c.x1 < r.x2 + 2 && c.x2 > r.x1 - 2 && c.y1 < r.y2 + 2 && c.y2 > r.y1 - 2) cost += 6;
          }
          if(cost < bestCost){ bestCost = cost; pick = c; }
          if(cost === 0) break;      // 首选完全无冲突的方向
        }
        placed.push({ x1: pick.x1, y1: pick.y1, x2: pick.x2, y2: pick.y2 });
        g.append('text').attr('x', pick.ax).attr('y', pick.ay).attr('text-anchor', pick.anchor)
          .attr('font-family', "'Noto Serif SC',serif")
          .attr('font-size', 12)
          .attr('font-weight', 700)
          .attr('fill', '#ffe9b8')
          .attr('paint-order','stroke')
          .attr('stroke','rgba(24,14,6,0.92)')
          .attr('stroke-width', 3)
          .attr('stroke-linejoin','round')
          .style('pointer-events','none')
          .text(label);
      } else {
        g.append('rect').attr('x',-label.length*7/2-6).attr('y',-46).attr('width',label.length*7+12).attr('height',20).attr('rx',3).attr('fill','rgba(28,18,8,0.92)').attr('stroke','#a87b3a');
        g.append('text').attr('x',0).attr('y',-32).attr('text-anchor','middle')
          .attr('font-family', "'Ma Shan Zheng',serif")
          .attr('font-size', 13)
          .attr('fill', '#f3d896')
          .style('pointer-events','none')
          .text(label);
      }
    }
    // 政治中心不再标年代、不再标现属省市（信息移到点击后的抽屉里）
    if(!isCenter){
      // 该政权 / 政治中心的存在时间跨度（如「前 221 — 前 206」）
      if(pt.span){
        const sw = pt.span.length * 6.6 + 12;
        g.append('rect').attr('x',-sw/2).attr('y',12).attr('width',sw).attr('height',17).attr('rx',3)
          .attr('fill','rgba(28,18,8,0.92)').attr('stroke','#a87b3a');
        g.append('text').attr('x',0).attr('y',24.5).attr('text-anchor','middle')
          .attr('font-family',"'IM Fell English',serif").attr('font-size',11).attr('fill','#c9a874').text(pt.span);
      } else if(k > 1){
        // 位置文案：优先用「地理位置」列填写的文案，其次按坐标反查最近城市
        const loc = lookupLocation(pt.lat, pt.lng);
        const locText = pt.place || (loc ? `${loc.province} · ${loc.name}` : `${(+pt.lat).toFixed(1)}°, ${(+pt.lng).toFixed(1)}°`);
        const lw = locText.length * 6.5 + 12;
        g.append('rect').attr('x',-lw/2).attr('y',12).attr('width',lw).attr('height',18).attr('rx',3)
          .attr('fill','rgba(28,18,8,0.92)').attr('stroke','#a87b3a');
        g.append('text').attr('x',0).attr('y',25).attr('text-anchor','middle')
          .attr('font-family',"'Noto Serif SC',serif").attr('font-size',11).attr('fill','#ffd98a').text(locText);
      }
    }
  });
  // 疆域文字重排：避开刚画出的政治中心点 / 标签
  if(window.__atlasReplanTerrLabels){ try{ window.__atlasReplanTerrLabels(); }catch(e){} }
}

/* ---------- 地图动态放大聚焦 + 切换高精度地图 ---------- */
let mapZoomFactor = 1;
let drawerOpen = false;  // 抽屉打开时阻止 mouseleave 清除标点
/* 2026-10-23：聚焦尺度改为「固定视野跨度」。
   旧逻辑按事件所在国家的包围盒算 k —— 中国恒为 7.4（视野约 1470 km，只看得到省界），
   希腊/以色列却到 38~40（视野仅 274 km，只剩几条街），中外观感相差 5 倍以上。
   新逻辑只与纬度和目标视野有关：中外交一致，远征类事件放宽。 */
const FOCUS_VIEW_KM      = 800;    // 普通事件：横向可见约 800 公里
const FOCUS_VIEW_KM_LONG = 1500;   // 名称含 东征/西征/远征/航海：约 1500 公里
const FOCUS_CENTER_X = 1 / 3;      // 聚焦中心落在页面横向 1/3 处（右侧留给抽屉）
/* 2026-10-27：左侧「中国世界遗产」纵向面板展开时用 2/3 ——
   面板占住左边，标点与视野要落在右侧 2/3 可视区里，重心才不偏左。
   第 7 参 centerXRatio 只改"中心位置"，不改 k（视野大小与其它聚焦完全一致）。 */
const FOCUS_CENTER_X_HP = 2 / 3;
function focusMap(lat, lng, zoomFactor, label, dur, spanKmOverride, centerXRatio){
  const DUR = (dur == null) ? 1800 : dur;
  // 放开地图裁剪：放大后铺满整个画面（覆盖上下时间轴，与抽屉同高）
  setMapClip(true);
  mapExpanded = true;    // Canvas 底图也放开到整屏（海洋底色 + 不裁到地图带）
  // 保存高亮数据（防止 mouseleave 的 clearHighlight 清空）
  currentHighlight = {lat, lng, label: label || (currentHighlight && currentHighlight.label)};

  let tx, ty, k;
  const mapAreaW = CFG.W;
  const mapAreaH = CFG.H;
  // 中心目标：默认页面左侧 1/3 处（横向，右侧留给抽屉）；
  // 世界遗产面板展开时由第 7 参改为右侧 2/3，避免标点被左侧面板遮住
  const cxRatio = (centerXRatio != null && isFinite(centerXRatio)) ? centerXRatio : FOCUS_CENTER_X;
  const cxScreen = CFG.W * cxRatio;
  const cyScreen = CFG.H / 2;

  // 目标视野跨度：远征类放宽到 1500 km，其余 800 km
  // 先剥掉书名号内容，避免《航海条例》这类法案被误判成远航
  const nmForSpan = String(label || '').replace(/《[^》]*》/g, '');
  const isLongRange = /东征|西征|远征|航海/.test(nmForSpan);
  // 2026-10-26：第 6 参可选覆盖（世界遗产多点位遗产按实际跨度取景，默认不影响原行为）
  const spanKm = (spanKmOverride && isFinite(spanKmOverride) && spanKmOverride > 0)
    ? spanKmOverride : (isLongRange ? FOCUS_VIEW_KM_LONG : FOCUS_VIEW_KM);
  // k = 可见宽度(px) × 每像素经度 × 该纬度每度经度的公里数 ÷ 目标公里数
  const kmPerDegLng = 111.32 * Math.max(0.15, Math.cos(lat * Math.PI / 180));  // 极地防除零
  const degPerPx = 360 / CFG.W;
  k = (CFG.W * FOCUS_CENTER_X) * degPerPx * kmPerDegLng / spanKm;
  k = Math.max(4, Math.min(24, k));   // 限制范围（1500 km 在 65°N 约为 3.8，故下限取 4）
  // 以【事件标点本身】为对齐点，落到 cxRatio 指定处（默认左侧 1/3；遗产面板展开时右侧 2/3）
  const dp = projectMap(lng, lat);
  tx = cxScreen - dp[0] * k;
  ty = cyScreen - dp[1] * k;

  mapZoomFactor = k;
  // 关键：此处【不要】预写 mapTransform —— 动画需要以当前状态为起点，
  // 若先写成目标值，animateMapTo 的起止点相同，就会变成“直接弹出”。
  // 切换到 50m 高精度地图
  swapMapDetail(true);
  // 清除旧标点，重置 highlightLayer 的 transform（防止残留）
  highlightLayer.selectAll('*').remove();
  highlightLayer.attr('transform', null);
  // 地图平滑放大（Canvas 动画；放慢以降低卡顿感），标点在放大完成后再浮现
  animateMapTo(tx, ty, k, DUR);
  setTimeout(()=>{ redrawHighlight(true); }, DUR + 30);
  // 兜底：动画结束后再确保一次标点
  setTimeout(()=>{ if(currentHighlight && drawerOpen) redrawHighlight(true); }, DUR + 500);
}
/* ---------- 2026-10-19：地图「基准视图」——中国全景 ⇄ 世界全景 ----------
   默认（初始、关抽屉、鼠标离开后）停在「中国全景」；
   悬停/点击**中国轴**时代色块 → 中国全景，悬停/点击**外国轴** → 世界全景，
   切换一律走 animateMapTo 的 easeInOutCubic，平滑过渡不跳变。 */
let mapBase = 'china';                          // 'china' | 'world'
// 中国全景取景框：严格包住中国各朝代疆域的最大包络（60~143.4°E、16.2~57.6°N），
// 再各留 1~2° 余量 —— 这样悬停某个朝代显示其疆域时，画面不会把疆域切掉。
const CHINA_VIEW_BOX = [58, 13, 146, 60];       // [lng0, lat0, lng1, lat1]

// 把经纬包围盒适配进上/下时间轴之间的地图带，返回 {tx,ty,k}
function viewFitBBox(lng0, lat0, lng1, lat1, padK){
  const pA = projection([lng0, lat1]);          // 西北角 → 左上
  const pB = projection([lng1, lat0]);          // 东南角 → 右下
  if(!pA || !pB) return { tx: 0, ty: 0, k: 1 };
  const bx0 = Math.min(pA[0], pB[0]), bx1 = Math.max(pA[0], pB[0]);
  const by0 = Math.min(pA[1], pB[1]), by1 = Math.max(pA[1], pB[1]);
  const bandH = CFG.AXIS.mapBot - CFG.AXIS.mapTop;
  const padX = CFG.W * (padK == null ? 0.02 : padK);
  const padY = bandH * (padK == null ? 0.02 : padK) * 1.6;
  const availW = Math.max(1, CFG.W - padX * 2);
  const availH = Math.max(1, bandH - padY * 2);
  const bw = Math.max(1, bx1 - bx0), bh = Math.max(1, by1 - by0);
  const k = Math.min(availW / bw, availH / bh);
  const tx = padX + (availW - bw * k) / 2 - bx0 * k;
  const ty = CFG.AXIS.mapTop + padY + (availH - bh * k) / 2 - by0 * k;
  return { tx, ty, k };
}
function baseViewTransform(which){
  if(which === 'world') return { tx: 0, ty: 0, k: 1 };
  return viewFitBBox(CHINA_VIEW_BOX[0], CHINA_VIEW_BOX[1], CHINA_VIEW_BOX[2], CHINA_VIEW_BOX[3], 0.02);
}
/* animate=false → 直接落位（初始加载/窗口尺寸变化）；true → 平滑动画 */
function applyBaseView(animate, dur){
  const v = baseViewTransform(mapBase);
  setMapClip(false);
  mapExpanded = false;
  mapZoomFactor = v.k;
  swapMapDetail(v.k >= 3);                 // 中国全景用 50m 细节 + 省/州界
  if(animate){
    // 镜头要动：先撤掉旧标点（否则会停在旧坐标上被镜头"甩"走），停稳后由 __mapSettled 补画
    highlightLayer.selectAll('*').remove();
    animateMapTo(v.tx, v.ty, v.k, dur == null ? 800 : dur);
  } else {
    if(_animRaf){ cancelAnimationFrame(_animRaf); _animRaf = null; }
    mapTransform.tx = v.tx; mapTransform.ty = v.ty; mapTransform.k = v.k;
    renderMapCanvas();
  }
}

function resetMap(){
  setMapClip(false);   // 收回地图裁剪，回到上/下时间轴之间那条带
  mapExpanded = false;
  highlightLayer.selectAll('*').remove();
  highlightLayer.attr('transform', null);
  // 2026-10-19：不再固定缩回世界全景，而是回到「当前基准视图」（中国 / 世界）
  applyBaseView(true, 1000);
  // 抽屉关闭后清除高亮
  if(!drawerOpen){ currentHighlight = null; }
}

/* ---------- 时代发展与脉络图（纯 SVG 自动生成，供 L1 抽屉使用）----------
   数据来源（全部来自现有字段 + 可 CSV 覆盖的「历史分期」列）：
     · 分期色带：era.stages（或 data/era-stages.js 默认表）；都为空则自动切三段
     · 事件节点：该时代下的事件/子事件（年份 / 重要性 / 是否 L3）
     · 密度条  ：事件按时间分箱统计，反映该时代的起伏节奏
   点节点 → 打开该事件抽屉（含地图聚焦）。 */
let __lastFlowEvs = [];
function eraEventsOf(eraId){
  const out = [];
  (DATA.events || []).forEach(function (e) {
    if (String(e.era) !== String(eraId)) return;
    if (typeof e.year === 'number') out.push({ ref: e, year: e.year, name: e.name, importance: e.importance || 3, sub: false });
    (e.children || []).forEach(function (c) {
      if (typeof c.year === 'number') out.push({ ref: c, parent: e, year: c.year, name: c.name, importance: c.importance || 2, sub: true });
    });
  });
  return out.sort(function (a, b) { return a.year - b.year; });
}
function eraTopFigures(eraId){
  const cnt = {};
  (DATA.events || []).forEach(function (e) {
    if (String(e.era) !== String(eraId)) return;
    (e.figures || []).forEach(function (f) { cnt[f] = (cnt[f] || 0) + 1; });
  });
  return Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).slice(0, 8);
}
/* ------------------------------------------------------------
   「时代脉络」只保留开创 / 转折 / 灭亡性的关键事件
   ------------------------------------------------------------ */
const EF_OPEN = /(建立|建国|开国|立国|建号|称帝|称王|称汗|称制|定都|入关|定鼎|东迁|南渡|代汉|代魏|代晋|代周|代齐|统一|并六国|灭六国|建制|创制|改制|变法|新政|中兴|改革|革命|独立|开凿|修筑|立宪|之治|盛世|治世|开疆|北击|南征|设郡|置郡|通西域|凿空|灭)/;
const EF_TURN = /(之变|之乱|之战|之役|起义|叛乱|入侵|南迁|北伐|东征|西征|围城|兵变|政变|危机|条约|和议|会盟|灭佛|党争|兵败|陷落|迁都|夺门)/;
const EF_FALL = /(灭亡|覆亡|亡国|被灭|终结|逊位|退位|投降|陷落|覆灭|崩溃|败亡|驾崩|之死|国灭|亡$)/;
function efKind(name){
  const t = String(name || '');
  if (EF_FALL.test(t)) return 'fall';
  if (EF_TURN.test(t)) return 'turn';
  if (EF_OPEN.test(t)) return 'open';
  return '';
}
/* 事件名压成适合轴标签的短名：去掉《书名》、去掉尾部的「和/与」、取分隔符前的主干 */
function efShort(name){
  let s = splitEventName(name).label;
  s = s.replace(/[（）()]/g, '').replace(/《[^》]*》/g, '').replace(/[和与及、，,；;／/]+$/, '').trim();
  const parts = s.split(/[／/、，,；;]/).filter(Boolean);
  if (parts.length > 1 && parts[0].length >= 2) s = parts[0];
  if (!s) s = splitEventName(name).label;
  return s.length > 7 ? (s.slice(0, 7) + '…') : s;
}
/* 评分挑选：重要度为主，关键词加成，首末事件优先，彼此拉开时间距离；
   先选带「开创/转折/灭亡」属性的，数量不足 5 个时才用普通高重要度事件补足 */
function pickKeyEvents(evs, span, maxN){
  const withKind = evs.map(function (e) { return Object.assign({}, e, { kind: efKind(e.name) }); });
  if (withKind.length <= maxN) return withKind;
  const scored = withKind.map(function (e, i) {
    let sc = (e.importance || 3) * 2;
    if (e.kind === 'open') sc += 3;
    else if (e.kind === 'turn') sc += 3;
    else if (e.kind === 'fall') sc += 4;
    if (i === 0) sc += 2;
    if (i === withKind.length - 1) sc += 2;
    if (e.sub) sc -= 2;
    return { e: e, sc: sc, i: i };
  }).sort(function (a, b) { return b.sc - a.sc || a.i - b.i; });
  const gap = Math.max(span * 0.03, 1);
  const picked = [], seenName = {};
  function tryAdd(c) {
    if (picked.length >= maxN) return false;
    const nm = efShort(c.e.name);                 // 同名事件（如两次张骞通西域）只留一个
    if (seenName[nm]) return false;
    if (picked.some(function (p) { return Math.abs(p.e.year - c.e.year) < gap; })) return false;
    seenName[nm] = 1; picked.push(c); return true;
  }
  scored.forEach(function (c) { if (c.e.kind) tryAdd(c); });
  if (picked.length < Math.min(5, maxN)) scored.forEach(function (c) { if (!c.e.kind) tryAdd(c); });
  return picked.sort(function (a, b) { return a.e.year - b.e.year; }).map(function (c) { return c.e; });
}
function renderEraFlow(era){
  const W = 340, L = 10, R = 10, pw = W - L - R;
  const s0 = +era.start, s1 = +era.end, span = (s1 - s0) || 1;
  const xs = function (v) { return L + Math.max(0, Math.min(1, (v - s0) / span)) * pw; };
  const col = getEraColor(era.id);

  const evs = eraEventsOf(era.id);
  const keyEvs = pickKeyEvents(evs, span, 7);   // 只保留开创 / 转折 / 灭亡性的关键事件
  __lastFlowEvs = keyEvs;

  // ① 分期
  let stages = [], auto = false;
  try {
    const raw = (window.AtlasPatch && AtlasPatch.eraStages) ? AtlasPatch.eraStages(era) : (era.stages || '');
    stages = (window.AtlasPatch && AtlasPatch.parseStages) ? AtlasPatch.parseStages(raw) : [];
  } catch (e) { stages = []; }
  if (!stages.length) {
    auto = true;
    const d = span / 3;
    stages = [{ name: '前期', start: s0, end: s0 + d }, { name: '中期', start: s0 + d, end: s0 + 2 * d }, { name: '后期', start: s0 + 2 * d, end: s1 }];
  }

  const Y_BAND = 8, H_BAND = 18, Y_AXIS = 50, Y_L1 = 66, Y_L2 = 78, Y_TICK = 94, H = 98;

  let s = '<svg class="era-flow" viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet">';
  /* ① 细分期色带（宽度够才写字，其余靠悬停与下方清单） */
  stages.forEach(function (st, i) {
    const x1 = xs(st.start), w = Math.max(0.6, xs(st.end) - x1);
    const op = (0.85 - (i % 4) * 0.14).toFixed(2);
    s += '<rect class="ef-seg" x="' + x1.toFixed(1) + '" y="' + Y_BAND + '" width="' + w.toFixed(1) + '" height="' + H_BAND + '" rx="2" fill="' + col + '" fill-opacity="' + op + '">' +
         '<title>' + st.name + '（' + formatYear(st.start) + ' — ' + formatYear(st.end) + '）</title></rect>';
    if (w > st.name.length * 10.5 + 6) s += '<text class="ef-seg-t" x="' + (x1 + w / 2).toFixed(1) + '" y="' + (Y_BAND + 12.5) + '" text-anchor="middle">' + st.name + '</text>';
  });
  /* ② 关键事件轴（仅开创 / 转折 / 灭亡） */
  s += '<line class="ef-axis" x1="' + L + '" y1="' + Y_AXIS + '" x2="' + (W - R) + '" y2="' + Y_AXIS + '"/>';
  const lastX = [-999, -999];
  keyEvs.forEach(function (e, i) {
    const x = xs(e.year);
    const kcol = (e.kind === 'fall') ? '#e0603f' : (e.kind === 'turn') ? '#e09a45' : (e.kind === 'open') ? '#f0cf7a' : col;
    const r = ((e.importance || 3) >= 5) ? 4.4 : 3.6;
    s += '<circle class="ef-node" data-i="' + i + '" cx="' + x.toFixed(1) + '" cy="' + Y_AXIS + '" r="' + r + '" fill="' + kcol + '" stroke="#1a1208" stroke-width="1.1">' +
         '<title>' + formatYear(e.year) + ' ' + e.name + '</title></circle>';
    s += '<line x1="' + x.toFixed(1) + '" y1="' + (Y_AXIS + r + 1) + '" x2="' + x.toFixed(1) + '" y2="' + (Y_L1 - 9) + '" stroke="' + kcol + '" stroke-width="0.8" stroke-opacity="0.55"/>';
    const txt = efShort(e.name);
    const wpx = txt.length * 8.6;
    let left = x - wpx / 2 - 3, right = x + wpx / 2 + 3;
    let tx = x, ta = 'middle';
    if (x < 26) { ta = 'start'; tx = 2; left = 0; right = wpx + 6; }
    else if (x > W - 26) { ta = 'end'; tx = W - 2; left = W - wpx - 6; right = W; }
    let row = -1;
    if (left > lastX[0]) row = 0;
    else if (left > lastX[1]) row = 1;
    if (row < 0) return;                      // 太挤就不写字，悬停仍可看
    lastX[row] = right;
    s += '<text class="ef-ev" x="' + tx.toFixed(1) + '" y="' + (row === 0 ? Y_L1 : Y_L2) + '" text-anchor="' + ta + '" fill="' + kcol + '">' + txt + '</text>';
  });
  s += '<text class="ef-tick" x="' + L + '" y="' + Y_TICK + '" text-anchor="start">' + formatYear(s0) + '</text>';
  s += '<text class="ef-tick" x="' + (W - R) + '" y="' + Y_TICK + '" text-anchor="end">' + formatYear(s1) + '</text>';
  s += '</svg>';

  const chips = stages.map(function (st) {
    return '<span class="ef-stage">' + st.name + '<i>' + formatYear(st.start) + '–' + formatYear(st.end) + '</i></span>';
  }).join('');
  return '<div class="era-flow-wrap">' +
    '<div class="ef-head"><span>时代脉络' + (auto ? '<span class="ef-auto">（自动分期）</span>' : '') + '</span>' +
    '<span class="ef-cnt">精选 ' + keyEvs.length + ' / 共 ' + evs.length + ' 事件</span></div>' + s +
    '<div class="ef-stages">' + chips + '</div>' +
    '<div class="ef-hint">点节点看详情 · 悬停看名称 · 分期按治世 / 变乱 / 改革细分</div></div>';
}

/* ---------- 都城：历史名 / 现代城市键 / 标注文案 ---------- */
function capHistName(name){
  const m = String(name == null ? '' : name).match(/（(.+)）\s*$/);
  return m ? m[1] : String(name == null ? '' : name);
}
function capCityKey(name){
  return String(name == null ? '' : name).split('（')[0].split('·')[0].trim();
}
/* 括号里若只是「东都 / 行都 / 首都」这类称号，改用该城的通名 */
const CAP_TITLES = { '东都':1, '西都':1, '南都':1, '北都':1, '南京':1, '北京':1, '东京':1,
                     '西京':1, '京师':1, '行都':1, '陪都':1, '首都':1, '都城':1 };
/* 「魏都洛阳 / 西晋洛阳 / 北魏洛阳」这类前缀其实是政权名，去掉后才是都城本名 */
const CAP_FAC_PREFIX = /^(魏都|蜀都|吴都|西晋|东晋|南朝|北魏|东魏|西魏|北周|前蜀|后蜀|南唐|吴越)/;
function capName(c){
  const key = capCityKey(c.name);
  const info = (window.__ATLAS_CAPITALS || {})[key] || {};
  let hist = capHistName(c.name);
  hist = hist.replace(CAP_FAC_PREFIX, '');
  if(hist.indexOf('·') >= 0){
    const parts = hist.split('·').filter(Boolean)
      .filter(function(p){ return !CAP_TITLES[p] && p !== '北洋政府'; });
    if(parts.length) hist = parts[0];
  }
  hist = hist.split('/')[0];                    // 「仰韶/庙底沟一带」→ 仰韶
  if(CAP_TITLES[hist]) hist = info.city || hist;
  return hist;
}
function capLabel(c){
  return (c.faction ? c.faction + '*' : '') + capName(c);
}

/* 2026-10-19：把一个时代的「政治中心」记录合并成地图标点数组
   —— 同一城市的多条记录（东周洛邑、民国南京分期等）合并成一个点，
   标签统一为「政权*当时都城名」。抽屉与「悬停时代块」共用同一套数据与合并规则。 */
function eraCenterPoints(era){
  const arr = [], byCity = {};
  const list = (era && Array.isArray(era.centers)) ? era.centers : [];
  list.forEach(function(c){
    if(c.lat == null || c.lng == null) return;
    if(isNaN(+c.lat) || isNaN(+c.lng)) return;
    const kk = capCityKey(c.name);
    if(byCity[kk]){
      const ex = byCity[kk];
      if(c.start != null) ex.start = (ex.start == null ? c.start : Math.min(ex.start, c.start));
      if(c.end   != null) ex.end   = (ex.end   == null ? c.end   : Math.max(ex.end, c.end));
      return;
    }
    const pt = {
      lat: c.lat, lng: c.lng,
      label: capLabel(c),                     // 政权*当时都城名（不带省市/年代）
      name: c.name, faction: c.faction || '', place: c.place || '',
      start: c.start, end: c.end, center: true
    };
    byCity[kk] = pt; arr.push(pt);
  });
  return arr;
}

/* ---------- 打开详情抽屉 + 地图聚焦 ---------- */
function openDrawer(d, type){
  if(typeof closeMapFind === 'function') closeMapFind();
  // 抽屉接手地图标点（focusMap 负责）→ 取消「悬停标点待显示」状态，免得关抽屉后又冒出来
  __hoverHlWanted = false;
  if(__hoverHlTimer){ clearTimeout(__hoverHlTimer); __hoverHlTimer = null; }
  // 2026-10-18：不是「脉络联动」打开的抽屉 → 解除上一次的主轴事件联动高亮
  if(!__flowOpening && __tlFocus){
    __tlFocus = null;
    const tt = d3.zoomTransform(svg.node());
    applyTimelineTransform(tt.x, tt.k);
  }
  let html = '';
  const head = splitEventName(d.name);          // 标题不含括号年份
  const isEra = (type === 'era');
  const isCap = (type === 'capital');
  window.__drawerEraId = isEra ? d.id : null;   // 抽屉打开 → 显示该朝代疆域
  if(window.__atlasUpdateTerritory){ try{ window.__atlasUpdateTerritory(); }catch(e){} }
  if(isCap){
    /* 都城详情：现属 / 作为都城的跨度 / 区位战略 / 历代建都清单 */
    const span = (d.minY != null && d.maxY != null)
      ? (formatYear(d.minY) + ' — ' + formatYear(d.maxY)) : '—';
    html += `<h2>${d.hist || head.label}</h2>`;
    html += `<div class="meta">都城档案 · 共 ${(d.rows || []).length} 段建都记录</div>`;
    html += `<div class="body">`;
    html += `<p><b>现属</b>　${d.province || '—'}</p>`;
    html += `<p><b>作为都城</b>　${span}${(d.rows && d.rows.length > 1) ? ('（共 ' + d.rows.length + ' 段）') : ''}</p>`;
    if(d.geo)  html += `<p><b>区位优势 / 战略地位</b>　${d.geo}</p>`;
    if(d.note) html += `<p><b>备注</b>　${d.note}</p>`;
    html += `</div>`;
    if(d.rows && d.rows.length){
      html += `<div class="figures"><b>曾为哪些朝代 / 政权的都城</b><br>`;
      html += d.rows.map(function(r){
        const e = r.era, c = r.c;
        const fac = (c.faction && c.faction !== e.name) ? ('（' + c.faction + '）') : '';
        const yr = (c.start != null && c.end != null)
          ? ('（' + formatYear(c.start) + '—' + formatYear(c.end) + '）') : '';
        return e.name + fac + ' · ' + capHistName(c.name) + yr;
      }).join('<br>');
      html += `</div>`;
    }
    html += `<div class="figures" style="color:#b9a074">点击地图上其它政治中心，可切换查看</div>`;
  } else {
    // 事件：括号中的时间注记移到这里呈现；朝代：起止年份区间
    const yearText = isEra ? (formatYear(d.start)+' — '+formatYear(d.end)) : eventYearLine(d);
    html += `<h2>${head.label}</h2>`;
    if(!d.noYear) html += `<div class="meta">${yearText}</div>`;
    if(isEra){
      html += renderEraFlow(d);                                  // 时代发展与脉络图
      const figs = eraTopFigures(d.id);
      if(figs.length) html += `<div class="figures"><b>关键人物</b><br>${figs.join('、')}</div>`;
    }
    html += `<div class="body">${d.detail || d.blurb || ''}</div>`;
    // 2026-10-23：事件抽屉改为列出「关键人物」；keywords 不再展示，只作为视频搜索词
    if(!isEra && Array.isArray(d.figures) && d.figures.length)
      html += `<div class="figures"><b>关键人物</b><br>${d.figures.join('、')}</div>`;
  }
  // 2026-10-23：视频搜索词 = 事件名 + 关键词（人物优先），提高检索相关性
  const __vname = !isEra && d.name ? splitEventName(d.name).label : '';
  if(__vname){
    const __pool = [];
    if(Array.isArray(d.figures)) __pool.push(...d.figures);
    if(Array.isArray(d.keywords)) __pool.push(...d.keywords);
    const __second = __pool.find(x=>x && x!==__vname && !/^[-—~至到]/.test(x) && x.length<=12) || '';
    const __q = [__vname, __second].filter(Boolean).join(' ');
    const biliUrl = `https://search.bilibili.com/all?keyword=${encodeURIComponent(__q)}`;
    const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(__q)}`;
    html += `<div class="video-links"><a class="v-bili" href="${biliUrl}" target="_blank" rel="noopener">B站观看</a><a class="v-yt" href="${ytUrl}" target="_blank" rel="noopener">YouTube</a></div>`;
  }
  if(d.children && d.children.length){
    html += `<div class="children-list"><b>子事件（点击定位到地图）</b>`;
    d.children.forEach(c=>{
      const cs = splitEventName(c.name);        // 子事件名称同样去掉括号年份
      const cAttr = cs.label.replace(/"/g, '&quot;');
      html += `<div class="child-item" data-lat="${c.lat||''}" data-lng="${c.lng||''}" data-name="${cAttr}">${eventYearLine(c)} · ${cs.label} — ${c.blurb||''}</div>`;
    });
    html += `</div>`;
  }
  drawerContent.innerHTML = html;
  drawer.classList.add('open');
  drawerOpen = true;
  // 点击时代色块 → 只显示该时代的时空标点（事件抽屉则清空）
  if(window.__atlasUpdateTimeMarkers){ try{ window.__atlasUpdateTimeMarkers(); }catch(e){} }
  setTimelineHidden(true);  // 隐藏时间轴（含事件图层）
  sndDrawer();  // 抽屉弹出音效
  drawerContent.querySelectorAll('.child-item').forEach(el=>{
    el.onclick = ()=>{
      const lat=parseFloat(el.dataset.lat), lng=parseFloat(el.dataset.lng);
      if(!isNaN(lat)&&!isNaN(lng)){ focusMap(lat, lng, 5, el.dataset.name); }
    };
  });
  // 脉络图节点：点击 → ① 主轴放大到 1500% 并居中高亮该事件 → ② 再联动地图标点 + 事件抽屉
  // （关闭抽屉后主轴保持联动后的状态；收起抽屉/联动动画/时序都封在 linkTimelineToEvent 里）
  drawerContent.querySelectorAll('.ef-node').forEach(el=>{
    el.onclick = ()=>{
      const it = __lastFlowEvs[+el.dataset.i];
      if(!it || !it.ref) return;
      const obj = it.sub ? Object.assign({}, it.ref, { detail: it.ref.detail || it.ref.blurb, region: (it.parent&&it.parent.region)||it.ref.region }) : it.ref;
      const prevEraId = window.__drawerEraId;   // 时代抽屉的 id（子事件缺 era 时兜底）
      linkTimelineToEvent({
        year: it.year,
        era: obj.era || (it.parent && it.parent.era) || prevEraId || '',
        region: obj.region || (it.parent && it.parent.region) || 'china',
        name: obj.name,
        parentKey: it.sub ? evKey(it.parent) : null
      }, function(){
        openDrawer(obj, 'event');
      });
    };
  });
  if(d.lat && d.lng){
    const prevCenters = (currentHighlight && Array.isArray(currentHighlight.centers)) ? currentHighlight.centers : null;
    const prevPlace = currentHighlight ? currentHighlight.place : '';
    focusMap(d.lat, d.lng, 5, head.label, isCap ? 600 : 1800);
    // 地图标点的位置文案：直接用「地理位置」列（朝代 / 事件都适用）
    if(currentHighlight) currentHighlight.place = d.place || '';
    // 若还录了多个政治中心（多政权并立 / 迁都 / 陪都），一并标出
    if(isEra){
      const cpts = eraCenterPoints(d);           // 与「悬停时代块」共用同一套合并规则
      if(cpts.length) currentHighlight.centers = cpts;
    } else if(isCap && prevCenters && prevCenters.length){
      // 点某个都城时，保留该朝代全部政治中心（方便继续点其它都城）
      currentHighlight.centers = prevCenters;
      currentHighlight.place = prevPlace || '';
    }
  }
}

/* 点击地图上的政治中心 → 打开「都城档案」抽屉
   （现属 / 作为都城的跨度 / 区位战略 / 曾为哪些朝代的都城，均由 centers 实时汇总） */
function openCapitalDrawer(pt){
  const rawName = pt.name || pt.label || '';
  const key = capCityKey(rawName);
  const hist = capName({ name: rawName });
  const info = (window.__ATLAS_CAPITALS || {})[key] || {};
  const rows = [];
  (typeof ERAS_SORTED !== 'undefined' && ERAS_SORTED ? ERAS_SORTED : []).forEach(function(e){
    (e.centers || []).forEach(function(c){
      if(capCityKey(c.name) === key) rows.push({ era: e, c: c });
    });
  });
  rows.sort(function(a, b){
    return (a.c.start == null ? 1e9 : a.c.start) - (b.c.start == null ? 1e9 : b.c.start);
  });
  let minY = null, maxY = null;
  rows.forEach(function(r){
    if(r.c.start != null) minY = (minY == null ? r.c.start : Math.min(minY, r.c.start));
    if(r.c.end != null)   maxY = (maxY == null ? r.c.end   : Math.max(maxY, r.c.end));
  });
  openDrawer({
    name: hist, hist: hist, cityKey: key,
    province: info.province || '', geo: info.geo || '', note: info.note || '',
    rows: rows, minY: minY, maxY: maxY,
    lat: pt.lat, lng: pt.lng, place: info.province || pt.place || ''
  }, 'capital');
}

/* ---------- 缩放：时间轴 X 方向 + 地图独立缩放 ---------- */
let internalZoom = false; // 防止重置 y 时递归触发 zoom 事件

const zoom = d3.zoom()
  .scaleExtent(CFG.SCALE_EXTENT)
  /* 2026-10-19：滚轮单次缩放限幅 —— 原来一格/一次双击就能把 919% 直接顶到 1838%，
     正好跳过「层级二（1000%~1800%）」。限幅后每格最多 ×1.12，1000% 那一档停得住。
     （捏合缩放 ctrlKey 放宽到 0.5，否则触控板太慢） */
  .wheelDelta(function(event){
    const unit = event.deltaMode === 1 ? 0.05 : (event.deltaMode ? 1 : 0.002);
    const cap = event.ctrlKey ? 0.5 : 0.16;          // 2^0.16 ≈ 1.117
    const v = -event.deltaY * unit * (event.ctrlKey ? 6 : 1);
    return Math.max(-cap, Math.min(cap, v));
  })
  // 允许滚轮、鼠标拖拽、双击（拖拽仅 X 方向生效）
  .filter(function(event){
    // 滚轮事件根据鼠标位置决定缩放目标
    // 文明链浮层属于「时间轴操作界面」：在浮层内拖动/滚轮，照常操作时间轴
    const inChainLayer = !!(event.target && event.target.closest && event.target.closest('.chainLayer, .chinaLayer'));
    if(event.type === 'wheel'){
      if(inChainLayer) return true;
      const my = event.clientY - svg.node().getBoundingClientRect().top;
      // 鼠标在地图区域内 → 不处理时间轴缩放（由 mapWheelZoom 处理）
      if(my > CFG.AXIS.mapTop && my < CFG.AXIS.mapBot) return false;
    }
    // mousedown 事件：地图区域内由地图拖拽处理，d3.zoom 不处理
    if(event.type === 'mousedown'){
      if(inChainLayer) return true;      // 浮层内按下 → 照常平移时间轴
      const my = event.clientY - svg.node().getBoundingClientRect().top;

/* ---------- 2026-10-19：悬停轴带 → 切换地图基准视图 ----------
   中国轴（含「中 国」标签与色块空白处）→ 中国全景；外国轴 → 世界全景。
   用 pointermove + 轴带判定（不依赖色块是否被点中），跨过地图区不会误触发。 */
const AXIS_HIT_H = 18;      // 轴带判定半高（色块高 24，再留点余量）
let __axisZone = null;      // 上次命中的轴，避免同一轴内反复触发
// 缓存 svg 的屏幕矩形：pointermove 高频触发，每次都 getBoundingClientRect 会强行触发重排
let __axisRect = null, __axisRectAt = 0;
function axisRectCache(){
  const now = performance.now();
  if(!__axisRect || now - __axisRectAt > 600){
    __axisRect = svg.node().getBoundingClientRect();
    __axisRectAt = now;
  }
  return __axisRect;
}
function axisZoneAt(clientY){
  const r = axisRectCache();
  if(!r || !r.height) return null;
  const my = (clientY - r.top) * (CFG.H / r.height);   // viewBox 是 preserveAspectRatio:none，按比例换算
  if(Math.abs(my - CFG.AXIS.chinaY)   <= AXIS_HIT_H) return 'china';
  if(Math.abs(my - CFG.AXIS.foreignY) <= AXIS_HIT_H) return 'foreign';
  return null;
}
svg.on('pointermove.axisbase', function(ev){
  if(ev.pointerType === 'touch') return;               // 触屏没有 hover 语义
  const z = axisZoneAt(ev.clientY);
  if(z === __axisZone) return;
  __axisZone = z;
  if(!z) return;                                       // 离开轴带 → 保持当前视图
  const want = (z === 'foreign') ? 'world' : 'china';
  if(want === mapBase) return;
  if(svg.classed('dragging')) return;                  // 正在拖地图 → 先不切换视图
  mapBase = want;
  if(drawerOpen) return;         // 抽屉开着（地图全屏聚焦）→ 只记住基准，关抽屉时生效
  applyBaseView(true, 700);      // 平滑切到中国全景 / 世界全景

svg.on('wheel', function(event){

    let newTy = my - cy * newK;

svg.on('pointerdown',function(event){
  // 鼠标：仅左键；触摸/手写笔：直接进入拖拽
  if(event.pointerType === 'mouse' && event.button !== 0) return;
  const my = event.clientY - svg.node().getBoundingClientRect().top;
  // 仅在地图区域内且非时间轴元素时启动地图拖拽（抽屉打开时同样可用）

  if(target.closest('.era') || target.closest('.ev') || target.closest('.sub') || target.closest('.tm-dot') || target.closest('.hl-dot') || target.closest('.h-pt')) return;
  closeMapFind();                       // 一开始拖动/点击就收起上一次的「此地历史」
  svg.classed('dragging',true);
  const startX = event.clientX, startY = event.clientY;
  const startTx = mapTransform.tx, startTy = mapTransform.ty;
  let _raf = null, _moved = 0;
  function _applyDrag(){
    _raf = null;
    scheduleMapRender();
    updateCountryLabels();
    // 拖动过程中让标点跟随地图（直接定位，避免重建导致脉冲动画中断）
    const hl = highlightLayer.select('g.hl');
    if(!hl.empty() && currentHighlight){
      hl.interrupt().attr('opacity', 1);
      const pp = projectMap(currentHighlight.lng, currentHighlight.lat);
      hl.attr('transform', `translate(${pp[0]*mapTransform.k + mapTransform.tx},${pp[1]*mapTransform.k + mapTransform.ty})`);
    }
  }
  function onMove(e){
    // 鼠标：必须仍按着左键；触摸/笔：只要有 move 就算拖拽
    if(e.pointerType === 'mouse' && !(e.buttons & 1)){ onUp(); return; }
    _moved = Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY);
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    mapTransform.tx = startTx + dx;
    mapTransform.ty = startTy + dy;
    // 用 rAF 合并高频 mousemove；拖动过程中不重建标点（结束后统一重绘）
    if(_raf === null) _raf = requestAnimationFrame(_applyDrag);
  }
  function onUp(){
    svg.classed('dragging',false);
    if(_raf !== null){ cancelAnimationFrame(_raf); _raf=null; }
    _applyDrag();
    if(currentHighlight) redrawHighlight();
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    // 位移很小 = 单击（而非拖拽）→ 打开「此地历史」
    if(_moved < 4){
      const rect = svg.node().getBoundingClientRect();
      const mx = startX - rect.left, myPos = startY - rect.top;
      if(myPos > CFG.AXIS.mapTop && myPos < CFG.AXIS.mapBot){
        const bx = (mx - mapTransform.tx) / mapTransform.k;
        const by = (myPos - mapTransform.ty) / mapTransform.k;
        const ll = projection.invert([bx, by]);
        if(ll && isFinite(ll[0]) && isFinite(ll[1])) openMapFind(ll[0], ll[1], mx, myPos);
      }
    }
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  event.preventDefault();
  event.stopPropagation();  // 阻止 d3.zoom 拦截
});

/* ============================================================

const timeLayer = svg.append('g').attr('class','timeLayer').attr('clip-path','url(#mapClip)');
const gTimeMarkers = timeLayer.append('g').attr('class','time-markers');
let _tmEraId = null, _tmK = null, showTimeMarkers = true;
const TM_MAX = 160;   // 单个时代最多显示多少标点（超出按重要性保留）

/* 当前该显示哪个时代的标点：抽屉里是「时代」→ 用它；否则用持久选中态；都没有则不显示 */
function activeTmEraId(){

}
/* 只取「属于该时代」的事件（事件数据里 era 就是时代 id），子事件随父事件一起打点 */
function eventsOfEra(eraId){
  const out = [];
  (DATA.events || []).forEach(function(e){
    if(e.era !== eraId || e.lat == null || e.lng == null) return;
    out.push(e);
    (e.children || []).forEach(function(c){
      if(c.lat != null && c.lng != null){
        out.push(Object.assign({}, c, { __parent: e, region: e.region, era: e.era, parentRegion: e.region }));
      }
    });
  });

}
/* 半径（屏幕像素）：初始故意做小，随地图放大按 k^0.45 增长，封顶 = 调整前的图标尺寸 */
function tmRadiusCap(d){ return 2.4 + (d.importance || 3) * 0.62; }   // 放大上限（原尺寸）
function tmRadiusMin(d){ return 1.4 + (d.importance || 3) * 0.20; }   // k=1 时的初始尺寸
function tmScreenRadius(d, k){
  const cap = tmRadiusCap(d), base = tmRadiusMin(d);
  const grown = base * Math.pow(Math.max(k || 1, 1), 0.45);
  return Math.min(cap, grown);
}
function buildTimeMarkers(eraId){
  let list = eventsOfEra(eraId);
  if(list.length > TM_MAX){
    list = list.slice().sort(function(a,b){ return (b.importance||3)-(a.importance||3); }).slice(0, TM_MAX);
  }
  /* —— 同一地点的事件坐标几乎重合，直接画会叠成一个点且只有一个能点：
        把彼此 ≤1.2px 的点归为一簇，散成「小花瓣」，屏幕偏移不随缩放变化 —— */
  const items = list.map(function(d){
    const p = projectMap(d.lng, d.lat);
    return { d: d, x: p[0], y: p[1] };
  });
  const used = new Array(items.length);
  for(let i = 0; i < items.length; i++){
    if(used[i]) continue;
    const grp = [], queue = [i];
    used[i] = 1;
    while(queue.length){
      const a = queue.pop();
      grp.push(a);
      for(let j = 0; j < items.length; j++){
        if(used[j]) continue;
        if(Math.hypot(items[j].x - items[a].x, items[j].y - items[a].y) <= 1.2){ used[j] = 1; queue.push(j); }
      }
    }
    if(grp.length === 1){
      const it = items[grp[0]];
      it.d.__bx = it.x; it.d.__by = it.y; it.d.__dx = 0; it.d.__dy = 0;
      continue;
    }
    const n = grp.length;
    const ax = grp.reduce(function(s, q){ return s + items[q].x; }, 0) / n;
    const ay = grp.reduce(function(s, q){ return s + items[q].y; }, 0) / n;
    grp.forEach(function(q, idx){
      const ang = -Math.PI / 2 + idx * 2 * Math.PI / n;
      const rr = Math.min(20, (tmRadiusCap(items[q].d) + 1.6) / Math.sin(Math.PI / n));
      items[q].d.__bx = ax; items[q].d.__by = ay;
      items[q].d.__dx = Math.cos(ang) * rr;
      items[q].d.__dy = Math.sin(ang) * rr;
    });
  }
  const key = function(d){ return d.__key || (d.name + '@' + d.year); };
  const sel = gTimeMarkers.selectAll('circle.tm-dot').data(list, key);
  sel.exit().remove();
  const en = sel.enter().append('circle').attr('class','tm-dot');
  en.on('click', function(ev, d){
      ev.stopPropagation();
      openDrawer(Object.assign({}, d, { detail: d.detail || d.blurb, region: d.region || 'china' }), 'event');
    })
    .on('mouseenter', function(ev, d){
      if(typeof showTooltip === 'function') showTooltip(ev, '<b>' + splitEventName(d.name).label + '</b>' + eventYearLine(d));
    })
    .on('mousemove', function(ev){ if(typeof moveTooltip === 'function') moveTooltip(ev); })
    .on('mouseleave', function(){ if(typeof hideTooltip === 'function') hideTooltip(); });
  en.merge(sel).each(function(d){
    const kk = mapTransform.k || 1;
    const col = (d.era && typeof getEraColor === 'function') ? getEraColor(d.era) : '#e8b84b';
    const sub = (d.tier === 3 || !!d.__parent);
    d3.select(this)
      .attr('cx', (d.__bx || 0) + (d.__dx || 0) / kk)
      .attr('cy', (d.__by || 0) + (d.__dy || 0) / kk)
      .attr('r', tmScreenRadius(d, kk) / kk)
      .attr('fill', sub ? 'none' : col)
      .attr('fill-opacity', 0.78)
      .attr('stroke', col).attr('stroke-width', 0.9 / kk)
      .attr('stroke-opacity', 0.9);
  });
  _tmK = mapTransform.k || 1;
  return list.length;
}
function applyTimeTransform(){
  const mt = mapTransform;
  gTimeMarkers.attr('transform', 'translate(' + mt.tx + ',' + mt.ty + ') scale(' + mt.k + ')');
  if(_tmK !== mt.k){
    gTimeMarkers.selectAll('circle.tm-dot')
      .attr('cx', function(d){ return (d.__bx || 0) + (d.__dx || 0) / mt.k; })
      .attr('cy', function(d){ return (d.__by || 0) + (d.__dy || 0) / mt.k; })
      .attr('r', function(d){ return tmScreenRadius(d, mt.k) / mt.k; })
      .attr('stroke-width', 0.9 / mt.k);

}

function _haversine(la1, lo1, la2, lo2){
  const R = 6371, rad = Math.PI / 180;
  const dLa = (la2 - la1) * rad, dLo = (lo2 - lo1) * rad;
  const a = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(la1*rad)*Math.cos(la2*rad)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}
function openMapFind(lng, lat, sx, sy){

    const d = _haversine(lat, lng, e.lat, e.lng);
    if(d <= R) cand.push({ d: d, e: e });
  });
  cand.sort(function(a,b){ return a.d - b.d; });

function terrParse(raw){
  const rings = [];
  String(raw == null ? '' : raw).split('|').forEach(function(seg){
    seg = seg.trim(); if(!seg) return;
    let faction = '', body = seg;
    const at = seg.indexOf('@');
    if(at > 0){ faction = seg.slice(0, at).trim(); body = seg.slice(at + 1); }
    const pts = [];
    body.split(';').forEach(function(pair){
      pair = pair.trim(); if(!pair) return;
      const c = pair.split(',');
      const lng = parseFloat(c[0]), lat = parseFloat(c[1]);
      if(isFinite(lng) && isFinite(lat)) pts.push([lng, lat]);
    });
    if(pts.length >= 3) rings.push({ faction: faction, pts: pts });
  });
  return rings;
}
/* 外国轴并立政权：不在中国政权配色表里时，按名称哈希取色（同一时代内尽量错开） */
const TERR_FAC_PAL = ['#d94f3d','#3d8fd9','#d9b83d','#5fd96b','#b46fd9','#d97f3d','#3dd9c8','#e5679b','#8fb43d','#5b7ce0'];

function terrFactionColor(name){

  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;

/* ---------- 疆域标注：在多边形内找「离边界最深 + 远离政治中心」的位置 ---------- */
let _terrLabels = [];
function terrPointInRing(x, y, ring){
  let c = false;
  for(let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if(((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
function terrSegDist(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function terrRingDepth(px, py, ring){
  let m = Infinity;
  for(let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const d = terrSegDist(px, py, ring[j][0], ring[j][1], ring[i][0], ring[i][1]);
    if(d < m) m = d;
  }
  return m;
}
/* 政治中心的屏幕坐标（用于避让） */
function terrAvoidPoints(){
  const out = [];
  if(!currentHighlight) return out;
  const k = mapTransform.k || 1, tx = mapTransform.tx, ty = mapTransform.ty;
  const push = function(c){
    if(!c || c.lat == null || c.lng == null) return;
    const p = projectMap(+c.lng, +c.lat);
    out.push({ x: p[0] * k + tx, y: p[1] * k + ty });
  };
  if(Array.isArray(currentHighlight.centers) && currentHighlight.centers.length) currentHighlight.centers.forEach(push);
  else push(currentHighlight);
  return out;
}
/* 网格采样：score = 到边界的屏幕距离 − 靠近政治中心的惩罚 */
function terrLabelAnchor(ring, avoid, k, tx, ty){
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  ring.forEach(function(p){ minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
  if(!(maxx > minx) || !(maxy > miny)) return null;
  let best = null, bestScore = -Infinity;
  const N = 14;
  for(let i = 1; i < N; i++){
    for(let j = 1; j < N; j++){
      const x = minx + (maxx - minx) * i / N;
      const y = miny + (maxy - miny) * j / N;
      if(!terrPointInRing(x, y, ring)) continue;
      const depth = terrRingDepth(x, y, ring) * k;      // 换算成屏幕像素
      if(depth < 6) continue;
      const sx = x * k + tx, sy = y * k + ty;
      let nearest = Infinity;
      for(let a = 0; a < avoid.length; a++){
        const d = Math.hypot(avoid[a].x - sx, avoid[a].y - sy);
        if(d < nearest) nearest = d;
      }
      const penalty = Math.max(0, 80 - nearest) * 1.8;
      const score = depth - penalty;
      if(score > bestScore){ bestScore = score; best = { x: x, y: y, depth: depth }; }
    }
  }
  return best;
}
function replanTerrLabels(){
  if(!_terrLabels.length || typeof gTerrShapes === 'undefined') return;
  const k = mapTransform.k || 1, tx = mapTransform.tx, ty = mapTransform.ty;
  const avoid = terrAvoidPoints();
  _terrLabels.forEach(function(L){
    if(!L.el || !L.el.parentNode) return;
    const a = terrLabelAnchor(L.ring, avoid, k, tx, ty);
    const sel = d3.select(L.el);
    if(!a || a.depth < L.size * 0.9){ sel.style('display', 'none'); return; }
    sel.style('display', null)
      .attr('x', a.x)
      .attr('y', a.y + (L.size * 0.36) / k);
  });
}

function buildTerritory(era, animateIn){
  gTerrShapes.selectAll('*').remove();

  const raw = (window.AtlasPatch && AtlasPatch.eraTerritory) ? AtlasPatch.eraTerritory(era) : (era.territory || '');

  const k = mapTransform.k || 1;
  rings.forEach(function(rg){
    const col = terrColor(era, rg.faction);
    const pts = rg.pts.map(function(p){ return projectMap(p[0], p[1]); });
    let d = '';
    pts.forEach(function(xy, i){
      d += (i ? 'L' : 'M') + xy[0].toFixed(2) + ',' + xy[1].toFixed(2);
    });
    d += 'Z';
    gTerrShapes.append('path').attr('d', d)

      .attr('vector-effect','non-scaling-stroke').attr('stroke-linejoin','round')

    if(rg.faction){
      /* 字号随疆域大小自适应（最小 9px，避免小政权文字溢出） */
      let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
      pts.forEach(function(p){
        mnx = Math.min(mnx, p[0]); mxx = Math.max(mxx, p[0]);
        mny = Math.min(mny, p[1]); mxy = Math.max(mxy, p[1]);
      });
      const areaPx = Math.max(1, (mxx - mnx) * k) * Math.max(1, (mxy - mny) * k);
      const size = Math.max(9, Math.min(13, Math.sqrt(areaPx) / 5.5));
      const t = gTerrShapes.append('text')
        .attr('text-anchor','middle').attr('font-family',"'Noto Serif SC',serif")
        .attr('font-size', size / k).attr('font-weight', 700)
        .attr('fill', col).attr('fill-opacity', 0.95)
        .attr('stroke', '#140c04').attr('stroke-width', 2.2 / k).attr('stroke-opacity', 0.78)
        .attr('paint-order','stroke').attr('stroke-linejoin','round')
        .attr('opacity', animateIn ? 0 : 1)
        .attr('pointer-events','none').text(rg.faction);
      _terrLabels.push({ el: t.node(), ring: pts, size: size });
    }
  });
  try{ replanTerrLabels(); }catch(e){}
  if(animateIn && typeof d3 !== 'undefined' && d3.transition){
    try {
      gTerrShapes.selectAll('path').transition().duration(320).ease(d3.easeCubicOut)
        .attr('fill-opacity', 0.30).attr('stroke-opacity', 0.95);
      gTerrShapes.selectAll('text').transition().duration(320).attr('opacity', 1);
    } catch (e) {}
  }
  return rings.length;
}

// 音效：Web Audio API 生成简短提示音
let audioCtx = null;
let soundEnabled = true; // 音效总开关
function playSound(freq, dur, type){
  if(!soundEnabled) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur||0.08));
    osc.start(); osc.stop(audioCtx.currentTime + (dur||0.08));
  }catch(e){}
}
// 柔和音效：使用包络+低通滤波器，避免刺耳
function playSoftTone(freq, dur, vol){
  if(!soundEnabled) return;  // 音效关闭时直接返回
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    filter.type = 'lowpass';
    filter.frequency.value = 800;  // 截止频率低，滤除高频尖锐部分
    filter.Q.value = 0.8;
    const t = audioCtx.currentTime;
    const v = vol || 0.06;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(v, t + 0.02);   // 缓入
    gain.gain.exponentialRampToValueAtTime(0.001, t + (dur||0.2));  // 缓出
    osc.start(t); osc.stop(t + (dur||0.2));
  }catch(e){}
}
// 双音和弦：根音+五度，更柔和丰满
function playChord(rootFreq, dur, vol){
  try{
    playSoftTone(rootFreq, dur, vol);
    playSoftTone(rootFreq * 1.5, dur, (vol||0.06) * 0.5);  // 五度音更轻
  }catch(e){}
}
